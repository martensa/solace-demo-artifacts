# Offline evaluation for the retail ops demo (Improvement
# phase). Apply once before the event, then run:
#   sam config apply -m manifest.yaml
#   sam eval run retail-ops-quality --url https://sam.solace.lab --threshold 0.8
#   sam eval run retail-ops-model-benchmark --url https://sam.solace.lab
kind: manifest
name: retail-ops-eval
description: >-
  Offline evaluation of the retail demo agents for live events
  (dataset + LLM-judge experiment).
target:
  name: solace-lab
  url: https://sam.solace.lab
  auth:
    type: oauth
resources:
  datasets:
    - retail-ops-questions
  experiments:
    - retail-ops-quality
    - retail-ops-model-benchmark
