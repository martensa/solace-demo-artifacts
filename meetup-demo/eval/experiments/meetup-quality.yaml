kind: experiment
name: meetup-quality
description: >-
  Meetup regression check: does the Retail CRM Query Expert answer
  the demo questions correctly? Judged by the seeded LLM Judge
  plus ROUGE overlap against the expected responses.
spec:
  datasetId: retail-demo-questions
  targetAgent: Retail CRM Query Expert
  # Seeded evaluators (exact platform names; there is no "rouge"
  # in 2.225.14 -- the heuristic overlap evaluator is called
  # "Response Match").
  evaluatorIds:
    - LLM Judge
    - Factuality
  primaryEvaluatorId: LLM Judge
  runsPerExample: 1
  maxWorkers: 2
