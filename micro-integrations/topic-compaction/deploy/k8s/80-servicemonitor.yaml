# =============================================================================
# ServiceMonitor: topic-compaction-mi
# Lives in the monitoring namespace next to the kube-prometheus
# stack so the Prometheus operator picks it up. The selector
# crosses into mi-solace-lab to find the Service.
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: topic-compaction-mi
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    app.kubernetes.io/name: topic-compaction-mi
spec:
  namespaceSelector:
    matchNames:
      - mi-solace-lab
  selector:
    matchLabels:
      app.kubernetes.io/name: topic-compaction-mi
  endpoints:
    - port: actuator
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        # Stamp the namespace as a label so the dashboard panels
        # can filter consistently.
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: kubernetes_namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: kubernetes_pod
