# =============================================================================
# Deployment: topic-compaction-mi
# Single-replica per ADR 0002 (HA deferred to V2). The pod runs as
# a hardened workload: non-root, read-only root filesystem, dropped
# capabilities, seccomp default. RocksDB persistence comes from the
# PVC mounted at /var/lib/topic-compaction.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topic-compaction-mi
  namespace: mi-solace-lab
  labels:
    app.kubernetes.io/name: topic-compaction-mi
    app.kubernetes.io/component: workload
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: solace-micro-integrations
spec:
  replicas: 1
  strategy:
    # Recreate (not RollingUpdate) because the PVC is RWO and a
    # second pod cannot mount it during a rollout.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: topic-compaction-mi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: topic-compaction-mi
        app.kubernetes.io/component: workload
        app.kubernetes.io/version: "1.0.0"
      annotations:
        # Trigger rollout when the ConfigMap content changes; populated
        # by start.sh.
        config.checksum/configmap: "PLACEHOLDER"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: registry-solace-lab-pull
      containers:
        - name: topic-compaction-mi
          image: registry.solace.lab/sam-topic-compaction-mi:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: actuator
              containerPort: 8090
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "topic-compaction-mi"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=mi-solace-lab,service.version=1.0.0"
          envFrom:
            - secretRef:
                name: topic-compaction-mi-secret
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: actuator
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: actuator
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: actuator
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60   # 60 * 5s = 5 min cold-start budget
          volumeMounts:
            - name: data
              mountPath: /var/lib/topic-compaction
            - name: config
              mountPath: /app/external/spring/config/
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: topic-compaction-mi-data
        - name: config
          configMap:
            name: topic-compaction-mi-config
        - name: tmp
          emptyDir: {}
