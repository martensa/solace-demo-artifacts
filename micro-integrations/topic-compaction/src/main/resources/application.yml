# =============================================================================
# Internal Micro-Integration Configuration
# This file is packed inside the MI distributable.
# Operators MUST NOT modify this file - external config goes in
# /app/external/spring/config/application.yml (mounted at runtime).
# =============================================================================

spring:
  application:
    name: topic-compaction-mi
  cloud:
    config:
      import-check:
        enabled: false

    stream:
      # [INTERNAL] Pre-create input/output bindings.
      # We reserve 4 each for V1: data ingress, command, lookup-rr, audit-out, replay-out.
      # Extra slack lets operators add custom workflows without rebuilding the image.
      input-bindings: "input-0;input-1;input-2;input-3;input-4;input-5;input-6;input-7"
      output-bindings: "output-0;output-1;output-2;output-3;output-4;output-5;output-6;output-7"

      default-binder: undefined

      default:
        consumer:
          # [INTERNAL] Auto-startup must always be disabled - MI Framework controls lifecycle
          auto-startup: false
          retryable-exceptions.java.lang.InterruptedException: false
          # [INTERNAL] Skip Spring's payload conversion - we want raw bytes
          use-native-decoding: true
          # [INTERNAL] Prevents mutated nested objects from persisting between local retries
          max-attempts: 1
        producer:
          auto-startup: false
          error-channel-enabled: true
          use-native-encoding: true

      # Dummy consumer groups required by the framework
      bindings:
        input-0: {group: group-0}
        input-1: {group: group-1}
        input-2: {group: group-2}
        input-3: {group: group-3}
        input-4: {group: group-4}
        input-5: {group: group-5}
        input-6: {group: group-6}
        input-7: {group: group-7}

      solace:
        default:
          consumer:
            add-destination-as-subscription-to-queue: false
            batch-wait-strategy: immediate
            provision-durable-queue: false
            provision-error-queue: false
            queue-name-expression: "destination"
          producer:
            header-exclusions:
              - id
            provision-durable-queue: false

solace:
  java:
    api-properties:
      pub_ack_window_size: 255
  connector:
    management:
      session:
        reconnect-retries: -1

    # [INTERNAL] Always-Enabled Message Transforms feature - mandatory per MI SDK 3.0+
    default:
      workflow:
        transform:
          enabled: true

    # [INTERNAL] Pre-wire workflows. Operators enable individual workflows
    # via external config (workflows.<idx>.enabled = true).
    workflows:
      0: {input-bindings: [input-0], output-bindings: [output-0]}
      1: {input-bindings: [input-1], output-bindings: [output-1]}
      2: {input-bindings: [input-2], output-bindings: [output-2]}
      3: {input-bindings: [input-3], output-bindings: [output-3]}
      4: {input-bindings: [input-4], output-bindings: [output-4]}
      5: {input-bindings: [input-5], output-bindings: [output-5]}
      6: {input-bindings: [input-6], output-bindings: [output-6]}
      7: {input-bindings: [input-7], output-bindings: [output-7]}

# =============================================================================
# Topic Compaction MI specific settings (defaults; overridable externally)
# =============================================================================
topic-compaction:
  kvstore:
    backend: rocksdb           # rocksdb | caffeine
    rocksdb:
      path: ./data/rocksdb
      max-open-files: 1000
    caffeine:
      maximum-size: 1000000
  compaction:
    audit-suffix: /compacted-ack
    loop-protection-header: x-compacted-replay
    ordering:
      header: ""               # empty = always-last-wins; e.g. "senderTimestamp"
  replay:
    target-suffix: /compacted

# =============================================================================
# Spring Boot Actuator + logging
# =============================================================================
logging:
  level:
    root: warn
    com.solace.labs.mi.topiccompaction: info

management:
  defaults:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus,loggers,logfile,channels,env,workflows,leaderelection,bindings,info"
  endpoint:
    env:
      show-values: WHEN_AUTHORIZED
    prometheus:
      enabled: true
    health:
      status:
        order:
          - DOWN
          - OUT_OF_SERVICE
          - RECONNECTING
          - UP
          - UNKNOWN

server:
  port: 8090
