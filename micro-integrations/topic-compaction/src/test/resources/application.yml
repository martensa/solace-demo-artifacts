# Test-mode defaults: disable all MI workflows so unit tests don't try to start
# Solace bindings. Each integration test re-enables only what it needs.
solace:
  connector:
    workflows:
      0: {enabled: false}
      1: {enabled: false}
      2: {enabled: false}
      3: {enabled: false}
      4: {enabled: false}
      5: {enabled: false}
      6: {enabled: false}
      7: {enabled: false}

logging:
  level:
    root: warn
    com.solace.labs.mi.topiccompaction: debug
