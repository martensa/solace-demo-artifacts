######## mysql ############
get.db.schema.tables=SELECT table_name as "TABLE_NAME" FROM information_schema.tables WHERE table_schema='%s'
get.db.schema.table.columns=SELECT column_name as "COLUMN_NAME", data_type as "DATA_TYPE" FROM information_schema.columns WHERE table_schema='%s' and table_name = '%s'
get.db.schema.table.foreignKeys=SELECT CONSTRAINT_NAME, TABLE_NAME , COLUMN_NAME, REFERENCED_TABLE_NAME AS foreign_table_name, REFERENCED_COLUMN_NAME AS foreign_column_name FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA = '%s' AND TABLE_NAME = '%s' AND REFERENCED_TABLE_SCHEMA IS NOT NULL
