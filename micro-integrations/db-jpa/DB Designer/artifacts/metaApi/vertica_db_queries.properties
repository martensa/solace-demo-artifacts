######### vertica ###########
get.db.schema.tables=SELECT table_name AS "TABLE_NAME" FROM v_catalog.tables WHERE table_schema = '%s'
get.db.schema.table.columns=SELECT column_name AS "COLUMN_NAME", data_type AS "DATA_TYPE" FROM v_catalog.columns WHERE table_schema = '%s' AND table_name = '%s'
get.db.schema.table.foreignKeys=SELECT tc.table_schema, tc.constraint_name, tc.table_name, kcu.column_name, ccu.table_schema AS foreign_table_schema, ccu.table_name AS foreign_table_name, ccu.column_name AS foreign_column_name FROM v_catalog.table_constraints AS tc JOIN v_catalog.key_column_usage AS kcu ON tc.constraint_name = kcu.constraint_name AND tc.table_schema = kcu.table_schema JOIN v_catalog.constraint_column_usage AS ccu ON ccu.constraint_name = tc.constraint_name AND ccu.table_schema = tc.table_schema WHERE ccu.table_schema = '%s' AND tc.constraint_type = 'f' AND tc.table_name = '%s'
