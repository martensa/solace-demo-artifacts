######## mssql ############
get.db.schema.tables=SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA = '%s'
get.db.schema.table.columns=SELECT COLUMN_NAME, DATA_TYPE FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA = '%s' AND TABLE_NAME = '%s'
get.db.schema.table.foreignKeys=SELECT KCU.CONSTRAINT_NAME, KCU.TABLE_NAME, KCU.COLUMN_NAME, FK.TABLE_NAME AS foreign_table_name, FK.COLUMN_NAME AS foreign_column_name FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE KCU INNER JOIN INFORMATION_SCHEMA.REFERENTIAL_CONSTRAINTS RC ON KCU.CONSTRAINT_NAME = RC.CONSTRAINT_NAME INNER JOIN INFORMATION_SCHEMA.CONSTRAINT_COLUMN_USAGE FK ON RC.UNIQUE_CONSTRAINT_NAME = FK.CONSTRAINT_NAME WHERE KCU.TABLE_SCHEMA = '%s' AND KCU.TABLE_NAME = '%s'

