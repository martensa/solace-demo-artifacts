# Overlay for the local Rancher Desktop (k3s) lab.
# k3s uses the docker runtime, so images docker-loaded from the tarballs are
# visible without a registry (pullPolicy IfNotPresent). Reuses the
# solace-lab-infrastructure: nginx ingress + cert-manager (solace-lab-ca-issuer)
# + Kyverno-injected CA trust and registry pull secret.
platform: kubernetes

image:
  services:
    repository: connector_designer_services
    tag: "latest"
    pullPolicy: IfNotPresent
  ui:
    repository: connector_designer_ui
    tag: "latest"
    pullPolicy: IfNotPresent

# Kyverno inject-registry-pull-secret wires this automatically in the lab.
imagePullSecrets: []

ingress:
  enabled: true
  className: nginx
  uiHost: db-designer.solace.lab
  apiHost: db-designer-api.solace.lab
  annotations:
    cert-manager.io/cluster-issuer: solace-lab-ca-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # ~110 MB connector-binary uploads (nginx default limit 1m -> 413).
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  tls:
    enabled: true
    uiSecretName: db-designer-ui-tls
    apiSecretName: db-designer-api-tls

route:
  enabled: false

postgres:
  embedded: true
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""   # local-path (Rancher default)

servicesApp:
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""   # local-path; RWO (single replica)
  # Route entity generation through the DB CLI (jpa-entity-generator).
  # Loads additionals/startup-patch.js via the args override; the tools +
  # templates come from the seed image below.
  dbCli:
    enabled: true
  # Seed image with runtime templates + tooling (tools/, metaApi/,
  # entityTemplate/, ... -- built WITHOUT connectorType/, see
  # artifacts/.dockerignore). Connector binaries stay a user upload via the
  # Designer UI. k3s reads the image from the docker daemon directly.
  artifacts:
    seedImage: db-designer-artifacts-seed:local
    persistence:
      enabled: true
      size: 3Gi
      storageClass: ""

# Vendor images run as root; on k3s that is tolerated. fsGroup 0 keeps mounted
# volumes group-writable.
podSecurityContext:
  fsGroup: 0
  seccompProfile:
    type: RuntimeDefault

# The lab Kyverno policy already injects the CA bundle + SSL_CERT_FILE.
labCaTrust:
  enabled: false

openshift:
  scc:
    create: false
