# Overlay for Red Hat OpenShift (enterprise customer target).
# Uses Routes instead of Ingress. Images come from the DISTRIBUTION BUNDLE
# (release/package-release.sh): the customer pushes them into their own
# registry with scripts/load-and-push.sh, which prints the exact values to
# set below. Set registry, hosts and storageClass before deploying.
platform: openshift

image:
  # HARDENED overlay images: non-root + OpenShift arbitrary-UID compatible,
  # so the workload runs under the default restricted-v2 SCC without
  # cluster-admin. Replace REGISTRY/tag with the output of
  # scripts/load-and-push.sh (any internal registry works, e.g.
  # image-registry.openshift-image-registry.svc:5000/<project>).
  services:
    repository: REGISTRY/connector-designer-services
    tag: "BUNDLE-VERSION"
    pullPolicy: IfNotPresent
  ui:
    repository: REGISTRY/connector-designer-ui
    tag: "BUNDLE-VERSION"
    pullPolicy: IfNotPresent

# Set to the pull secret for the target registry (Kyverno may not be present).
imagePullSecrets:
  - name: registry-pull-secret

ingress:
  enabled: false

route:
  enabled: true
  # Set to the cluster's app domain, e.g. db-designer.apps.<cluster>.<domain>.
  uiHost: ""
  apiHost: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

postgres:
  # Production default on OpenShift: an EXTERNAL / operator-managed Postgres
  # (set host below). The bundled official postgres image pins UID 999, which
  # the restricted-v2 SCC rejects -- so running it embedded on OpenShift would
  # additionally need openshift.scc.create=true (cluster-admin) or swapping to
  # an arbitrary-UID Postgres (CloudNativePG / Crunchy operator, or
  # registry.redhat.io/rhel9/postgresql with an adapted StatefulSet).
  embedded: false
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""        # set to an RWO StorageClass on the cluster
  external:
    host: ""                # REQUIRED when embedded=false
    port: 5432

servicesApp:
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  # Entity generation via the DB CLI (loads the startup patch). Requires the
  # artifacts seed image below for the tools/templates.
  dbCli:
    enabled: true
  # The seed image ships in the distribution bundle (release/
  # package-release.sh) and is pushed into the CUSTOMER registry by
  # scripts/load-and-push.sh, which prints the exact value to set here.
  artifacts:
    seedImage: ""   # REQUIRED when dbCli.enabled: <customer-registry>/db-designer-artifacts-seed:<bundle-version>
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
  # Enable if the in-pod Java (entity generator / meta-api) must trust an
  # internal CA over TLS. Requires labCaTrust.configMapName to exist.
  javaTruststore:
    enabled: false

# With the hardened images, OpenShift assigns an arbitrary non-root UID from
# the project range (GID 0). runAsNonRoot is enforced; no runAsUser/fsGroup is
# pinned so the restricted-v2 SCC is satisfied out of the box.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# No SCC needed with the hardened images -- the default restricted-v2 SCC
# admits them. Set create=true ONLY if you deploy the UN-hardened vendor
# images directly (they run as root); that SCC permits RunAsAny and requires
# cluster-admin to install.
openshift:
  scc:
    create: false
    name: ""

# Mount the CA bundle explicitly if the cluster has no Kyverno CA injection.
labCaTrust:
  enabled: false
  configMapName: solace-lab-ca-trust-bundle
