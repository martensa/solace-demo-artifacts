{{- if not .Values.secret.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "db-designer.secretName" . }}
  labels:
    {{- include "db-designer.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Discrete key for the bundled Postgres container env.
  postgres-password: "{{ .Values.secret.postgresPassword }}"
  # Full dotenv consumed by the backend at /app/dist/bin/.env
  .env: |
    DATABASE_HOST="{{ include "db-designer.postgresHost" . }}"
    DATABASE_PORT={{ include "db-designer.postgresPort" . }}
    DATABASE_USER="{{ .Values.postgres.user }}"
    DATABASE_PASSWORD="{{ .Values.secret.postgresPassword }}"
    DATABASE_NAME="{{ .Values.postgres.database }}"
    DATABASE_SCHEMA='{{ .Values.postgres.schema }}'
    DATABASE_TYPE='{{ .Values.postgres.type }}'
    CONTROL_CENTER_UI_DOMAIN="{{ include "db-designer.uiUrl" . }}"
    CONTROL_CENTER_BACKEND_DOMAIN="{{ include "db-designer.apiUrl" . }}"
    SOLACE_RETRIES={{ .Values.config.solaceRetries }}
    SECRET_KEY="{{ .Values.secret.appSecretKey }}"
    REFRESH_TOKEN_KEY="{{ .Values.secret.appRefreshTokenKey }}"
    API_PORT={{ .Values.service.api.port }}
    SOLACE_REST_DATA_PROTOCOL="{{ .Values.config.solace.restDataProtocol }}"
    SOLACE_REST_PORT="{{ .Values.config.solace.restPort }}"
    SOLACE_AUTH_TOPIC='{{ .Values.config.solace.authTopic }}'
    SOLACE_HOST="{{ .Values.config.solace.host }}"
    SOLACE_VPN_NAME="{{ .Values.config.solace.vpnName }}"
    SOLACE_CLIENT_USER="{{ .Values.config.solace.clientUser }}"
    SOLACE_CLIENT_PWD="{{ .Values.secret.solaceClientPassword }}"
    SOLACE_MANAGEMENT_USER="{{ .Values.config.solace.mgmtUser }}"
    SOLACE_MANAGEMENT_PWD="{{ .Values.secret.solaceMgmtPassword }}"
    SOLACE_CD_DATA_PROTOCOL="{{ .Values.config.solace.cdDataProtocol }}"
    SOLACE_MGMT_PORT="{{ .Values.config.solace.mgmtPort }}"
    CCC_GENERATE_ENTITY_TEMPLATE_PATH='/app/tmp/generateEntity.zip'
    CCC_DOWNLOAD_GENERATE_ENTITY_PATH="/app/tmp/entityFolders"
    CD_CONNECTOR_ENTITY_PATH='/app/tmp/solace-connector-entity.zip'
    CM_META_API_PROTOCOL="{{ .Values.config.metaApi.protocol }}"
    PASSWORD_ENCRYPTION_KEY='{{ .Values.secret.passwordEncryptionKey }}'
    DB_CLI_JAR_PATH='{{ .Values.servicesApp.dbCli.jarPath }}'
    DB_CLI_ENABLED='{{ .Values.servicesApp.dbCli.enabled }}'
    DB_CLI_TIMEOUT_MS='{{ .Values.servicesApp.dbCli.timeoutMs }}'
    CM_MACHINE_LOCAL_IP='{{ .Values.config.metaApi.machineLocalIp }}'
    INITIAL_META_API_PORT={{ .Values.config.metaApi.initialPort }}
    META_API_PORT_AUTOPOULATE='{{ .Values.config.metaApi.autoPopulate }}'
    UUID='{{ .Values.config.uuid }}'
    SOLACE_API_TOKEN='{{ .Values.secret.solaceApiToken }}'
    ENABLE_ADMIN_USER='{{ .Values.config.enableAdminUser }}'
    ADMIN_USER_PWD='{{ .Values.secret.adminUserPassword }}'
    LOG_MAX_FILES='{{ .Values.config.logMaxFiles }}'
{{- end }}
