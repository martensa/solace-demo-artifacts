apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "db-designer.fullname" . }}-ui-env
  labels:
    {{- include "db-designer.labels" . | nindent 4 }}
data:
  # Mounted over /app/build/environment-config.js in the UI container.
  # These are read by the browser, so URLs must be externally resolvable.
  environment-config.js: |
    const REACT_APP_API_SERVICES_URL='{{ include "db-designer.apiUrl" . }}';
    const REACT_APP_DOMAIN='{{ include "db-designer.uiUrl" . }}';
    const REACT_APP_QUEUE_NAME_TEMPLATE='{{ .Values.ui.config.queueNameTemplate }}';
    const REACT_APP_CM_META_API_PROTOCOL='{{ .Values.config.metaApi.protocol }}';
    const REACT_APP_CONNECTOR_MANAGEMENT_URL='{{ .Values.ui.config.connectorManagementUrl }}';
    const REACT_APP_MONITORING_URL='{{ .Values.ui.config.monitoringUrl }}';
    const REACT_APP_PASSWORD_ENCRYPTION_KEY='{{ .Values.secret.passwordEncryptionKey }}';
    const REACT_APP_RUNNING_UNDER = 'DOCKER'
    const REACT_APP_CD_HOST_DOWNLOAD_PATH = './binary-downloads'
    const REACT_APP_CD_DOCKER_DOWNLOAD_PATH = '/app/tmp/binary/download'
    const REACT_APP_ENABLE_GENERATE_SCRIPTS='{{ .Values.ui.config.enableGenerateScripts }}'
