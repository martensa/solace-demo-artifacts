version: '3.3'

services:
  postgres_db:
    image: postgres:13
    restart: always
    container_name: connector_designer_postgres_db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "CONNECTOR_DESIGNER_TEST"
    volumes:
      - pgdata:/var/lib/postgresql/data/
      - ./database/CD_SCHEMA_POSTGRES.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cd-network

  # oracle_db:
  #   image: container-registry.oracle.com/database/enterprise:19.3.0.0  # Replace with the correct Oracle image
  #   restart: always
  #   container_name: connector_designer_oracle_db
  #   ports:
  #     - "3113:1521"
  #   environment:
  #     ORACLE_PWD: "oracle"
  #     ORACLE_SID: "ORCL"  # Set the SID
  #     ORACLE_PDB: "PDB1"
  #   volumes:
  #     - oracle_data:/u01/app/oracle/oradata
  #     - ./database/CD_SCHEMA_ORACLE.sql:/docker-entrypoint-initdb.d/oracle-scripts.sql
  #   networks:
  #     - cd-network
  connector_designer_ui:
    container_name: connector_designer_ui
    restart: always
    # build: ./connector-control-center-ui
    # network_mode: host  # Use host network mode
    image: connector_designer_ui
    ports:
      - '6003:6003'
    volumes:
      - ./environment-config.js:/app/build/environment-config.js
    stdin_open: true
    tty: true
    networks:
      - cd-network

  connector_designer_services:
    container_name: connector_designer_services
    restart: always
    # build: ./connector-control-center-services
    # network_mode: host  # Use host network mode
    image: connector_designer_services
    ports:
      - '6002:6002'
    volumes:
      - ./artifacts:/app/dist/bin/artifacts
      - ./logs/cd:/app/dist/bin/logs/cd
      - ./connector-control-center-services/additionals:/app/dist/bin/additionals
      - ./connector-configuration:/app/tmp
      - ./entityFolders:/app/tmp/entityFolders
      - ./env/cd-services.env:/app/dist/bin/.env
      - ./binary-downloads:/app/tmp/binary/download
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Override CMD to load DB CLI entity generation patch at startup
    command: ["node", "--require", "./additionals/startup-patch.js", "www.js"]
    networks:
      - cd-network

volumes:
  pgdata: 
    name: cd_pgdata
#   oracle_data: 
#     name: cd_oracle_data

networks:
  cd-network:
    name: cd-network
    driver: bridge
