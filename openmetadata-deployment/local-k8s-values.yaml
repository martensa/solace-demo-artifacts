# Helm values for the openmetadata server chart.
#
# Assumes the openmetadata-dependencies release (see
# local-k8s-deps-values.yaml) is already running in the same namespace.

image:
  repository: docker.getcollate.io/openmetadata/server
  tag: 1.6.5
  pullPolicy: IfNotPresent

# Persistent admin auth uses RSA keys mounted from a Secret created by
# scripts/setup-rsa-keys.sh. Without them OM would auto-generate keys on
# every restart -- fine for a throwaway pod, fatal for any token that
# outlives a single startup.
#
# The custom-cacerts emptyDir gets populated by the import-lab-ca init
# container with a JVM truststore that contains the JDK Mozilla roots
# plus every cert in the solace-lab CA trust bundle. JAVA_TOOL_OPTIONS
# below points Java at this file so OIDC discovery against
# auth.solace.lab passes PKIX validation. Kyverno's existing trust
# bundle ConfigMap mount (under /etc/ssl/certs) is python/curl-style
# only -- Java doesn't read it.
extraVolumes:
  - name: openmetadata-jwt-keys
    secret:
      secretName: openmetadata-jwt-keys
      # 0400 root-owned blocks the openmetadata UID 1000 from reading
      # its own signing keys; without them OM silently falls back to
      # an ephemeral EC keypair and JwtFilter crashes casting EC ->
      # RSAPublicKey on every authenticated request. 0444 is fine --
      # secrecy of the private key is enforced by the Secret's RBAC,
      # not by file mode inside a single-user container.
      defaultMode: 0444
  - name: lab-ca-bundle
    configMap:
      name: solace-lab-ca-trust-bundle
  - name: custom-cacerts
    emptyDir: {}

extraVolumeMounts:
  - name: openmetadata-jwt-keys
    mountPath: /etc/openmetadata/jwtkeys
    readOnly: true
  - name: custom-cacerts
    mountPath: /opt/custom-cacerts
    readOnly: true

# preMigrateInitContainers run BEFORE the chart's own run-db-migrations
# init container, which is itself a JVM that gets extraEnvs (including
# JAVA_TOOL_OPTIONS pointing at /opt/custom-cacerts/cacerts). The
# import-lab-ca step must finish first or that JVM fails to start with
# a missing-truststore error.
preMigrateInitContainers:
  - name: import-lab-ca
    # Multi-arch (linux/amd64 + linux/arm64); the -alpine tag is amd64
    # only and breaks Rancher Desktop on Apple Silicon.
    image: eclipse-temurin:17-jre
    securityContext:
      runAsUser: 0
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -e
        cp -L "$JAVA_HOME/lib/security/cacerts" /custom-cacerts/cacerts
        chmod u+w /custom-cacerts/cacerts
        mkdir -p /tmp/certs && cd /tmp/certs
        csplit -z -f cert- -b "%02d.pem" \
          /lab-ca/ca-certificates.crt \
          '/-----BEGIN CERTIFICATE-----/' '{*}' >/dev/null
        i=0
        for pem in cert-*.pem; do
          [ -s "$pem" ] || continue
          keytool -importcert -noprompt -trustcacerts \
            -alias "lab-ca-$i" \
            -file "$pem" \
            -keystore /custom-cacerts/cacerts \
            -storepass changeit
          i=$((i+1))
        done
        echo "Imported $i lab CA cert(s) into /custom-cacerts/cacerts"
    volumeMounts:
      - name: lab-ca-bundle
        mountPath: /lab-ca
        readOnly: true
      - name: custom-cacerts
        mountPath: /custom-cacerts

extraEnvs:
  - name: JAVA_TOOL_OPTIONS
    value: "-Djavax.net.ssl.trustStore=/opt/custom-cacerts/cacerts -Djavax.net.ssl.trustStorePassword=changeit"

# Probes inherited from the chart defaults. Boot is dog-slow on first
# install because of database migrations; the longer startup period
# avoids spurious restart loops.
startupProbe:
  failureThreshold: 60
  periodSeconds: 10
livenessProbe:
  initialDelaySeconds: 60
readinessProbe:
  initialDelaySeconds: 30

# ---------------------------------------------------------------- core config
openmetadata:
  config:
    # Cluster-internal URL pattern. The Ingress provides the external one.
    clusterName: "openmetadata"

    # ----- Authentication ------------------------------------------------
    # OIDC against the solace-lab Keycloak realm at auth.solace.lab.
    # Realm admin (username `admin`, email `admin@solace.lab`) becomes
    # OM admin because <initialAdmins>@<principalDomain> = admin@solace.lab.
    authorizer:
      className: "org.openmetadata.service.security.DefaultAuthorizer"
      containerRequestFilter: "org.openmetadata.service.security.JwtFilter"
      initialAdmins:
        - admin
      principalDomain: "solace.lab"
      enforcePrincipalDomain: false
      enableSecureSocketConnection: false
      # Group/role mapping from Keycloak is left off for now; the
      # group-membership mapper is registered on the client so this can
      # be flipped to `true` later without re-running setup.
      useRolesFromProvider: false

    authentication:
      clientType: confidential
      provider: custom-oidc
      # Keycloak is the IdP. Self-signup must be off so users go
      # through the OIDC flow rather than the basic-auth signup form.
      enableSelfSignup: false
      # Top-level clientId is the plain audience identifier used by the
      # JWT filter. Injected via --set from .env in start.sh.
      clientId: ""
      callbackUrl: "https://openmetadata.solace.lab/callback"
      # JWKS endpoints used to validate inbound tokens:
      #   - OM's own (for ingestion-bot JWTs signed by the RSA keys
      #     mounted from the openmetadata-jwt-keys Secret)
      #   - Keycloak's (for end-user OIDC tokens)
      publicKeys:
        - "http://openmetadata:8585/api/v1/system/config/jwks"
        - "https://auth.solace.lab/realms/solace-lab/protocol/openid-connect/certs"
      authority: "https://auth.solace.lab/realms/solace-lab"
      jwtPrincipalClaims:
        - email
        - preferred_username
        - sub
      # OIDC code flow config. clientId / clientSecret are loaded from
      # the `oidc-secrets` Secret created by start.sh; the chart wires
      # them in via the secretRef pattern.
      oidcConfiguration:
        enabled: true
        oidcType: "Keycloak"
        clientId:
          secretRef: oidc-secrets
          secretKey: openmetadata-oidc-client-id
        clientSecret:
          secretRef: oidc-secrets
          secretKey: openmetadata-oidc-client-secret
        scope: "openid email profile"
        discoveryUri: "https://auth.solace.lab/realms/solace-lab/.well-known/openid-configuration"
        useNonce: true
        preferredJwsAlgorithm: RS256
        responseType: code
        # PKCE off because the client is confidential (client secret is
        # the second factor). Keycloak still accepts the request.
        disablePkce: true
        callbackUrl: "https://openmetadata.solace.lab/callback"
        serverUrl: "https://openmetadata.solace.lab"
        clientAuthenticationMethod: client_secret_post
        tenant: ""
        maxClockSkew: ""
        tokenValidity: "3600"
        customParams: "{}"

    # ----- JWT signing keys ---------------------------------------------
    jwtTokenConfiguration:
      enabled: true
      rsapublicKeyFilePath: "/etc/openmetadata/jwtkeys/public_key.der"
      rsaprivateKeyFilePath: "/etc/openmetadata/jwtkeys/private_key.der"
      jwtissuer: "open-metadata.org"
      keyId: "Gb389a-9f76-gdjs-a92j-0242bk94356"

    # ----- Database ------------------------------------------------------
    # MySQL is the chart-default for openmetadata-dependencies. The
    # initdbScripts seed openmetadata_db with user openmetadata_user /
    # openmetadata_password. start.sh materialises that into the Secret
    # mysql-secrets.openmetadata-mysql-password (name/key per upstream
    # local-Kubernetes quickstart).
    database:
      driverClass: "com.mysql.cj.jdbc.Driver"
      dbScheme: "mysql"
      host: "mysql"
      port: 3306
      databaseName: "openmetadata_db"
      auth:
        username: openmetadata_user
        password:
          secretRef: mysql-secrets
          secretKey: openmetadata-mysql-password

    # ----- Search (OpenSearch) ------------------------------------------
    elasticsearch:
      enabled: true
      host: "opensearch"
      searchType: "opensearch"
      port: 9200
      scheme: "http"
      clusterAlias: ""
      connectionTimeoutSecs: 5
      socketTimeoutSecs: 60
      keepAliveTimeoutSecs: 600
      batchSize: 10
      auth:
        username: ""
        password:
          secretRef: ""
          secretKey: ""

    # ----- Airflow (pipeline service) -----------------------------------
    pipelineServiceClientConfig:
      enabled: true
      className: "org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient"
      apiEndpoint: "http://openmetadata-dependencies-web:8080"
      metadataApiEndpoint: "http://openmetadata:8585/api"
      hostIp: "0.0.0.0"
      auth:
        username: admin
        password:
          secretRef: airflow-secrets
          secretKey: openmetadata-airflow-password

    # ----- Misc ----------------------------------------------------------
    upgradeMigrationConfigs:
      debug: false

# ---------------------------------------------------------------- Service
service:
  type: ClusterIP
  port: 8585

# ---------------------------------------------------------------- Ingress
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "solace-lab-ca-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: openmetadata.solace.lab
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: openmetadata-tls
      hosts:
        - openmetadata.solace.lab

# ---------------------------------------------------------------- Resources
resources:
  requests:
    cpu: 500m
    memory: 1.5Gi
  limits:
    cpu: 2000m
    memory: 3Gi

# REQUESTS_CA_BUNDLE / SSL_CERT_FILE are injected cluster-wide by the
# Kyverno policy `inject-solace-lab-ca-trust-bundle` from
# solace-lab-infrastructure/pki. No per-deployment config needed.
