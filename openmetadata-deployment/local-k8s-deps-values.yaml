# Helm values for the openmetadata-dependencies chart.
#
# Deploys the three things the OM server needs but doesn't ship itself:
#   * relational database (MySQL, bitnami)
#   * search backend     (OpenSearch, single-node)
#   * pipeline runner    (Apache Airflow, with the OM ingestion image)
#
# Chart-default MySQL initdbScripts seed two databases on first boot:
#   * openmetadata_db  -- user openmetadata_user / openmetadata_password
#   * airflow_db       -- user airflow_user      / airflow_pass
# These passwords are demo-only. start.sh materialises them into three
# Secrets that OM server and Airflow read via secretRef:
#   * mysql-secrets.openmetadata-mysql-password
#   * airflow-mysql-secrets.airflow-mysql-password
#   * airflow-secrets.openmetadata-airflow-password
# Rotating means changing the literals in start.sh AND reseeding MySQL
# by hand (initdbScripts only runs on a fresh PVC).

# -------------------------------------------------------------------- MySQL
# Bitnami moved older free images to the `bitnamilegacy/` namespace in
# August 2025; the chart-pinned tag `8.0.33-debian-11-r0` is no longer
# present under `bitnami/mysql`. Repoint at the legacy registry path so
# image pulls succeed. Tag stays identical so initdbScripts behaviour
# is unchanged.
mysql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/mysql
    tag: 8.0.33-debian-11-r0
    pullPolicy: IfNotPresent
  primary:
    persistence:
      size: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

# --------------------------------------------------------------- Elasticsearch
elasticsearch:
  enabled: false

# ---------------------------------------------------------------- OpenSearch
# Subchart already sets sensible defaults for a single-node demo:
#   singleNode=true (which seeds discovery.type=single-node env),
#   opensearchJavaOpts="-Xmx1g -Xms1g",
#   pod securityContext fsGroup/runAsUser=1000,
#   config.opensearch.yml -> plugins.security.disabled: true.
# Only override what differs: persistence size + resource ceiling.
opensearch:
  enabled: true
  singleNode: true
  replicas: 1
  persistence:
    size: 30Gi
  resources:
    requests:
      cpu: 500m
      memory: 1.5Gi
    limits:
      cpu: 2000m
      memory: 3Gi

# -------------------------------------------------------------------- Airflow
# Runs the OM ingestion image as the Airflow worker. The OM server reaches
# this via the in-cluster service name (see pipelineServiceClientConfig
# in local-k8s-values.yaml).
airflow:
  enabled: true
  # Chart 1.11.x relocated the image config from `airflow.airflow.image`
  # to `airflow.images.airflow` (and added pod_template for the
  # KubernetesExecutor worker pods). Both must point at our custom
  # ingestion image to bake the Solace EP connector into every pod that
  # might `import connector.*` (api-server, scheduler, dag-processor,
  # triggerer, AND the per-DAG worker pods spawned by the K8s executor).
  images:
    airflow:
      repository: registry.solace.lab/openmetadata-ingestion-solace
      tag: "0.5.0"
      pullPolicy: IfNotPresent
    pod_template:
      repository: registry.solace.lab/openmetadata-ingestion-solace
      tag: "0.5.0"
      pullPolicy: IfNotPresent
  airflow:
    executor: "KubernetesExecutor"
    # Default Airflow admin -- demo only. Used by OM server to call
    # Airflow's REST API.
    users:
      - username: admin
        password: admin
        role: Admin
        email: admin@open-metadata.org
        firstName: admin
        lastName: admin
    extraEnv:
      - name: AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_RUNNER_TIMEOUT
        value: "300"
      - name: AIRFLOW__CORE__LOAD_EXAMPLES
        value: "false"
      # OM server URL used by the Airflow side of the connection when
      # registering pipelines.
      - name: AIRFLOW__OPENMETADATA__SERVER_HOST_API_URL
        value: "http://openmetadata:8585/api"
    config:
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "60"
  # Reuse the chart-default MySQL service (separate logical database).
  # The chart already wires externalDatabase to:
  #   host=mysql, port=3306, db=airflow_db, user=airflow_user,
  #   passwordSecret=airflow-mysql-secrets (key airflow-mysql-password)
  # so no override is needed here.
  postgresql:
    enabled: false
  # Airflow webserver, scheduler, triggerer, db-migrations and worker
  # pods all need shared access to the dags/ and logs/ directories. The
  # chart hard-requires ReadWriteMany on logs (and effectively on dags
  # for the multi-pod KubernetesExecutor flow). Rancher Desktop's
  # local-path provisioner refuses to provision RWX. start.sh pre-binds
  # static hostPath PVs with claimRef={openmetadata-dependencies-dags,
  # openmetadata-dependencies-logs} which match the PVC names the
  # chart auto-generates ({{ include "airflow.fullname" . }}-dags|-logs
  # = openmetadata-dependencies-dags|-logs).
  #
  # Chart 1.11.x removed the `existingClaim` and `accessMode` keys from
  # its values schema; chart-managed PVCs bind to our pre-bound PVs via
  # name match + claimRef. storageClassName="" disables the dynamic
  # provisioner so the binder uses our static PV instead of trying to
  # allocate from local-path (which would fail on RWX).
  dags:
    persistence:
      enabled: true
      storageClassName: ""
      size: 5Gi
  logs:
    persistence:
      enabled: true
      storageClassName: ""
      size: 5Gi
  workers:
    replicas: 1
    persistence:
      enabled: false
  redis:
    enabled: false
