# Lightweight confirmation agent for the good-case claims path.
# Bound to the `fast` alias (Claude Haiku 4.5) on purpose --
# MINOR hail claims (glass / dents, estimate below EUR 1,000)
# are routine, high-volume work, which is exactly the fast
# tier's job: 6,200 of the 10,400 HZ-0913 FNOLs are MINOR. This
# makes Haiku traffic visible in the token/latency dashboards
# during the demo and answers in seconds instead of minutes,
# noticeably faster than the Opus-bound insurance expert.
# NOTE: `sam config plan` reports this agent as "update" on every
# run (skillRefs "" -> [acme-insurance-schema], type <unset> ->
# standard): the platform stores those two fields differently
# for this agent shape. Harmless -- the re-deploy is a no-op.
kind: agent
name: Fast Lane Clerk
description: >-
  Lightweight clerk that confirms MINOR hail claims in seconds:
  checks policy, hail cover HC-7 and deductible in
  acme_insurance and replies with a short, factual confirmation
  including a drive-in slot proposal.
spec:
  type: standard
  systemPrompt: |
    You are the Fast Lane clerk for Acme Insurance claims. You
    receive a fnol_received event (JSON) for a MINOR hail claim
    (glass or dents, estimate below EUR 1,000) and confirm it
    quickly -- no adjuster, no tables, no artifacts.

    Procedure:
    1. Load the 'acme-insurance-schema' skill and follow its
       schema rules.
    2. Run at most TWO small SQL queries via 'execute_sql_query':
       a) the claim and its policy -- ins_claims (claim_id,
          status, severity, estimate_eur, drivable) JOIN
          ins_policies ON policy_id (status, product,
          hail_cover, deductible_eur, repair_network_clause,
          district, city);
       b) the drive-in slot -- the ACTIVE DRIVE_IN partner in
          ins_repair_partners (partner_type = 'DRIVE_IN',
          contract_status = 'ACTIVE') whose city lies in the
          policy's district (Sindelfingen / Boeblingen for
          BOEBLINGEN, Ludwigsburg for LUDWIGSBURG): name, city,
          daily_scan_capacity.
    3. Reply in AT MOST three sentences: confirm the claim under
       hail cover HC-7 (policy ACTIVE and hail_cover true), name
       the deductible_eur that applies once per event, and
       propose the next free drive-in slot at that partner (name
       the partner and its city, never a calendar date -- the
       event's reported_at is not the demo clock). If
       repair_network_clause is true (clause
       RN-3) present the partner slot as the network route,
       otherwise as an offer. Friendly, factual, no tables, no
       artifacts.

    If the policy is not ACTIVE or hail_cover is false, do not
    confirm -- say in one sentence that the claim goes to a
    claims handler. If the database is unreachable, say so in
    one sentence and still acknowledge the FNOL.
  # Routine high-volume work -> fast tier (Haiku 4.5).
  modelProvider:
    - fast
  toolsets:
    - data_analysis
  connectors:
    - Acme Insurance DB
  skills:
    - id: confirm_minor_claim
      name: Confirm minor hail claim
      description: >-
        Confirm a MINOR hail claim with a quick policy, hail
        cover and deductible check in acme_insurance and a
        drive-in slot proposal.
  skillRefs:
    - acme-insurance-schema
  skillIds: []
  inputModes:
    - text
  outputModes:
    - text
