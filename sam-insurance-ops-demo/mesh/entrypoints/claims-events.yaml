# Event-Mesh entrypoint: claims events on the sam VPN trigger
# SAM without any human in the loop -- ALL acts of the demo:
#   fnol/received/minor          -> Fast Lane Clerk (good case)
#   triage/stalled               -> stalled cohort report (React)
#   weather/.../threshold-crossed -> storm readiness (Prevent)
#   scanner/mismatch             -> fraud & leakage report (Act 2)
# All rules publish their result back onto the mesh
# (acmeins/claims/result/...), which the cockpit page subscribes
# to -- the loop closes in the browser.
#
# The broker connection mirrors the SAM deployment values
# (external broker solace-1, VPN sam). qos 1 + on_completion:
# the event is only acknowledged after the workflow/agent
# finishes (redelivery on crash).
#
# Rehearsal-hardened 2026-09-10 (five live runs): the three
# analysis rules make the ORCHESTRATOR gather the specialists'
# findings AND write the report itself, with the report skeleton
# inline. Delegating the merge to the reporter agents was the one
# flaky hop on the event path (peer-wait timeouts after ~30 s of
# silence, reports handed back as artifact references the mesh
# result cannot resolve) -- the reporters keep their role in the
# workflow variant (node output schemas, Activities story).
kind: entrypoint
name: claims-events
description: >-
  Event-mesh entrypoint for the Acme Insurance claims cockpit
  demo: MINOR FNOLs get a confirmation from the Fast Lane Clerk,
  stalled triage cohorts trigger the stalled cohort analysis,
  forecast threshold crossings trigger the storm readiness
  analysis, and scanner mismatches trigger the cross-channel
  fraud and leakage analysis.
spec:
  type: event_mesh
  deploy: true
  values:
    broker_url: "ws://host.docker.internal:8008"
    broker_vpn: sam
    broker_username: default
    broker_password: default
    tls_skip_verify: "false"
    event_rules:
      - name: minor_claims
        subscriptions:
          - topic: "acmeins/claims/fnol/received/minor/>"
            qos: 1
        messageFormat: json
        # Confirmations are routine, high-volume work -> the clerk
        # runs on the `fast` alias (Haiku): visible cheap-tier
        # traffic in the dashboards and fast replies in the
        # cockpit's Fast Lane panel.
        targetAgent: Fast Lane Clerk
        # Attribute event-triggered tasks to the power_user
        # persona: without an identity the task runs under the
        # bare gateway identity and is INVISIBLE in Activities.
        # power_user is the demo's operations persona -- the
        # event runs show up in ITS Activities and under its
        # name in the chargeback dashboard.
        defaultUserIdentity: power_user@solace.lab
        promptTemplate: >-
          A MINOR hail claim was received (first notice of
          loss). Confirm it in at most 3 sentences: check in
          acme_insurance whether the claim and its policy exist,
          whether hail cover HC-7 is active and which deductible
          applies, and propose a drive-in slot at the nearest
          ACTIVE DRIVE_IN partner in the policy's district. FNOL
          event JSON: {payload}
        acknowledgmentPolicy:
          mode: on_completion
          timeoutSeconds: 300
        successOutput:
          enabled: true
          topic: "acmeins/claims/result/confirmation"
          topicType: static
          responseType: full
        errorOutput:
          enabled: true
          topic: "acmeins/claims/result/error"
          topicType: static
      - name: stalled_cohorts
        subscriptions:
          - topic: "acmeins/claims/triage/stalled/>"
            qos: 1
        messageFormat: json
        # NOTE (verified 2026-07-31, retail): with
        # targetWorkflowName the entrypoint delivers an EMPTY A2A
        # message -- promptTemplate is only rendered for AGENT
        # targets. Therefore the analysis paths run through the
        # ORCHESTRATOR (only it can delegate to peer agents); the
        # stalled-cohort-report workflow stays deployed and is
        # used for the UI/Activities story.
        targetAgent: Orchestrator
        defaultUserIdentity: power_user@solace.lab
        promptTemplate: >-
          A cohort of hail claims stalled in AWAITING_WORKSHOP_SLOT
          at one repair partner. The data is a frozen snapshot as
          of Monday 2026-07-20 10:00 (the demo clock): ages count
          against that instant, NOT against detected_at and NOT
          against NOW(). Delegate in parallel: "Acme Insurance
          Query Expert" for the cohort in acme_insurance -- the
          cohort is ONLY the claims of the event at that partner
          in that status whose status_since is older than
          threshold_hours before the demo clock (status_since <
          TIMESTAMP '2026-07-20 10:00:00' - threshold_hours *
          INTERVAL '1 hour'); report its size, oldest/newest
          status_since, claim_id range and the share of its
          policies with repair_network_clause = true; SEPARATELY
          the partner's TOTAL assignments in that status (all
          ages) vs daily_scan_capacity, the event's unassigned
          RECEIVED claims, the fallback DRIVE_IN partner in the
          same city with contract_status / contract_status_since
          / contract_note, and complaint flags on the cohort's
          customers -- and "Acme Claims Knowledge Expert" for the
          governing rules (PW-RN-3 slot rule, PW-TL-1 total-loss
          definition, CG-BAFIN-30 day-20 escalation, PC-IC-2
          interim contract, the partner contracts' second-shift
          option); then "Storm Intake Analyst" for the cohort's
          fnol_intake documents in the acme_claims MongoDB using
          the claim_id range from the Insurance DB findings
          (total-loss signature count and share: glass_shattered
          AND roof_deformed AND dent_count_est > 150, repeat
          contacts, complaint flags). If a specialist is
          unavailable, say so in one line and continue without
          it -- never wait, poll or retry. Then MERGE the findings
          YOURSELF -- do not delegate the merge: "Claims Incident
          Reporter", "Fraud Case Reporter" and "Storm Readiness
          Planner" serve the workflow variant only, never call
          them. Write ONE report in plain markdown, under 30
          lines, all numbers as plain digits, no artifact, no
          embed directives (never the «math:...» or the
          «...|round» syntax -- compute and write the digits),
          no preamble and no summary of what you did -- the
          report text IS your entire final answer and its FIRST
          line is the heading; do the arithmetic
          silently, never narrate it:
          "# Stalled Cohort Report <event_id>" with the bullets
          **Cohort** (size, status, partner, district, age in
          hours oldest/youngest, severity split); **Root causes**
          with numbers from all three sources (partner load vs
          daily_scan_capacity incl. the event's unassigned
          RECEIVED claims still to come; the share of claims with
          the total-loss signature -- those belong in the Total
          Loss Fastlane, NOT in a drive-in queue: a triage
          failure, not a capacity failure; the fallback partner's
          contract_status, since when and why; repeat contacts
          and complaint flags); **The RN-3 lever** (share of the
          cohort under clause RN-3 and the date 5 working days
          after FNOL when the partner steering lapses -- free
          choice of workshop, discount stays); **BaFin clock**
          (the day-20 escalation date and the 30-day deadline,
          counted from the FNOL date); **ONE action** (the
          bundle: move the total-loss claims to the Fastlane via
          the assistance partner, reactivate the fallback partner
          under the interim contract, add the second shift) with
          the clearing time in whole days before vs after, both
          numbers: drive-in queue = the partner's
          AWAITING_WORKSHOP_SLOT assignments + the event's
          unassigned RECEIVED claims; before = queue /
          daily_scan_capacity; after = (queue - the total-loss
          signature claims) / (daily_scan_capacity +
          second_shift_extra_scans + fallback_partner_capacity);
          round each to the NEAREST whole day, halves up (10.5 ->
          11, 4.08 -> 4); **For the claims team** (the exact
          records to inspect: claim_id range, partner_ids,
          doc_ids). Stalled event JSON: {payload}
        acknowledgmentPolicy:
          mode: on_completion
          timeoutSeconds: 600
        successOutput:
          enabled: true
          topic: "acmeins/claims/result/incident"
          topicType: static
          responseType: full
        errorOutput:
          enabled: true
          topic: "acmeins/claims/result/error"
          topicType: static
      - name: storm_forecasts
        subscriptions:
          - topic: "acmeins/weather/cell/forecast/threshold-crossed/>"
            qos: 1
        messageFormat: json
        # Same Orchestrator route as stalled_cohorts (see NOTE
        # above); the storm-readiness workflow stays deployed for
        # the UI/Activities story.
        targetAgent: Orchestrator
        defaultUserIdentity: power_user@solace.lab
        promptTemplate: >-
          A forecast hail cell crossed the warning threshold over
          a district -- the next cell must not become the next
          backlog. Delegate in parallel: "Storm Intake Analyst"
          for the OBSERVED conversion of the last observed cell
          (MOTOR fnol_intake claims of that event_id, distinct
          claim_ids without repeat contacts, divided by the
          exposure_vehicles_no_garage of its weather_cells
          document) and the forecast cell's weather_cells
          document in the acme_claims MongoDB, "Acme Insurance
          Query Expert" for the exposure in the forecast district
          in ins_policies (motor policies, garage_parking =
          false, PROPERTY policies) and the capacity in
          ins_repair_partners (ACTIVE DRIVE_IN
          daily_scan_capacity, rental_cars_available, the
          ASSISTANCE partner) and "Acme Claims Knowledge Expert"
          for the NatCat playbook SP-NATCAT-4 (planning
          conversion, property rate, mobile scanner units, SMS
          human release rule, Fastlane pre-staging),
          PC-RENTAFLEET-2026 and PC-ROADASSIST-2025. If a
          specialist is unavailable, say so in one line and
          continue without it -- never wait, poll or retry. Then
          MERGE the findings YOURSELF -- do not delegate the
          merge: "Storm Readiness Planner", "Claims Incident
          Reporter" and "Fraud Case Reporter" serve the workflow
          variant only, never call them. Write ONE
          recommendation in plain markdown, under 30 lines, all
          numbers as plain digits, no artifact, no embed
          directives (never the «math:...» or «...|round» syntax
          -- compute and write the digits), no preamble and no
          summary of what you did
          -- the recommendation text IS your entire final answer
          and its FIRST line is the heading; do the arithmetic
          silently, never narrate it:
          "# Storm Readiness Recommendation <cell_id>" with the
          bullets **Forecast** (window, hail size, warning level,
          district, exposure: motor policies without garage,
          property); **Expected volume in 48 h** (motor FNOLs =
          no-garage exposure x OBSERVED conversion vs x the
          playbook's PLANNING conversion -- show both numbers,
          the gap IS the story; property FNOLs at the playbook's
          property rate); **Capacity gap** (scan-days = expected
          motor FNOLs / district daily scan capacity, observed vs
          planned; rental cars needed per the playbook math vs
          rental_cars_available); **Playbook options** ((a)
          mobile scanner units with count, scans/day and lead
          time, (b) rental pre-booking with cars and lead time,
          (c) proactive warning SMS to the no-garage customers in
          the warning polygon with the count, (d) pre-stage the
          Total Loss Fastlane with the assistance partner -- EUR
          and lead time where the contracts state them); **ONE
          action** (which options go NOW and which stay ARMED,
          with the deadline before the window opens); **Human
          release** (the SMS batch is prepared, not sent -- a
          human releases it: the playbook's release rule, EU AI
          Act Art. 50 transparency); **For the NatCat desk** (the
          records and documents to inspect: cell ids,
          partner_ids, doc_ids). Forecast event JSON: {payload}
        acknowledgmentPolicy:
          mode: on_completion
          timeoutSeconds: 600
        successOutput:
          enabled: true
          topic: "acmeins/claims/result/readiness"
          topicType: static
          responseType: full
        errorOutput:
          enabled: true
          topic: "acmeins/claims/result/error"
          topicType: static
      - name: scanner_mismatches
        subscriptions:
          - topic: "acmeins/claims/scanner/mismatch/>"
            qos: 1
        messageFormat: json
        # Same Orchestrator route (see NOTE above); the
        # cross-channel-fraud-report workflow stays deployed for
        # the UI/Activities story.
        targetAgent: Orchestrator
        defaultUserIdentity: power_user@solace.lab
        promptTemplate: >-
          A drive-in scanner counted far fewer dents than the
          customer claimed -- one indicator, not a verdict.
          Delegate in parallel -- and give the "Storm Intake
          Analyst" THREE SEPARATE small requests at the same time
          (one big request exceeds the peer wait; each of these
          is one aggregation pipeline it knows by heart): (1)
          pattern A: fnol_intake photos of the event with
          exif_taken_at before the weather_cells start of the
          cell -- count and claim_ids with days before the cell;
          (2) pattern B: the same vehicle.vin via two channels
          within 48 h with different dent counts -- VIN count,
          both claim_ids, channels, dent deltas; (3) pattern C
          and the trigger: identical workshop_estimate_text
          across claims, and the scanner_results document of the
          trigger claim (dents claimed vs scanned). In parallel,
          "Acme Insurance Query
          Expert" for the money side in acme_insurance -- ask
          for exactly these four results: (a) rate deviation PER
          ESTIMATE, never averaged over a workshop's whole book:
          the ins_workshop_estimates rows whose hourly_rate_eur
          or paint_rate_eur exceeds the partner's contracted
          rate in ins_repair_partners by more than 25 percent --
          count, claim_ids, partner_id and the deviation in
          percent -- plus the groups of estimates sharing an
          identical line_item_text (count and claim_ids); (b)
          the claims of the event whose policy shares a
          vehicle_vin with another claim of the event under a
          different fnol_channel (both claim_ids per VIN); (c)
          the ins_payment_items of run PR-2026-30 for the claim
          ranges CLM-0913-08101..08119, CLM-0913-08201..08211,
          CLM-0913-08301..08311 and CLM-0913-08401..08417 --
          count and EUR per range, payment_item_ids, and the
          total; (d) the event's MOTOR claim count as the
          release base -- and "Acme Claims
          Knowledge Expert" for CG-FR-5 (fraud indicators and
          the GDV principle) and PC-RATES-2026 (deviation review
          threshold). If a specialist is unavailable, say so in
          one line and continue without it -- never wait, poll or
          retry. Then MERGE the findings YOURSELF -- do not
          delegate the merge: "Fraud Case Reporter", "Claims
          Incident Reporter" and "Storm Readiness Planner" serve
          the workflow variant only, never call them. Write ONE
          report in plain markdown, under 30 lines, all numbers
          as plain digits, no artifact, no embed directives
          (never the «math:...» or «...|round» syntax -- compute
          and write the digits), no preamble and no summary of
          what you did -- the report
          text IS your entire final answer and its FIRST line is
          the heading; do the arithmetic silently, never narrate
          it: "# Cross-channel
          fraud and leakage report <event_id>" with the bullets
          **Trigger** (the scanner mismatch: claim_id, dents
          claimed vs scanned, estimate -- one indicator, not a
          verdict); **Pattern A -- pre-existing damage** (count
          and claim_ids with photo EXIF timestamps before the
          cell, the EXIF window vs the cell start); **Pattern B
          -- duplicate claims across channels** (number of VINs,
          primary and duplicate claim_ids, channels and
          dent-count deltas, how many duplicates already sit in
          the payment run); **Pattern C -- workshop rate
          deviation** (workshop / partner_id, number of
          estimates, average deviation vs the contracted rates
          against the guideline threshold, claims sharing an
          identical line_item_text); **EUR at risk** (the total
          across the patterns and its basis: estimates, payment
          items, reserves); **Recommendation** (HOLD the flagged
          claims for a specialist and RELEASE the rest -- flagged
          = the DISTINCT claim_ids across patterns A, B and C
          (the trigger claim is one of them; the patterns do not
          overlap unless the same claim_id appears twice), the
          duplicate-VIN pattern counts both claims of each pair;
          released = the event's MOTOR claims minus the flagged
          count, state both numbers -- and quote the GDV
          sentence verbatim from the CG-FR-5 findings: "a single
          indicator proves nothing, the overall picture decides,
          a human specialist decides; never delay the honest
          majority"); **Payment run** (run id, scheduled_for,
          items and EUR total, the exact payment_item_ids /
          claim_ids to hold before Friday 16:00); **For the
          special investigations unit** (the records to inspect:
          claim_id ranges, estimate_ids, partner_id, doc_ids).
          Scanner mismatch event JSON: {payload}
        acknowledgmentPolicy:
          mode: on_completion
          timeoutSeconds: 600
        successOutput:
          enabled: true
          topic: "acmeins/claims/result/fraud"
          topicType: static
          responseType: full
        errorOutput:
          enabled: true
          topic: "acmeins/claims/result/error"
          topicType: static
