# Event-triggered fraud and leakage workflow (Act 2): a
# scanner_mismatch event (published by the claims cockpit on
# the sam VPN) is routed here by the claims-events event-mesh
# entrypoint. One mismatch is one indicator -- the workflow
# widens the view to the whole event cohort: fans out to the
# Intake, Insurance DB and Knowledge specialists in parallel,
# then merges into a hold/release report for the special
# investigations unit. fail_fast false for the same
# live-Builder reason as the stalled-cohort workflow.
kind: workflow
name: cross-channel-fraud-report
description: >-
  Cross-channel fraud and leakage analysis: fans a scanner
  mismatch out to the intake, Insurance DB and knowledge
  specialists in parallel and merges their findings into one
  hold/release report for the special investigations unit.
spec:
  appConfig:
    # Bump to force a redeploy (deploy phase fires on change
    # only). Event-triggered runs deliver NO structured input
    # keys -> reference the raw task text as {{workflow.input}}.
    version: "1.0.0"
    display_name: Cross-Channel Fraud Report
    description: >-
      Scanner-mismatch analysis widened to the whole event cohort
      across intake signals, estimates and payment run and the
      fraud guideline, merged into one hold/release report.
    workflow_timeout: "600s"
    default_node_timeout: "240s"
    fail_fast: false
    skills:
      - id: cross_channel_fraud_report
        name: Cross-Channel Fraud Report
        description: >-
          Analyze a scanner mismatch across intake signals,
          workshop estimates, the payment run and the fraud
          guideline and produce a hold/release report.
    # Workflow-level INPUT contract: the realtime scanner event
    # cockpit/index.html publishes on
    # acmeins/claims/scanner/mismatch/>. The event PATH runs via
    # the Orchestrator (promptTemplate quirk), so this schema is
    # the published contract + the typed Run form in the UI, not
    # a gate on the event flow. Loose by design: only the fields
    # the SOP needs are required.
    input_schema:
      type: object
      required: [claim_id, event_id, dents_claimed, dents_scanned]
      properties:
        event_type:
          type: string
          enum: [scanner_mismatch]
          description: This SOP handles drive-in scanner mismatches.
        claim_id:
          type: string
          description: The mismatching claim, e.g. CLM-0913-08103.
        event_id:
          type: string
          description: Weather cell / claims event id, e.g. HZ-0913.
        partner_id:
          type: string
          description: The DRIVE_IN partner that scanned, e.g. P-BRAENDLE.
        dents_claimed:
          type: integer
          description: Dent count from the customer's intake narrative.
        dents_scanned:
          type: integer
          description: Dent count measured by the scanner.
        estimate_eur:
          type: number
          description: Workshop estimate on the claim.
        scanned_at:
          type: string
          description: Scan timestamp (ISO 8601).
    # Workflow-level output contract: loose ({report: string}),
    # the report stays free-form markdown; the STRICT contracts
    # sit on the specialist NODES below.
    output_schema:
      type: object
      required: [report]
      properties:
        report:
          type: string
          description: The fraud and leakage report in markdown.
    output_mapping:
      report: "{{report.output}}"
    nodes:
      # Output contracts (JSON Schema) on the three specialist
      # nodes: schema-validated hand-offs; the report node stays
      # free-form markdown (it is read aloud).
      - id: intake
        type: agent
        agent_name: Storm Intake Analyst
        output_schema:
          type: object
          required: [exif_before_event_count, duplicate_vin_count,
                     identical_estimate_text_count, scanner_dents_claimed,
                     scanner_dents_scanned, findings]
          properties:
            event_start:
              type: string
              description: weather_cells start of the event (ISO 8601).
            exif_before_event_count:
              type: integer
              description: Claims with photo exif_taken_at before event_start.
            exif_before_event_claim_ids:
              type: array
              items: { type: string }
            exif_window:
              type: string
              description: Earliest..latest exif_taken_at of those photos.
            duplicate_vin_count:
              type: integer
              description: VINs reported via two channels within 48 h.
            duplicate_vin_pairs:
              type: array
              description: One entry per VIN (primary + duplicate claim).
              items:
                type: object
                required: [primary_claim_id, duplicate_claim_id]
                properties:
                  vin: { type: string }
                  primary_claim_id: { type: string }
                  duplicate_claim_id: { type: string }
                  primary_channel: { type: string }
                  duplicate_channel: { type: string }
                  dent_count_delta: { type: integer }
            identical_estimate_text_count:
              type: integer
              description: Claims sharing an identical workshop_estimate_text.
            identical_estimate_text_claim_ids:
              type: array
              items: { type: string }
            scanner_dents_claimed:
              type: integer
              description: dent_count_est / narrative of the trigger claim.
            scanner_dents_scanned:
              type: integer
              description: dent_count_scanned of the trigger claim.
            scanner_mismatch_count:
              type: integer
              description: scanner_results with mismatch_flag in the event.
            findings:
              type: string
              description: 2-4 sentences with the key numbers.
        input:
          message: >-
            A drive-in scanner mismatch was flagged on one claim.
            Analyze the CROSS-CHANNEL signals over the whole event
            cohort in the acme_claims MongoDB (aggregation
            pipelines only): (1) pattern A -- fnol_intake
            documents of the event_id whose photos.exif_taken_at
            lies BEFORE the cell's start in weather_cells
            (pre-existing damage): count, claim_ids, EXIF date
            window; (2) pattern B -- the same vehicle.vin reported
            via two different channel values within 48 h
            (received_at) with different
            damage_signals.dent_count_est: number of VINs, the
            primary (earlier) and duplicate claim_ids per VIN, the
            channels and dent-count deltas; (3) pattern C --
            identical workshop_estimate_text shared by several
            claims: count and claim_ids; (4) the trigger -- the
            scanner_results document of the event's claim_id
            (dent_count_scanned, mismatch_flag) vs its fnol_intake
            damage_signals.dent_count_est / narrative, plus the
            count of mismatch_flag = true across the event. Fill
            the structured output contract; findings = 2-4
            sentences with numbers. Scanner mismatch event:
            {{workflow.input}}
      - id: insurance
        type: agent
        agent_name: Acme Insurance Query Expert
        output_schema:
          type: object
          required: [deviating_partner_id, deviating_estimate_count,
                     average_rate_deviation_pct, payment_run_id,
                     payment_run_items, payment_run_total_eur,
                     flagged_payment_items, event_motor_claims,
                     findings]
          properties:
            event_motor_claims:
              type: integer
              description: >-
                COUNT ins_claims of the event with line = 'MOTOR'
                -- the release base (all minus the flagged ones).
            deviating_partner_id:
              type: string
              description: Partner whose estimates exceed contracted rates.
            deviating_estimate_count:
              type: integer
            average_rate_deviation_pct:
              type: number
              description: Mean deviation of hourly/paint rate vs contract (%).
            deviating_claim_ids:
              type: array
              items: { type: string }
            deviating_estimates_total_eur:
              type: number
              description: SUM total_eur of the deviating estimates.
            identical_line_item_count:
              type: integer
              description: Estimates of that partner sharing a line_item_text.
            duplicate_vin_count:
              type: integer
              description: VINs with claims across fnol_channel values in 48 h.
            duplicate_vin_claim_ids:
              type: array
              items: { type: string }
            payment_run_id:
              type: string
              description: e.g. PR-2026-30.
            payment_run_scheduled_for:
              type: string
            payment_run_items:
              type: integer
              description: All ins_payment_items of the run.
            payment_run_total_eur:
              type: number
              description: SUM amount_eur of the run.
            flagged_payment_items:
              type: integer
              description: Items of the run belonging to flagged claims.
            flagged_payment_item_ids:
              type: array
              items: { type: string }
            flagged_payment_eur:
              type: number
              description: SUM amount_eur of the flagged items.
            eur_at_risk:
              type: number
              description: Total at risk; state the basis in findings.
            trigger_claim_status:
              type: string
            trigger_claim_estimate_eur:
              type: number
            findings:
              type: string
              description: 2-4 sentences with the key numbers.
        input:
          message: >-
            A drive-in scanner mismatch was flagged on one claim.
            Analyze the MONEY side over the whole event cohort in
            acme_insurance (aggregate only, never SELECT *): (1)
            pattern C -- per partner, ins_workshop_estimates
            hourly_rate_eur / paint_rate_eur vs
            contracted_hourly_rate_eur / contracted_paint_rate_eur
            in ins_repair_partners: which partner deviates
            (W-0471 / P-KAROSSERIE-SCHNELL in the HZ-0913 data),
            average deviation in percent, number of estimates,
            their claim_ids and SUM total_eur, and estimates
            sharing an identical line_item_text; (2) pattern B --
            ins_claims JOIN ins_policies ON policy_id: claims of
            the event_id sharing a vehicle_vin across different
            fnol_channel values with reported_at within 48 h:
            number of VINs, claim_ids, estimate_eur / reserve_eur;
            (3) the payment run -- ins_payment_items WHERE
            payment_run_id = 'PR-2026-30': COUNT, SUM(amount_eur),
            scheduled_for, and the payment_item_ids / claim_ids /
            amount_eur of the items belonging to the claims
            flagged in (1) and (2); (4) the trigger claim's
            estimate_eur, status and assigned_partner_id in
            ins_claims, and the event's MOTOR claim count
            (ins_claims WHERE event_id matches AND line =
            'MOTOR') as the release base. Sum the EUR at risk and
            state its basis. Fill the structured output contract;
            findings = 2-4 sentences with numbers. Scanner
            mismatch event: {{workflow.input}}
      - id: knowledge
        type: agent
        agent_name: Acme Claims Knowledge Expert
        output_schema:
          type: object
          required: [fraud_indicators, rate_deviation_threshold_pct,
                     gdv_principle, findings]
          properties:
            fraud_indicators:
              type: array
              items: { type: string }
              description: The CG-FR-5 indicator list.
            rate_deviation_threshold_pct:
              type: number
              description: PC-RATES-2026 deviation review threshold (%).
            contracted_hourly_rate_eur:
              type: number
            contracted_paint_rate_eur:
              type: number
            scanner_deviation_threshold_pct:
              type: number
              description: CG-FR-5 scanner vs claimed dents threshold (%).
            gdv_principle:
              type: string
              description: >-
                The GDV sentence verbatim from CG-FR-5: a single
                indicator proves nothing, the overall picture decides,
                a human specialist decides; never delay the honest
                majority.
            documents:
              type: array
              items: { type: string }
              description: doc_ids cited, e.g. CG-FR-5, PC-RATES-2026.
            findings:
              type: string
              description: 2-4 sentences quoting the decisive rules.
        input:
          message: >-
            A drive-in scanner mismatch was flagged on one claim.
            Retrieve the RULES from the Acme Claims Knowledge
            base: search_claims_guidelines for the fraud
            indicators guideline CG-FR-5 (the indicator list:
            photo EXIF before the event date, same VIN via two
            channels within 48 h, estimate above the contracted
            rate, identical line-item texts across claims, scanner
            vs claimed dents deviation -- and the GDV principle
            that a single indicator proves nothing, the overall
            picture decides, a human specialist decides, never
            delay the honest majority); search_partner_contracts
            for PC-RATES-2026 (contracted hourly and paint rates,
            the deviation review threshold). Read CG-FR-5 and
            PC-RATES-2026 in full via get_knowledge_document. Cite
            doc_id + title and quote the GDV sentence verbatim.
            Fill the structured output contract; findings = 2-4
            sentences quoting the decisive rules. Scanner mismatch
            event: {{workflow.input}}
      - id: report
        type: agent
        agent_name: Fraud Case Reporter
        depends_on:
          - intake
          - insurance
          - knowledge
        input:
          message: |
            Create the cross-channel fraud and leakage report for
            this scanner mismatch event: {{workflow.input}}

            ## Intake findings (schema-validated JSON)
            {{intake.output}}

            ## Insurance DB findings (schema-validated JSON)
            {{insurance.output}}

            ## Knowledge findings (schema-validated JSON)
            {{knowledge.output}}
