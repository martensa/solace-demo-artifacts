# Declarative manifest for the Acme Insurance CORE package: the
# acme_insurance postgres connector, the Qdrant knowledge base
# (reached through an MCP server -- the platform has no native
# Qdrant connector), the two skill bundles and the two expert
# agents. This is the insurance analog of
# sam-manufacturing-ops-demo/core -- every demo owns its core;
# agent-mesh-deployment stays pure SAM infrastructure (models,
# RBAC, observability, developer-mcp). uninstall.sh removes the
# core together with the overlay; --keep-core keeps it for a fast
# re-install of the overlay.
#
# Applied with:  sam config plan/apply -m manifest.yaml
# (install.sh does this; order is handled by the CLI, connectors
# before the agents that reference them.)
#
# NEVER pass --prune: the platform hosts resources this manifest
# does not manage (Orchestrator, developer-mcp, other demos ...).
kind: manifest
name: ins-core-agents
description: >-
  Acme Insurance core: acme_insurance postgres connector, claims
  knowledge base (Qdrant via MCP), skill bundles and the two
  expert agents (SQL + knowledge).
target:
  name: solace-lab
  url: https://sam.solace.lab
  auth:
    type: oauth
# Environment variables of this package (no `variables:` block on
# purpose): INS_DB_USERNAME / INS_DB_PASSWORD (default postgres) and
# INS_EXPERT_TIER (default fast), each defaulted INLINE where it is
# used -- `${VAR, default}` -- so an exported value wins. A default
# under `variables:` beats the environment on CLI 2.348.22 (verified
# 2026-09-21: an exported INS_EXPERT_TIER=general left the experts on
# the fast default of a `variables:` block). INS_EXPERT_TIER: `fast`
# (Haiku 4.5), the tier of every agent of the demo -- the
# claim-triage workflow needs its policy and rules nodes back within
# ~12 s, and a three-model benchmark on the demo questions (retired
# with the extended profile on 2026-09-21) measured fast matching
# general. Override e.g.
#   INS_DB_PASSWORD=secret ./install.sh
#   INS_EXPERT_TIER=general ./install.sh
resources:
  connectors:
    - Acme Insurance DB
    - Acme Claims Knowledge
  skills:
    - acme-insurance-schema
    - acme-knowledge-guide
  agents:
    - Acme Insurance Query Expert
    - Acme Claims Knowledge Expert
    # NOTE: the demo overlay (Claims Intake Liaison, Claims Triage
    # Decision, the claim-triage workflow and the rendered
    # claims-triage entrypoint) is NOT managed here -- it lives in
    # ../triage, the external Claims Intake Analyst in
    # ../external-agent; install.sh / uninstall.sh handle both.
