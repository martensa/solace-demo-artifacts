# Claim triage workflow -- the ONE scenario of the default demo
# profile. An FNOL event (published by the cockpit or by
# tools/fire-claim.js, routed here by the claims-triage event-mesh
# entrypoint) fans out to three specialists IN PARALLEL -- the
# policy and claims side (Insurance DB), the intake side (the
# EXTERNAL Claims Intake Analyst, reached through the platform
# agent Claims Intake Liaison) and the governing rules (knowledge
# base) -- and a fast merge agent turns the three JSON sections
# into one schema-bound decision. Measured end to end on the live
# platform (2026-09-16, SAM 2.225.14, four anchor claims): 26.8 s,
# 27.7 s, 30.6 s and 32.7 s from the FNOL event to the decision on
# the result topic. Typical node breakdown: policy 13 s, intake 19 s
# (of which the external analyst itself is 5 s), rules 9 s,
# decision 12 s. On SAM 2.348.22 the preflight dry fire decided in
# 28 s (2026-09-21); the node times were not re-measured there.
# The three fan-out nodes run in parallel, so the critical path is
# intake plus decision -- tune those two, not the others.
#
# Design decisions (verified 2026-09-10 on 2.225.14, spec 0.1; on
# 2.348.22 the CLI's rejection of a v1-agent node was re-checked,
# the other observations below were not re-verified):
# - The three first-level nodes carry ONLY `instruction:` and NO
#   `input:`. A node without `input:` receives the raw workflow
#   input {"text": "<FNOL event JSON>"} as its input FILE plus the
#   instruction as the text part. A node WITH `input:` receives
#   ONLY that map, and a template EMBEDDED in a longer string is
#   NOT rendered (it stays literal) -- so the event reaches a node
#   either raw (no input) or as a whole-string template.
# - The decision node therefore carries an `input:` map whose
#   values are whole-string templates ({{workflow.input.text}} =
#   the event JSON string, {{policy.output}} etc. = the upstream
#   output objects) plus its instruction. A dependent node
#   WITHOUT `input:` would get the raw event, not the outputs.
# - The intake node targets the platform agent Claims Intake
#   Liaison, never the external agent directly: the CLI rejects a
#   node xref to a broker-discovered (v1 SDK) agent and, even when
#   created via the REST API, the v1 structured-invocation handler
#   never answers the v2 workflow engine (node timeout after 90 s).
#   The liaison can make the hop because its
#   additionalConfigurations carry
#   `interAgentCommunication.allowList: [ClaimsIntakeAnalyst]` --
#   without that key a standard agent has NO delegation tool at all
#   (only its own sub_task). The Orchestrator would work too (it
#   carries allowList ["*"]) but costs about 13 s of Opus-tier
#   overhead on the critical path. Because every node agent is a
#   platform agent, the whole overlay applies with
#   `sam config apply` (no REST detour).
# - Every node has an output_schema (the contract the UI shows).
#   NEVER tell a node agent HOW to format its answer. The platform
#   injects its own structured-invocation instruction, and the
#   agent fulfils it by emitting a save_artifact block that the
#   workflow engine unmarshals. Telling the agent "answer with
#   ONLY the JSON object, first character {" makes it answer in
#   plain text instead, the artifact stays empty, awe logs
#   'failed to load structured result artifact: unexpected end of
#   JSON input' and the node's output is null (verified
#   2026-09-16: it cost policy, rules and decision in one run;
#   the Opus-tier Orchestrator resisted, the fast-tier agents did
#   not). Node instructions describe CONTENT only. Null-prone
#   fields are asked for as "" / 0 / false / [], and the decision
#   node tolerates null sections (REFER with the reason).
# - fail_fast false: a failed specialist must not kill the
#   decision; the merge agent states what was missing.
# - output_mapping is REQUIRED (deploy fails without it); the
#   workflow output_schema mirrors it.
# - The event path delivers {"text": "<payload>"} only, so
#   input_schema declares NO required field: a required claim_id
#   would gate the event path if the runtime validated the input.
#   The typed fields document the payload and drive the UI's Run
#   form; `text` documents the event path itself.
# - Bump `version` to force a redeploy (the deploy phase fires on
#   change only).
kind: workflow
name: claim-triage
description: >-
  Claim triage in 30 seconds: fans an FNOL event out to the
  Insurance DB, the external intake analyst (reached by the Claims
  Intake Liaison) and the knowledge base in parallel and merges their
  schema-validated findings into one triage decision (APPROVE,
  HOLD or REFER with lane, cited reasons, indicators, next step).
spec:
  appConfig:
    version: "1.1.0"
    display_name: Claim Triage
    description: >-
      Per-claim triage of a hail FNOL: policy and claims facts,
      intake facts (photos, scanner, duplicate VIN, repeat
      contacts) and the governing rules, merged into one decision
      with the lane, cited reasons and the next step.
    workflow_timeout: "180s"
    default_node_timeout: "75s"
    fail_fast: false
    skills:
      - id: claim_triage
        name: Claim Triage
        description: >-
          Triage one hail claim from its FNOL event: policy, intake
          and rules in parallel, one decision with lane, cited
          reasons, indicators and next step.
    # INPUT contract = the FNOL event the cockpit publishes on
    # acmeins/claims/fnol/received/<severity>/<claim_id>. Loose by
    # design (see header): no required field, only claim_id is
    # needed by the nodes.
    input_schema:
      type: object
      properties:
        claim_id:
          type: string
          description: The claim to triage, e.g. CLM-0913-00001.
        severity:
          type: string
          description: Severity band at intake (MINOR, MODERATE, SEVERE).
        line:
          type: string
          description: MOTOR or PROPERTY.
        policy_id:
          type: string
          description: Policy of the claim, e.g. POL-104211.
        channel:
          type: string
          description: >-
            FNOL channel (APP, VOICE_AGENT, WORKSHOP_PORTAL,
            DRIVE_IN_SCANNER, AGENCY_EMAIL).
        event_id:
          type: string
          description: Hail cell of the claim, e.g. HZ-0913.
        cell_start:
          type: string
          description: >-
            Start of the hail cell (ISO 8601 UTC); the nodes fall
            back to 2026-07-18T18:40:00Z (HZ-0913) when absent.
        reported_at:
          type: string
          description: First notice of loss (ISO 8601 UTC, fiction).
        estimate_eur:
          type: number
          description: Estimate at intake in EUR (0 when none yet).
        city:
          type: string
          description: Loss location city.
        postal_code:
          type: string
          description: Loss location postal code.
        text:
          type: string
          description: >-
            Event path only: the claims-triage entrypoint passes the
            whole FNOL payload as this single JSON string.
    # OUTPUT contract: the decision card the cockpit renders,
    # plus the three specialists' key findings for the proof beat.
    output_schema:
      type: object
      required: [claim_id, decision, lane]
      properties:
        claim_id:
          type: string
        decision:
          type: string
          description: APPROVE, HOLD or REFER.
        lane:
          type: string
          description: >-
            FAST_LANE, STANDARD, TOTAL_LOSS_FASTLANE,
            SPECIAL_INVESTIGATIONS or HANDLER.
        headline:
          type: string
        reasons:
          type: array
          items: { type: string }
        indicators:
          type: array
          items: { type: string }
        next_step:
          type: string
        partner:
          type: string
        deductible_eur:
          type: integer
        reserve_eur:
          type: number
        customer:
          type: string
        vehicle:
          type: string
        confidence:
          type: number
        summary:
          type: string
        intake_summary:
          type: string
          description: The intake analyst's 1-2 sentence summary.
        policy_findings:
          type: array
          items: { type: string }
          description: The Insurance DB specialist's findings.
        rules:
          type: array
          items: { type: object }
          description: The cited rules (doc_id, title, rule).
    # Every optional field goes through `coalesce`: a fast-tier merge
    # agent occasionally drops one key of its contract, and a bare
    # mapping turns that into "output mapping error: field X not
    # found in node output" -- the whole run fails and the cockpit
    # shows nothing (verified 2026-09-16 on a MODERATE claim that
    # came back without `summary`). claim_id, decision and lane stay
    # bare on purpose: without them there is no decision to show, and
    # a loud failure beats a blank card.
    output_mapping:
      claim_id: "{{decision.output.claim_id}}"
      decision: "{{decision.output.decision}}"
      lane: "{{decision.output.lane}}"
      headline:
        coalesce:
          - "{{decision.output.headline}}"
          - "{{decision.output.summary}}"
          - "Triage decision without a headline."
      reasons:
        coalesce:
          - "{{decision.output.reasons}}"
          - []
      indicators:
        coalesce:
          - "{{decision.output.indicators}}"
          - []
      next_step:
        coalesce:
          - "{{decision.output.next_step}}"
          - "No next step returned -- route to a claims handler."
      partner:
        coalesce:
          - "{{decision.output.partner}}"
          - ""
      deductible_eur:
        coalesce:
          - "{{decision.output.deductible_eur}}"
          - 0
      reserve_eur:
        coalesce:
          - "{{decision.output.reserve_eur}}"
          - 0
      customer:
        coalesce:
          - "{{decision.output.customer}}"
          - ""
      vehicle:
        coalesce:
          - "{{decision.output.vehicle}}"
          - ""
      confidence:
        coalesce:
          - "{{decision.output.confidence}}"
          - 0
      summary:
        coalesce:
          - "{{decision.output.summary}}"
          - "{{decision.output.headline}}"
          - "No summary returned by the decision agent."
      intake_summary:
        coalesce:
          - "{{intake.output.summary}}"
          - "intake section unavailable"
      policy_findings:
        coalesce:
          - "{{policy.output.findings}}"
          - []
      rules:
        coalesce:
          - "{{rules.output.rules}}"
          - []
    nodes:
      # ---- fan-out 1/3: policy and claims side (Insurance DB) ----
      # instruction only, NO input: the raw event is the input file.
      # The reference SQL is given verbatim (verified 2026-09-10:
      # 1-6 ms and 8-32 ms on the seeded acme_insurance) so the
      # expert (fast tier in this profile) does not explore the
      # schema first.
      - id: policy
        type: agent
        agent_name: Acme Insurance Query Expert
        timeout: "75s"
        instruction: |
          Claim triage, policy and claims side. The input file holds
          the FNOL event JSON (fields claim_id, severity, policy_id,
          channel, event_id, cell_start, reported_at, estimate_eur,
          city, postal_code). Work on THAT claim: take claim_id from
          it. Data snapshot "now" is Monday 2026-07-20 10:00 UTC;
          never use the wall clock, never NOW().

          Do NOT load any skill (the SQL below is complete) and do
          not narrate what you are doing. Run EXACTLY these two SQL
          queries via execute_sql_query -- Query 1 first, then
          Query 2 with the district from Query 1. Replace only
          <claim_id> and <district>; no exploration queries, no
          other statements.

          Query 1 -- claim, policy and customer:
          SELECT c.claim_id, c.status AS claim_status, c.severity, c.line,
                 c.fnol_channel, c.reported_at, c.estimate_eur, c.reserve_eur,
                 c.drivable, c.assigned_partner_id,
                 p.policy_id, p.status AS policy_status, p.product, p.hail_cover,
                 p.deductible_eur, p.repair_network_clause, p.district, p.city,
                 p.postal_code, p.vehicle_model, p.vehicle_vin,
                 cu.full_name AS customer_name, cu.segment AS customer_segment,
                 cu.complaint_flag
          FROM ins_claims c
          JOIN ins_policies p ON p.policy_id = c.policy_id
          JOIN ins_customers cu ON cu.customer_id = p.customer_id
          WHERE c.claim_id = '<claim_id>';

          Query 2 -- the drive-in partners of the policy's district
          with their open AWAITING_WORKSHOP_SLOT queue (the partner
          table has no district column; the subselect maps the
          district to its cities):
          SELECT rp.partner_id, rp.name, rp.city, rp.contract_status,
                 rp.contract_status_since, rp.contract_note,
                 rp.daily_scan_capacity,
                 COUNT(c.claim_id) FILTER (WHERE c.status = 'AWAITING_WORKSHOP_SLOT')
                   AS open_queue
          FROM ins_repair_partners rp
          LEFT JOIN ins_claims c ON c.assigned_partner_id = rp.partner_id
          WHERE rp.partner_type = 'DRIVE_IN'
            AND rp.city IN (SELECT DISTINCT p.city FROM ins_policies p
                            WHERE p.district = '<district>')
          GROUP BY rp.partner_id, rp.name, rp.city, rp.contract_status,
                   rp.contract_status_since, rp.contract_note,
                   rp.daily_scan_capacity
          ORDER BY rp.contract_status, rp.partner_id;

          Fill the output contract from the rows. The ACTIVE
          DRIVE_IN partner (contract_status = 'ACTIVE') is the
          network partner: network_partner_id / _name / _city,
          network_partner_open_queue = its open_queue,
          network_partner_daily_capacity = its daily_scan_capacity
          (several ACTIVE rows: take the largest capacity). For the
          INACTIVE partner set inactive_partner_note =
          "<partner_id> <name> INACTIVE since <contract_status_since>:
          <contract_note>", or "" when there is none. When Query 1
          returns no row: claim_found = false and every other field
          at its default ("", 0, false). estimate_eur = 0 when NULL;
          assigned_partner_id = "" when NULL; never write null.
          findings = 2-4 short sentences with the key facts (cover
          and deductible, RN-3, severity and estimate, partner queue
          vs daily capacity, inactive partner).

          No artifacts, no charts, no CSV, no markdown, no
          explanation of the SQL, no summary of what you did.
          findings is a JSON ARRAY of 2-4 separate strings, never one
          joined string. Write every amount as "EUR 640" -- plain
          ASCII only, never the euro sign (it arrives mangled at the
          cockpit). Do not add a key that is not in the contract.
        output_schema:
          type: object
          required: [claim_found, policy_status, hail_cover, severity,
                     estimate_eur, deductible_eur, repair_network_clause,
                     findings]
          properties:
            claim_found:
              type: boolean
              description: Query 1 returned a row for the claim.
            claim_status:
              type: string
              description: ins_claims.status (RECEIVED, AWAITING_WORKSHOP_SLOT ...).
            severity:
              type: string
              description: MINOR, MODERATE or SEVERE.
            estimate_eur:
              type: number
              description: Estimate in EUR, 0 when NULL.
            reserve_eur:
              type: number
            drivable:
              type: boolean
            assigned_partner_id:
              type: string
              description: Partner already assigned, "" if none.
            policy_status:
              type: string
              description: ACTIVE or not.
            hail_cover:
              type: boolean
              description: Clause HC-7 set on the policy.
            deductible_eur:
              type: integer
            repair_network_clause:
              type: boolean
              description: Clause RN-3 (network steering) on the policy.
            vehicle_model:
              type: string
            customer_name:
              type: string
            customer_segment:
              type: string
              description: PRIVATE or FLEET.
            complaint_flag:
              type: boolean
              description: The customer has an open complaint on file.
            network_partner_id:
              type: string
              description: The ACTIVE DRIVE_IN partner of the district.
            network_partner_name:
              type: string
            network_partner_city:
              type: string
            network_partner_open_queue:
              type: integer
              description: Its claims in AWAITING_WORKSHOP_SLOT.
            network_partner_daily_capacity:
              type: integer
              description: Its daily_scan_capacity.
            inactive_partner_note:
              type: string
              description: The INACTIVE drive-in partner and why, "" if none.
            findings:
              type: array
              items: { type: string }
              description: 2-4 short sentences with the key facts.
      # ---- fan-out 2/3: intake side (EXTERNAL agent via the liaison)
      # instruction only, NO input. A v1-SDK external agent cannot be
      # a workflow node itself (the CLI rejects the xref, and via the
      # REST API the v1 structured-invocation handler never answers
      # the v2 workflow engine -- the node times out after 90 s), so
      # a platform agent carries the hop. That agent needs
      # `interAgentCommunication.allowList` in its
      # additionalConfigurations or it has no delegation tool at all
      # (see agents/Claims Intake Liaison.yaml). The Orchestrator
      # would also work -- it carries allowList ["*"] -- but costs
      # about 13 s of Opus-tier overhead on the critical path against
      # the liaison's fast tier.
      - id: intake
        type: agent
        agent_name: Claims Intake Liaison
        timeout: "75s"
        instruction: |
          Claim triage, intake side. The input file holds the FNOL
          event JSON (claim_id, cell_start, ...). Do not query
          anything yourself, do not analyze, do not add findings of
          your own, and call NO tool other than your peer tool (no
          create_sqlite_db, no merge_structured_data, no artifact
          search and replace -- write the contract directly).

          Delegate EXACTLY ONE task to your peer agent
          ClaimsIntakeAnalyst, with exactly this text and the claim id
          of the event filled in:
          "Per-claim intake JSON for claim_id <claim_id>. Answer with
          ONLY the intake JSON contract."

          Fill the structured output contract with the peer's values
          UNCHANGED -- do not re-interpret, re-round or summarize
          them, and add nothing of your own. If the peer does not
          answer or answers without a JSON object, fill the contract
          with "" / 0 / false / [] plus "intake_found": false and
          "summary": "intake analyst unavailable: <one-sentence
          reason>".
        output_schema:
          type: object
          required: [intake_found, indicators, summary]
          properties:
            intake_found:
              type: boolean
              description: An fnol_intake document exists for the claim.
            dent_count_est:
              type: integer
              description: damage_signals.dent_count_est of the primary document.
            glass_shattered:
              type: boolean
            roof_deformed:
              type: boolean
            drivable:
              type: boolean
            photos_before_cell:
              type: boolean
              description: The earliest photo predates the hail cell start.
            repeat_contact:
              type: boolean
              description: A second intake document (is_repeat_contact) exists.
            complaint_flag:
              type: boolean
            scanner_mismatch:
              type: boolean
              description: mismatch_flag of the scan (deviation above 50 percent).
            duplicate_vin_claims:
              type: array
              items: { type: string }
              description: Other claim_ids reported on the same VIN.
            indicators:
              type: array
              items: { type: string }
              description: Human-readable indicators; empty when clean.
            summary:
              type: string
              description: 1-2 sentences with the key intake facts.
      # ---- fan-out 3/3: the governing rules (knowledge base) ------
      # instruction only, NO input. At most three searches with
      # top_k 3 and no get_knowledge_document: the expert otherwise
      # reads six documents in full (~40 s, seen on the general
      # tier; this profile runs it on fast).
      - id: rules
        type: agent
        agent_name: Acme Claims Knowledge Expert
        timeout: "75s"
        instruction: |
          Claim triage, rules side. The input file holds the FNOL
          event JSON (fields claim_id, severity, policy_id, channel,
          event_id, cell_start, ...). Work on THAT claim. Data
          snapshot "now" is Monday 2026-07-20 10:00 UTC; never use
          the wall clock.

          Do NOT load any skill and do not narrate. Run EXACTLY
          these three searches, each with top_k 3, nothing else --
          one topic per query, because a query that mixes topics
          retrieves neither:
          (1) search_claims_guidelines, query "Fast Lane criteria
              minor hail claim estimate below 1000 drive-in";
          (2) search_policy_wordings, query "hail cover HC-7
              deductible once per event repair network clause RN-3"
              -- only when the event's severity is SEVERE use "hail
              cover HC-7 deductible repair network clause RN-3 total
              loss definition TL-1" instead;
          (3) search_claims_guidelines, query "fraud indicators
              pre-dated photos scanner mismatch duplicate VIN human
              specialist decides".
          Do NOT call get_knowledge_document, do not search the
          partner contracts or the storm playbooks, do not save
          artifacts. This node has slack: correct citations matter
          more than speed.

          From the hits fill the output contract: rules = 3 to 6
          objects {doc_id, title, rule} where rule is ONE decisive
          sentence quoted verbatim from the returned text, at most 25
          words (quote the decisive half of a long sentence); fast_lane_rule = the CG-FL-1 sentence with the
          Fast Lane conditions (damage, estimate below EUR 1,000,
          ACTIVE policy, hail cover HC-7); hold_rule = the CG-FR-5
          sentence "a single indicator proves nothing, the overall
          picture decides, a human specialist decides; never delay
          the honest majority"; network_rule = the PW-RN-3 sentence
          on steering and the 5 working days; deductible_rule = the
          PW-HC-7 sentence that the deductible applies once per
          hail event. Quote only what the searches returned; when a
          rule is not in the hits write "not retrieved" -- never
          invent a clause, number or threshold.

          Fill EXACTLY the five fields of the contract: rules,
          fast_lane_rule, hold_rule, network_rule, deductible_rule.
          Add no claim_id, no severity, no other key. Do not save
          artifacts of your own. ASCII only: write "EUR 1,000",
          never the euro sign.
        output_schema:
          type: object
          required: [rules, fast_lane_rule, hold_rule, network_rule,
                     deductible_rule]
          properties:
            rules:
              type: array
              description: 3-6 cited rules.
              items:
                type: object
                properties:
                  doc_id:
                    type: string
                    description: e.g. CG-FL-1, PW-HC-7, CG-FR-5.
                  title:
                    type: string
                  rule:
                    type: string
                    description: One decisive sentence, quoted.
            fast_lane_rule:
              type: string
              description: The CG-FL-1 Fast Lane conditions.
            hold_rule:
              type: string
              description: The CG-FR-5 sentence on indicators and the human specialist.
            network_rule:
              type: string
              description: The PW-RN-3 steering / 5 working days sentence.
            deductible_rule:
              type: string
              description: The PW-HC-7 once-per-event deductible sentence.
      # ---- fan-in: the decision -------------------------------------
      # `input:` with WHOLE-STRING templates only (see header) plus
      # the instruction. The decision agent's system prompt holds
      # the decision matrix; the instruction only frames the merge.
      - id: decision
        type: agent
        agent_name: Claims Triage Decision
        depends_on:
          - policy
          - intake
          - rules
        timeout: "60s"
        input:
          claim_event: "{{workflow.input.text}}"
          policy: "{{policy.output}}"
          intake: "{{intake.output}}"
          rules: "{{rules.output}}"
        instruction: |
          Merge the four sections of your input into ONE triage
          decision for the claim in claim_event: policy (Acme
          Insurance Query Expert), intake (Claims Intake Analyst,
          external) and rules (Acme Claims Knowledge Expert). Apply
          your decision matrix in order (REFER, HOLD,
          TOTAL_LOSS_FASTLANE, FAST_LANE, STANDARD). A section may
          be null when its node failed: decide with the rest -- a
          missing, null or empty intake section means REFER /
          HANDLER with the reason "intake unavailable"; a missing
          rules section means cite the document ids from your
          instructions. Data snapshot "now" is Monday 2026-07-20
          10:00 UTC; never use the wall clock. Do not delegate, do
          not ask, do not call tools. This node is the last hop
          before the cockpit, so keep it tight: 3 reasons (4 only
          when a HOLD indicator needs its own sentence) and a
          2-sentence summary. ASCII only: write "EUR 300", never the
          euro sign. reasons and indicators are arrays of strings,
          never one joined string.
        output_schema:
          type: object
          required: [claim_id, decision, lane, headline, reasons,
                     next_step, summary]
          properties:
            claim_id:
              type: string
            decision:
              type: string
              enum: [APPROVE, HOLD, REFER]
            lane:
              type: string
              enum: [FAST_LANE, STANDARD, TOTAL_LOSS_FASTLANE,
                     SPECIAL_INVESTIGATIONS, HANDLER]
            headline:
              type: string
              description: At most 90 characters, decision first.
            reasons:
              type: array
              items: { type: string }
              description: 3-4 sentences, each citing a doc_id where a rule applies.
            indicators:
              type: array
              items: { type: string }
              description: Copied from the intake section; empty when clean.
            next_step:
              type: string
              description: One imperative sentence.
            partner:
              type: string
              description: Partner id (P-BRAENDLE, P-ROADASSIST ...) or "".
            deductible_eur:
              type: integer
            reserve_eur:
              type: number
            customer:
              type: string
              description: Customer name and segment, e.g. Lena Hartmann (PRIVATE).
            vehicle:
              type: string
            confidence:
              type: number
              description: 0-1.
            summary:
              type: string
              description: 2 sentences for the cockpit, read aloud by the claims lead.
