# Break-glass fallback for the live Builder demo: creates the
# MongoDB intake connectors + agent declaratively if the Builder
# beat fails on stage.  Apply with:
#   sam config apply -m manifest.yaml
# NEVER --prune (unmanaged resources would be deleted).
kind: manifest
name: ins-intake-fallback
description: >-
  Fallback provisioning of the Storm Intake Analyst (MongoDB FNOL
  intake + weather cells + drive-in scanner results) for the
  insurance demo.
target:
  name: solace-lab
  url: https://sam.solace.lab
  auth:
    type: oauth
resources:
  connectors:
    - fnol-intake
    - weather-cells
    - scanner-results
  agents:
    - Storm Intake Analyst
