# Third collection of the same acme_claims MongoDB (one connector
# per collection). Same demo-only read-only user as fnol-intake.
# Needed by the fraud act: the drive-in scanner count is the
# objective counterpart to the dent count the customer claimed.
kind: connector
name: scanner-results
description: >-
  Drive-in hail scanner results (MongoDB collection
  scanner_results): one document per scanned DRIVE_IN_SCANNER
  claim with claim id, partner id, scan time, scanned dent count,
  affected panels, scanner estimate and a mismatch flag set when
  the scanned count deviates strongly from the count the customer
  claimed at intake.
spec:
  type: document_db
  subtype: mongodb
  values:
    scheme: mongodb
    hostname: host.docker.internal
    port: 27017
    username: sam_ro
    password: sam_ro
    database: acme_claims
    collection: scanner_results
    options: "authSource=acme_claims"
