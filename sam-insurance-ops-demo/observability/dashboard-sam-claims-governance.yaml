apiVersion: v1
data:
  sam-claims-governance.json: "{\n \"uid\": \"sam-claims-governance\",\n \"title\": \"SAM Claims Governance\",\n \"tags\": [\n  \"sam\",\n  \"insurance-ops\",\n  \"governance\"\n ],\n \"schemaVersion\": 39,\n \"editable\": true,\n \"refresh\": \"10s\",\n \"time\": {\n  \"from\": \"now-1h\",\n  \"to\": \"now\"\n },\n \"timezone\": \"browser\",\n \"panels\": [\n  {\n   \"id\": 1,\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"## SAM Claims Governance - the control layer over the claim triage\\n**1. Control layer** -> **2. The claim** -> **3. Who did what** -> **4. Model management** -> **5. Quality** -> **6. The proof** - one stack: Prometheus metrics, Loki audit logs, Tempo broker traces, the SAM platform DB and the WebUI task DB.\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"id\": 2,\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 2,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 1. Control layer - is the estate under control? *(components, broker links, registered agents, claims in flight - and the roster, workflows and entrypoints straight from the platform DB)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"id\": 3,\n   \"type\": \"stat\",\n   \"title\": \"Components up\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 4,\n    \"w\": 3,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum(sam_instance_up)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"up\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"none\",\n    \"textMode\": \"auto\",\n    \"justifyMode\": \"auto\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"yellow\",\n        \"value\": 2\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 3\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"gwe + awe + str (sam_instance_up).\"\n  },\n  {\n   \"id\": 4,\n   \"type\": \"stat\",\n   \"title\": \"Broker links\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 3,\n    \"y\": 4,\n    \"w\": 3,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum(sam_broker_connection_state)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"connected\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"none\",\n    \"textMode\": \"auto\",\n    \"justifyMode\": \"auto\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 3\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"Every component holds its own link to the sam VPN (sam_broker_connection_state).\"\n  },\n  {\n   \"id\": 5,\n   \"type\": \"stat\",\n   \"title\": \"Registered agents\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 6,\n    \"y\": 4,\n    \"w\": 3,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"count(sam_component_count{type=\\\"agent\\\"}==1)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"agents\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"none\",\n    \"textMode\": \"auto\",\n    \"justifyMode\": \"auto\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 1\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"Platform agents loaded by awe. Agents discovered over the broker (the external Claims Intake Analyst) are NOT counted here - see Agent Management.\"\n  },\n  {\n   \"id\": 6,\n   \"type\": \"stat\",\n   \"title\": \"Claims in flight\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 9,\n    \"y\": 4,\n    \"w\": 3,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sam_gateway_tasks_in_flight\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"in flight\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"none\",\n    \"textMode\": \"auto\",\n    \"justifyMode\": \"auto\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"Tasks the gateway is currently waiting on (sam_gateway_tasks_in_flight).\"\n  },\n  {\n   \"id\": 7,\n   \"type\": \"table\",\n   \"title\": \"Agent roster (platform DB)\",\n   \"datasource\": {\n    \"type\": \"postgres\",\n    \"uid\": \"sam-platform-config-db\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 4,\n    \"w\": 12,\n    \"h\": 10\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-config-db\"\n     },\n     \"rawSql\": \"SELECT name, type, model_provider AS model_alias, created_by,\\n       to_timestamp(created_time/1000) AS created\\nFROM agents\\nWHERE coalesce(is_ephemeral, 0) = 0\\nORDER BY name\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"cellHeight\": \"sm\",\n    \"footer\": {\n     \"show\": false\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\",\n      \"filterable\": false\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"Non-ephemeral agents with their model alias and creator. The external Claims Intake Analyst is discovered over the broker and has no DB row (Agent Management shows it as type discovered).\"\n  },\n  {\n   \"id\": 8,\n   \"type\": \"table\",\n   \"title\": \"Workflows / entrypoints (platform DB)\",\n   \"datasource\": {\n    \"type\": \"postgres\",\n    \"uid\": \"sam-platform-config-db\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 9,\n    \"w\": 12,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-config-db\"\n     },\n     \"rawSql\": \"SELECT name, 'workflow' AS kind, created_by,\\n       to_timestamp(created_time/1000) AS created\\nFROM workflows\\nUNION ALL\\nSELECT name, 'entrypoint (' || type || ')' AS kind, created_by,\\n       to_timestamp(created_time/1000) AS created\\nFROM gateways\\nORDER BY kind, name\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"cellHeight\": \"sm\",\n    \"footer\": {\n     \"show\": false\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\",\n      \"filterable\": false\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"workflows.name and gateways.name/type in one list.\"\n  },\n  {\n   \"id\": 9,\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 14,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 2. The claim - from event to decision *(FNOL event on the broker -> claim-triage workflow -> decision; every A2A hop is a broker span and the broker counts them)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"id\": 10,\n   \"type\": \"timeseries\",\n   \"title\": \"Claims events per minute (WebUI task DB)\",\n   \"datasource\": {\n    \"type\": \"postgres\",\n    \"uid\": \"sam-platform-db\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 16,\n    \"w\": 8,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT date_trunc('minute', to_timestamp(start_time/1000)) AS time,\\n       'claims' AS metric,\\n       count(*)::float AS value\\nFROM tasks\\nWHERE parent_task_id IS NULL\\n  AND initial_request_text LIKE '%\\\"event_type\\\":\\\"fnol_received\\\"%'\\n  AND to_timestamp(start_time/1000) BETWEEN $__timeFrom() AND $__timeTo()\\nGROUP BY 1\\nORDER BY 1\",\n     \"format\": \"time_series\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"bars\",\n      \"showPoints\": \"never\",\n      \"fillOpacity\": 60,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"description\": \"Root tasks whose request text is the FNOL event JSON (event_type fnol_received). The event_mesh entrypoint emits no sam_entrypoint_* metrics (2.225.14, still so on 2.348.22), so the task DB is the claim counter.\"\n  },\n  {\n   \"id\": 11,\n   \"type\": \"timeseries\",\n   \"title\": \"Decision latency p50/p95 per workflow (s)\",\n   \"datasource\": {\n    \"type\": \"loki\",\n    \"uid\": \"loki\"\n   },\n   \"gridPos\": {\n    \"x\": 8,\n    \"y\": 16,\n    \"w\": 8,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"quantile_over_time(0.50, {namespace=\\\"sam-solace-lab\\\", container=\\\"awe\\\"} |= `\\\"message\\\":\\\"workflow completed successfully\\\"` | json agentName=\\\"agentName\\\", duration=\\\"duration\\\" | __error__=\\\"\\\" | unwrap duration [$__auto]) by (agentName) / 1e9\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"p50 {{agentName}}\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"quantile_over_time(0.95, {namespace=\\\"sam-solace-lab\\\", container=\\\"awe\\\"} |= `\\\"message\\\":\\\"workflow completed successfully\\\"` | json agentName=\\\"agentName\\\", duration=\\\"duration\\\" | __error__=\\\"\\\" | unwrap duration [$__auto]) by (agentName) / 1e9\",\n     \"refId\": \"B\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"p95 {{agentName}}\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"line\",\n      \"showPoints\": \"always\",\n      \"fillOpacity\": 10,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   },\n   \"description\": \"awe log 'workflow completed successfully' carries the workflow duration in ns; agentName is the workflow runtime name (workflow_<id>).\"\n  },\n  {\n   \"id\": 12,\n   \"type\": \"timeseries\",\n   \"title\": \"Agent step duration p95 per agent (s)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 16,\n    \"y\": 16,\n    \"w\": 8,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.95, sum by (le, component_name) (rate(sam_operation_duration_seconds_bucket{type=\\\"agent\\\"}[5m])))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{component_name}}\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"line\",\n      \"showPoints\": \"auto\",\n      \"fillOpacity\": 10,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   },\n   \"description\": \"sam_operation_duration_seconds_bucket{type=agent} - one series per platform agent; the fast tier should sit well below the general tier.\"\n  },\n  {\n   \"id\": 13,\n   \"type\": \"traces\",\n   \"title\": \"Every hop of a claim is a span (Tempo)\",\n   \"datasource\": {\n    \"type\": \"tempo\",\n    \"uid\": \"tempo\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 23,\n    \"w\": 12,\n    \"h\": 9\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"tempo\",\n      \"uid\": \"tempo\"\n     },\n     \"queryType\": \"traceql\",\n     \"query\": \"{ name =~ \\\".*a2a/v1/agent/request.*\\\" }\",\n     \"limit\": 20,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {},\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"description\": \"Broker tracing on the sam VPN: root span sam-solace-lab/a2a/v1/agent/request/<runtime name> receive, tags messaging.solace.user_properties.userId and traceId. The external agent's hop shows up here too. Tempo retention 48 h.\"\n  },\n  {\n   \"id\": 14,\n   \"type\": \"timeseries\",\n   \"title\": \"A2A hops per target agent (broker span metrics)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 23,\n    \"w\": 12,\n    \"h\": 9\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum by (target) (label_replace(increase(traces_spanmetrics_calls_total{span_name=~\\\".*a2a/v1/agent/request/.*\\\"}[5m]), \\\"target\\\", \\\"$1\\\", \\\"span_name\\\", \\\".*/request/([^ ]+).*\\\"))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{target}}\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"bars\",\n      \"showPoints\": \"never\",\n      \"fillOpacity\": 60,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"description\": \"traces_spanmetrics_calls_total from Tempo's metrics-generator, one series per a2a request topic: the broker counts every hop - platform agents (agent_<id>), the workflow (workflow_<id>) and the external ClaimsIntakeAnalyst alike. Runtime names, not display names.\"\n  },\n  {\n   \"id\": 15,\n   \"type\": \"table\",\n   \"title\": \"Claims decided (WebUI task DB)\",\n   \"datasource\": {\n    \"type\": \"postgres\",\n    \"uid\": \"sam-platform-db\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 32,\n    \"w\": 24,\n    \"h\": 6\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT to_timestamp(start_time/1000) AS started,\\n       substring(initial_request_text from '\\\"claim_id\\\":\\\"([^\\\"]+)\\\"') AS claim_id,\\n       substring(initial_request_text from '\\\"severity\\\":\\\"([^\\\"]+)\\\"') AS severity,\\n       user_id,\\n       status,\\n       round((end_time - start_time)/1000.0, 1) AS seconds\\nFROM tasks\\nWHERE parent_task_id IS NULL\\n  AND initial_request_text LIKE '%\\\"event_type\\\":\\\"fnol_received\\\"%'\\n  AND to_timestamp(start_time/1000) BETWEEN $__timeFrom() AND $__timeTo()\\nORDER BY start_time DESC\\nLIMIT 12\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"cellHeight\": \"sm\",\n    \"footer\": {\n     \"show\": false\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\",\n      \"filterable\": false\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"One row per FNOL root task: claim id and severity parsed from the event JSON, the user identity the entrypoint assigned, status and wall seconds.\"\n  },\n  {\n   \"id\": 16,\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 38,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 3. Who did what - audit and security *(every tool execution carries the user; the external agent seen from both sides; auth failures and capability-widening blocks as the negative signals; RBAC as it is configured)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"id\": 17,\n   \"type\": \"timeseries\",\n   \"title\": \"Tool executions by user -> tool (audit)\",\n   \"datasource\": {\n    \"type\": \"loki\",\n    \"uid\": \"loki\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 40,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (userID, tool) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `tool execution` | json userID=\\\"userID\\\", tool=\\\"tool\\\" | __error__=\\\"\\\" [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"{{userID}} -> {{tool}}\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"bars\",\n      \"showPoints\": \"never\",\n      \"fillOpacity\": 60,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"description\": \"Loki audit stream (logger_name audit, 'tool execution succeeded/failed') grouped by userID and tool.\"\n  },\n  {\n   \"id\": 18,\n   \"type\": \"timeseries\",\n   \"title\": \"Agent calls per agent (5 min)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 40,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum by (component_name) (increase(sam_operation_duration_seconds_count{type=\\\"agent\\\"}[5m]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{component_name}}\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"line\",\n      \"showPoints\": \"auto\",\n      \"fillOpacity\": 10,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"description\": \"increase of sam_operation_duration_seconds_count{type=agent} - how often each platform agent ran.\"\n  },\n  {\n   \"id\": 19,\n   \"type\": \"timeseries\",\n   \"title\": \"External agent traffic (its own log vs the broker)\",\n   \"datasource\": {\n    \"type\": \"datasource\",\n    \"uid\": \"-- Mixed --\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 47,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (pod) (count_over_time({namespace=\\\"sam-solace-lab-agents\\\", pod=~\\\"sam-claims-intake-agent.*\\\"} |= \\\"Received new A2A request\\\" [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"agent log: inbound A2A ({{pod}})\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum(increase(traces_spanmetrics_calls_total{span_name=~\\\".*a2a/v1/agent/request/ClaimsIntakeAnalyst.*\\\"}[5m]))\",\n     \"refId\": \"B\",\n     \"legendFormat\": \"broker: requests to ClaimsIntakeAnalyst\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"bars\",\n      \"showPoints\": \"never\",\n      \"fillOpacity\": 60,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"description\": \"A: the external v1-SDK agent runs outside the platform and logs plain text - every inbound request logs 'Received new A2A request on topic: ...'. B: the broker's span metrics for the same topic. The platform itself has no metric or audit line for that hop; the Liaison's task in Activities and the Tempo span are the platform-side proof.\"\n  },\n  {\n   \"id\": 20,\n   \"type\": \"timeseries\",\n   \"title\": \"Auth failures + capability widening blocks\",\n   \"datasource\": {\n    \"type\": \"loki\",\n    \"uid\": \"loki\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 47,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (errorType) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"gateway-auth\\\"` | json errorType=\\\"errorType\\\", httpStatus=\\\"httpStatus\\\" | __error__=\\\"\\\" | httpStatus = \\\"401\\\" [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"401 {{errorType}}\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (userID) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"event\\\":\\\"capability_widening_blocked\\\"` | json userID=\\\"userID\\\" | __error__=\\\"\\\" [$__auto]))\",\n     \"refId\": \"B\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"widening blocked: {{userID}}\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (reason) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `authentication failed` | json reason=\\\"reason\\\" | __error__=\\\"\\\" [$__auto]))\",\n     \"refId\": \"C\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"auth-fail: {{reason}}\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"bars\",\n      \"showPoints\": \"never\",\n      \"fillOpacity\": 60,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"description\": \"gateway-auth httpStatus 401 by errorType, str-worker event capability_widening_blocked by userID, audit 'authentication failed' by reason. RBAC grants log at DEBUG only, so there is no 'denied' panel on purpose.\"\n  },\n  {\n   \"id\": 21,\n   \"type\": \"table\",\n   \"title\": \"RBAC roles -> scopes (platform DB)\",\n   \"datasource\": {\n    \"type\": \"postgres\",\n    \"uid\": \"sam-platform-config-db\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 54,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-config-db\"\n     },\n     \"rawSql\": \"SELECT r.name AS role,\\n       count(s.scope) AS scopes,\\n       string_agg(s.scope, ', ' ORDER BY s.scope) AS scope_list\\nFROM rbac_roles r\\nLEFT JOIN rbac_role_scopes s ON s.role_id = r.id\\nGROUP BY r.name\\nORDER BY r.name\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"cellHeight\": \"sm\",\n    \"footer\": {\n     \"show\": false\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\",\n      \"filterable\": false\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"rbac_roles joined with rbac_role_scopes (v2 grammar category:resource:verb).\"\n  },\n  {\n   \"id\": 22,\n   \"type\": \"table\",\n   \"title\": \"IdP group -> role (platform DB)\",\n   \"datasource\": {\n    \"type\": \"postgres\",\n    \"uid\": \"sam-platform-config-db\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 54,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-config-db\"\n     },\n     \"rawSql\": \"SELECT m.oidc_provider AS idp, m.claim_key, m.claim_value AS idp_group,\\n       r.name AS role\\nFROM rbac_idp_claim_mappings m\\nJOIN rbac_idp_claim_mapping_roles mr ON mr.claim_mapping_id = m.id\\nJOIN rbac_roles r ON r.id = mr.role_id\\nORDER BY m.claim_value\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"cellHeight\": \"sm\",\n    \"footer\": {\n     \"show\": false\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\",\n      \"filterable\": false\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"rbac_idp_claim_mappings: which Keycloak group claim lands in which role.\"\n  },\n  {\n   \"id\": 23,\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 61,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 4. Model management - which model works for whom, at what cost *(tokens per agent x model, LLM latency per model, the alias table, an ILLUSTRATIVE cost, tokens per user for chargeback)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"id\": 24,\n   \"type\": \"timeseries\",\n   \"title\": \"Tokens per agent x model (rate)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 63,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum by (component_name, gen_ai_request_model) (rate(sam_gen_ai_tokens_used_total[5m]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{component_name}} @ {{gen_ai_request_model}}\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"line\",\n      \"showPoints\": \"auto\",\n      \"fillOpacity\": 10,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"description\": \"sam_gen_ai_tokens_used_total by component_name (agent-<name>, platform-eval-llm-judge) and model. The external agent's tokens are not visible here.\"\n  },\n  {\n   \"id\": 25,\n   \"type\": \"timeseries\",\n   \"title\": \"LLM latency p95 per model (s)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 63,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(sam_gen_ai_client_operation_duration_seconds_bucket[5m])))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{gen_ai_request_model}}\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"line\",\n      \"showPoints\": \"auto\",\n      \"fillOpacity\": 10,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   },\n   \"description\": \"sam_gen_ai_client_operation_duration_seconds_bucket.\"\n  },\n  {\n   \"id\": 26,\n   \"type\": \"table\",\n   \"title\": \"Model aliases (platform DB)\",\n   \"datasource\": {\n    \"type\": \"postgres\",\n    \"uid\": \"sam-platform-config-db\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 70,\n    \"w\": 8,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-config-db\"\n     },\n     \"rawSql\": \"SELECT alias, provider, model_name\\nFROM model_configurations\\nORDER BY alias\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"cellHeight\": \"sm\",\n    \"footer\": {\n     \"show\": false\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\",\n      \"filterable\": false\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"model_configurations: alias -> provider/model. Agents bind to the alias (fast, general, workflow, ...), not to the model.\"\n  },\n  {\n   \"id\": 27,\n   \"type\": \"stat\",\n   \"title\": \"Illustrative LLM cost, last 24 h (USD)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 8,\n    \"y\": 70,\n    \"w\": 8,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"(sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-haiku.*\\\",gen_ai_token_type=\\\"input\\\"}[24h])) or vector(0))/1e6*1 + (sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-haiku.*\\\",gen_ai_token_type=\\\"output\\\"}[24h])) or vector(0))/1e6*5 + (sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-sonnet.*\\\",gen_ai_token_type=\\\"input\\\"}[24h])) or vector(0))/1e6*2 + (sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-sonnet.*\\\",gen_ai_token_type=\\\"output\\\"}[24h])) or vector(0))/1e6*10 + (sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-opus.*\\\",gen_ai_token_type=\\\"input\\\"}[24h])) or vector(0))/1e6*5 + (sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-opus.*\\\",gen_ai_token_type=\\\"output\\\"}[24h])) or vector(0))/1e6*25 + (sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model!~\\\"claude-(haiku|sonnet|opus).*\\\",gen_ai_token_type=\\\"input\\\"}[24h])) or vector(0))/1e6*0.5 + (sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model!~\\\"claude-(haiku|sonnet|opus).*\\\",gen_ai_token_type=\\\"output\\\"}[24h])) or vector(0))/1e6*2\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"total\",\n     \"instant\": true,\n     \"range\": false\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"(sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-haiku.*\\\",gen_ai_token_type=\\\"input\\\"}[24h])) or vector(0))/1e6*1 + (sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-haiku.*\\\",gen_ai_token_type=\\\"output\\\"}[24h])) or vector(0))/1e6*5\",\n     \"refId\": \"B\",\n     \"legendFormat\": \"claude-haiku\",\n     \"instant\": true,\n     \"range\": false\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"(sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-sonnet.*\\\",gen_ai_token_type=\\\"input\\\"}[24h])) or vector(0))/1e6*2 + (sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-sonnet.*\\\",gen_ai_token_type=\\\"output\\\"}[24h])) or vector(0))/1e6*10\",\n     \"refId\": \"C\",\n     \"legendFormat\": \"claude-sonnet\",\n     \"instant\": true,\n     \"range\": false\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"(sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-opus.*\\\",gen_ai_token_type=\\\"input\\\"}[24h])) or vector(0))/1e6*5 + (sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model=~\\\"claude-opus.*\\\",gen_ai_token_type=\\\"output\\\"}[24h])) or vector(0))/1e6*25\",\n     \"refId\": \"D\",\n     \"legendFormat\": \"claude-opus\",\n     \"instant\": true,\n     \"range\": false\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"(sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model!~\\\"claude-(haiku|sonnet|opus).*\\\",gen_ai_token_type=\\\"input\\\"}[24h])) or vector(0))/1e6*0.5 + (sum(increase(sam_gen_ai_tokens_used_total{gen_ai_request_model!~\\\"claude-(haiku|sonnet|opus).*\\\",gen_ai_token_type=\\\"output\\\"}[24h])) or vector(0))/1e6*2\",\n     \"refId\": \"E\",\n     \"legendFormat\": \"other\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"none\",\n    \"textMode\": \"value_and_name\",\n    \"justifyMode\": \"auto\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"currencyUSD\",\n     \"decimals\": 2,\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"ILLUSTRATIVE - SAM exposes no cost metric. Tokens = increase over 24 h of sam_gen_ai_tokens_used_total, multiplied by fixed USD per million tokens (input / output): claude-haiku* 1 / 5, claude-sonnet* 2 / 10, claude-opus* 5 / 25 (Anthropic list prices, 2026-06); every other model (deepseek, qwen, gemini, ...) 0.5 / 2 as a placeholder. The lab routes all models through one proxy, so a real invoice differs. Edit the constants in the query to re-price.\"\n  },\n  {\n   \"id\": 28,\n   \"type\": \"table\",\n   \"title\": \"Tokens per user (WebUI task DB)\",\n   \"datasource\": {\n    \"type\": \"postgres\",\n    \"uid\": \"sam-platform-db\"\n   },\n   \"gridPos\": {\n    \"x\": 16,\n    \"y\": 70,\n    \"w\": 8,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT user_id,\\n       count(*) AS tasks,\\n       sum(total_input_tokens) AS input_tokens,\\n       sum(total_output_tokens) AS output_tokens\\nFROM tasks\\nWHERE to_timestamp(start_time/1000) BETWEEN $__timeFrom() AND $__timeTo()\\nGROUP BY user_id\\nORDER BY input_tokens DESC NULLS LAST\\nLIMIT 8\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"cellHeight\": \"sm\",\n    \"footer\": {\n     \"show\": false\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\",\n      \"filterable\": false\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"Prometheus knows models, the task DB knows users: tokens per user_id in the selected time range.\"\n  },\n  {\n   \"id\": 29,\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 77,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 5. Quality - evaluations over time *(average score per experiment x model x evaluator, the latest runs, the watchlist, what the LLM judge costs)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"id\": 30,\n   \"type\": \"timeseries\",\n   \"title\": \"Average score per experiment / model / evaluator\",\n   \"datasource\": {\n    \"type\": \"postgres\",\n    \"uid\": \"sam-platform-config-db\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 79,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-config-db\"\n     },\n     \"rawSql\": \"SELECT to_timestamp(r.completed_time/1000) AS time,\\n       e.name || ' / ' || coalesce(nullif(r.model, ''), 'production')\\n              || ' / ' || ev.name AS metric,\\n       avg(s.score) AS value\\nFROM eval_runs r\\nJOIN eval_experiments e ON e.id = r.experiment_id\\nJOIN eval_run_results rr ON rr.run_id = r.id\\nJOIN eval_run_scores s ON s.run_result_id = rr.id\\nJOIN eval_evaluators ev ON ev.id = s.evaluator_id\\nWHERE r.completed_time IS NOT NULL\\n  AND to_timestamp(r.completed_time/1000) BETWEEN $__timeFrom() AND $__timeTo()\\nGROUP BY 1, 2\\nORDER BY 1\",\n     \"format\": \"time_series\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"line\",\n      \"showPoints\": \"always\",\n      \"fillOpacity\": 0,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"percentunit\",\n     \"min\": 0,\n     \"max\": 1\n    },\n    \"overrides\": []\n   },\n   \"description\": \"eval_run_scores averaged per completed run; one point per run, so widen the time range to see the history. Model 'production' = the agent's own alias.\"\n  },\n  {\n   \"id\": 31,\n   \"type\": \"table\",\n   \"title\": \"Latest evaluation runs (platform DB)\",\n   \"datasource\": {\n    \"type\": \"postgres\",\n    \"uid\": \"sam-platform-config-db\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 79,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-config-db\"\n     },\n     \"rawSql\": \"SELECT to_timestamp(r.started_time/1000) AS started,\\n       e.name AS experiment,\\n       coalesce(nullif(r.model, ''), 'production') AS model,\\n       r.status,\\n       round(100.0 * avg(s.passed), 0) AS pass_pct,\\n       round(avg(rr.duration_seconds)::numeric, 1) AS avg_agent_s,\\n       round((r.completed_time - r.started_time)/1000.0, 0) AS wall_s,\\n       r.started_by\\nFROM eval_runs r\\nJOIN eval_experiments e ON e.id = r.experiment_id\\nLEFT JOIN eval_run_results rr ON rr.run_id = r.id\\nLEFT JOIN eval_run_scores s ON s.run_result_id = rr.id\\nGROUP BY r.id, e.name, r.model, r.status, r.started_time,\\n         r.completed_time, r.started_by\\nORDER BY r.started_time DESC\\nLIMIT 12\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"cellHeight\": \"sm\",\n    \"footer\": {\n     \"show\": false\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\",\n      \"filterable\": false\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"Last 12 runs regardless of the time range: pass % over all evaluator scores (pass = score >= 0.5), average agent seconds per example, wall seconds of the run, who started it.\"\n  },\n  {\n   \"id\": 32,\n   \"type\": \"stat\",\n   \"title\": \"Watchlist agents\",\n   \"datasource\": {\n    \"type\": \"postgres\",\n    \"uid\": \"sam-platform-config-db\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 87,\n    \"w\": 4,\n    \"h\": 6\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-config-db\"\n     },\n     \"rawSql\": \"SELECT count(DISTINCT agent_name) AS watchlist_agents\\nFROM eval_agent_watchlist\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"none\",\n    \"textMode\": \"auto\",\n    \"justifyMode\": \"auto\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"yellow\",\n        \"value\": null\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 1\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   },\n   \"description\": \"Distinct agents on any user's evaluation watchlist (eval_agent_watchlist, max 5 per user).\"\n  },\n  {\n   \"id\": 33,\n   \"type\": \"timeseries\",\n   \"title\": \"LLM judge tokens (rate)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 4,\n    \"y\": 87,\n    \"w\": 20,\n    \"h\": 6\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum by (gen_ai_request_model, gen_ai_token_type) (rate(sam_gen_ai_tokens_used_total{component_name=\\\"platform-eval-llm-judge\\\"}[5m]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"judge {{gen_ai_request_model}} {{gen_ai_token_type}}\"\n    }\n   ],\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\",\n     \"showLegend\": true\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"drawStyle\": \"line\",\n      \"showPoints\": \"auto\",\n      \"fillOpacity\": 10,\n      \"lineWidth\": 1,\n      \"pointSize\": 5\n     },\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"description\": \"component_name platform-eval-llm-judge - the judge runs on the general alias and is the hidden cost of every LLM-judged experiment.\"\n  },\n  {\n   \"id\": 34,\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 93,\n    \"w\": 24,\n    \"h\": 3\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 6. The proof *(drilldown)*\\n**SAM Activities**: `https://sam.solace.lab` -> Activities -> the claim task (power_user) -> task tree and *Performance* | **Tempo**: Explore -> Tempo -> TraceQL `{ name =~ \\\".*a2a/v1/agent/request.*\\\" }` - the external agent's hop is a broker span like every other | **Loki**: every gwe/awe line carries a SAM `traceID`/`taskID` and `userID` - filter on it to follow one task across gwe/awe/str (Tempo has broker spans only) | **No 'denied' panel on purpose**: RBAC grants log at DEBUG; the negative signals are auth failures (gateway-auth 401) and capability-widening blocks (str-worker).\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  }\n ]\n}"
