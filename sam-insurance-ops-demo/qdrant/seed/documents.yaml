    text: >
      Partner P-BRAENDLE, Braendle Drive-In Hail Center, Sindelfingen,
      is Acme's primary drive-in partner for Landkreis Boeblingen,
      contract status ACTIVE, tier PREMIUM. The partner operates an
      optical dent scanner lane and a paintless dent repair shop.
