  - doc_id: PC-BRAENDLE-2025
    doc_type: partner_contracts
    title: Drive-in contract P-BRAENDLE (Braendle Drive-In Hail Center)
    section: Partner contract, drive-in, Sindelfingen
    effective_from: "2025-03-01"
