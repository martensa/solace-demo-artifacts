# Acme Insurance -- claims knowledge corpus (sam-insurance-ops-demo).
#
# Embedded into Qdrant collection acme_knowledge by
# ../mcp-server/seed.py (one point per document, payload = all
# fields below). Four doc_types, one MCP search tool each:
#   policy_wordings    what the CUSTOMER is entitled to   (PW-*)
#   claims_guidelines  how ACME handles a claim           (CG-*)
#   partner_contracts  what a PARTNER owes / may activate (PC-*)
#   storm_playbooks    how to PLAN for a hail cell        (SP-*)
#
# Story anchors (spec 3.3, ids and decisive sentences are a contract
# with the talk track and the workflow prompts): PW-HC-7, PW-RN-3,
# PW-TL-1, CG-FL-1, CG-TL-2, CG-BAFIN-30, CG-FR-5, CG-CX-3,
# PC-BRAENDLE-2025, PC-DELLENDOC-2024, PC-IC-2, PC-ROADASSIST-2025,
# PC-RENTAFLEET-2026, PC-RATES-2026, SP-NATCAT-4, SP-HZ-0907,
# SP-REUTLINGEN-2023. The remaining documents are filler that make
# the semantic search non-trivial. Every text is 80-250 words.
#
# Fictional carrier, fictional partners, no real company branding.
documents:

  # ---------------------------------------------------------------
  # policy_wordings
  # ---------------------------------------------------------------
  - doc_id: PW-HC-7
    doc_type: policy_wordings
    title: Hail cover HC-7
    section: Motor policy conditions, clause HC-7
    effective_from: "2025-01-01"
    tags: [hail, motor, deductible, glass, partner-network]
    text: >
      Clause HC-7 covers damage to the insured vehicle caused by hail.
      It is part of every MOTOR_COMPREHENSIVE policy and of every
      MOTOR_PARTIAL policy where the hail_cover flag is set. Covered
      are dents on body panels, damaged glazing, broken lamps and
      mirrors, and damage to attached equipment such as roof boxes,
      provided the damage was caused by hailstones during a documented
      weather event. The deductible stated in the policy schedule
      applies once per hail event, regardless of the number of damaged
      panels or repair steps. Glass damage repaired through the Acme
      partner network is settled without deductible; the deductible is
      waived only for the glass position, not for body repairs on the
      same claim. A hail event is documented by the weather cell record
      of the Acme NatCat desk (event_id) or by an official warning of
      the national weather service. HC-7 does not cover damage that
      existed before the event date, damage to unregistered vehicles,
      or losses reported later than seven days after the customer
      became aware of the damage without good reason.

  - doc_id: PW-RN-3
    doc_type: policy_wordings
    title: Repair network steering clause RN-3
    section: Motor policy conditions, clause RN-3
    effective_from: "2025-01-01"
    tags: [repair-network, discount, steering, workshop-choice, slot]
    text: >
      Clause RN-3 grants a premium discount of 15 percent in exchange
      for the customer's agreement that Acme steers repairs to its
      partner network of drive-in hail centers and contracted body
      shops. With RN-3 active (repair_network_clause = true on the
      policy), Acme proposes a partner and a repair slot after the
      first notice of loss and the customer has the repair carried out
      there. The steering obligation is limited in time: if no partner
      slot is offered within 5 working days after FNOL, the customer's
      free choice of workshop applies and the discount stays. A slot
      proposal counts only when it names a partner, a date and a time
      window that the customer can accept; a waiting list entry does
      not count. Acme informs the customer in text form when the five
      working days have passed without a proposal. Costs at a freely
      chosen workshop are reimbursed up to the level of the partner
      network rates published in the Acme rate card. RN-3 does not
      restrict the choice of workshop for total losses or for repairs
      that a partner declines for technical reasons.

  - doc_id: PW-TL-1
    doc_type: policy_wordings
    title: Total loss definition
    section: Motor policy conditions, clause TL-1
    effective_from: "2025-01-01"
    tags: [total-loss, replacement-value, fastlane, signature]
    text: >
      A vehicle is treated as a total loss under clause TL-1 when the
      repair estimate exceeds 70 percent of the replacement value on
      the day of loss, or when the intake evidence shows the hail
      total-loss signature: glass shattered and roof deformed with more
      than 150 dents. Either criterion is sufficient on its own. Claims
      that meet a criterion are moved to the Total Loss Fastlane track
      and are not queued for a drive-in scan or a body shop slot,
      because a repair estimate would add days without changing the
      outcome. The replacement value is the price of a vehicle of the
      same make, model, age, mileage and condition on the regional
      market (see PW-VAL-1). Acme settles the replacement value less
      the residual value of the damaged vehicle and less the
      deductible, unless the customer keeps the vehicle. A vehicle that
      meets the signature but that an adjuster later assesses as
      repairable is returned to the standard track with the customer's
      consent; the assessment must be documented on the claim.

  - doc_id: PW-GL-2
    doc_type: policy_wordings
    title: Glass damage handling
    section: Motor policy conditions, clause GL-2
    effective_from: "2025-01-01"
    tags: [glass, windscreen, deductible, partner-network]
    text: >
      Clause GL-2 applies to glazing damage on motor vehicles,
      including windscreen, rear window, side windows, panoramic roofs
      and glass sunroofs. Repair of a stone chip or a small crack is
      preferred to replacement whenever the damage is outside the
      driver's primary field of view and smaller than a two-euro coin.
      When repaired or replaced through a partner of the Acme network,
      the deductible is waived for the glass position (see HC-7).
      Outside the network, the deductible applies and reimbursement is
      capped at partner rates. Panoramic roofs that are shattered by
      hail are treated as glass; a deformed roof panel around them is
      body damage and falls under the general deductible. Glass claims
      under EUR 1,000 with an active policy and hail cover are handled
      in the Fast Lane without an adjuster. Calibration of driver
      assistance sensors after a windscreen replacement is part of the
      covered repair when the vehicle manufacturer requires it.

  - doc_id: PW-DED-1
    doc_type: policy_wordings
    title: Deductible rules
    section: Motor policy conditions, deductibles
    effective_from: "2025-01-01"
    tags: [deductible, once-per-event, schedule, fast-lane]
    text: >
      The deductible is the amount the customer bears per insured
      event; the policy schedule states it as deductible_eur, usually
      EUR 150, 300 or 500 for hail cover. It is charged once per event,
      not per damaged panel, not per repair visit and not per partner
      involved. When one hail event damages several vehicles under one
      fleet policy, each vehicle is a separate insured event with its
      own deductible. When a claim is split between a glass repair at
      a partner and a body repair elsewhere, only the body position
      carries the deductible (see GL-2). The deductible is deducted
      from the payment to the customer or, when the workshop is paid
      directly, collected by the workshop on behalf of Acme. Fast Lane
      confirmations must state the deductible amount so the customer
      knows the net position before the repair starts. A deductible is
      never waived by an automated decision; waivers require a claims
      lead and a documented reason such as a goodwill case.

  - doc_id: PW-PROP-HAIL
    doc_type: policy_wordings
    title: Property hail cover
    section: Property policy conditions, hail
    effective_from: "2025-01-01"
    tags: [property, building, roof, skylight, photovoltaic]
    text: >
      Property policies cover hail damage to the insured building and
      its permanently attached parts: roof tiles and roof windows,
      skylights, gutters, facades, blinds and shutters, conservatories
      and photovoltaic modules mounted on the building. Contents are
      covered when hail entered the building through an opening caused
      by the same event. Emergency measures such as tarpaulins to
      prevent further water ingress are covered without prior approval
      up to EUR 2,500 and must be reported with the claim. The
      deductible stated in the schedule applies once per event and
      building. Property claims are handled by the property desk, never
      in the motor Fast Lane, because estimates require a roofer or
      glazier inspection in most cases. During NatCat events the
      property desk plans with the playbook rate of 18 percent of
      exposed buildings in the warning polygon reporting a claim
      within 48 hours. Photovoltaic modules are settled at replacement
      value less a deduction for age when older than ten years.

  - doc_id: PW-MC-1
    doc_type: policy_wordings
    title: Motor comprehensive and partial cover scope
    section: Motor policy conditions, products
    effective_from: "2025-01-01"
    tags: [product, comprehensive, partial, scope, garage-parking]
    text: >
      Acme sells two motor products. MOTOR_PARTIAL covers loss or
      damage caused by fire, theft, glass breakage, collision with
      animals, and natural hazards including storm, hail, flood and
      lightning. MOTOR_COMPREHENSIVE includes all partial cover
      positions and adds damage caused by the driver, vandalism and
      collision. Both products carry hail cover clause HC-7 when the
      hail_cover flag is set in the policy record; a small share of
      older partial-cover policies excluded it for a lower premium.
      The repair network steering clause RN-3 can be combined with
      either product. Vehicle data in the policy record (vehicle_vin,
      vehicle_model, garage_parking) are the basis for the risk
      assessment; the garage_parking flag drives the hail exposure used
      by the NatCat desk. Policies with status ACTIVE on the day of the
      event are covered; a policy that starts after the event date
      gives no cover for that event. Fleet policies (customer segment
      FLEET) may list several vehicles under one contract number.

  - doc_id: PW-RENTAL-1
    doc_type: policy_wordings
    title: Replacement vehicle benefit
    section: Motor policy conditions, mobility
    effective_from: "2025-01-01"
    tags: [rental, mobility, not-drivable, rentafleet, 14-days]
    text: >
      When the insured vehicle is not drivable after a covered event,
      or is held at a partner for repair, the customer is entitled to
      a replacement vehicle from the Acme rental partner for the
      duration of the repair, up to 14 calendar days, extendable by
      the claims handler when the partner confirms a longer repair
      time. The replacement vehicle is one category below the insured
      vehicle unless a same-category vehicle is available at no extra
      cost. Customers who do not need a rental vehicle receive a daily
      mobility allowance instead. The benefit applies to total losses
      until the settlement is paid, at most 14 days from pick-up of
      the vehicle. During NatCat events rental capacity is scarce; the
      NatCat desk may pre-book cars with the rental partner (see
      PC-RENTAFLEET-2026) and allocate them to customers without a
      drivable vehicle first. The benefit does not cover fuel, tolls
      or damage to the rental vehicle beyond the rental partner's own
      excess.

  - doc_id: PW-DUTY-1
    doc_type: policy_wordings
    title: Policyholder duties after a loss
    section: Motor policy conditions, obligations
    effective_from: "2025-01-01"
    tags: [duties, fnol, photos, mitigation, seven-days]
    text: >
      After a loss the policyholder must report the damage to Acme
      without undue delay, at the latest within seven days after
      becoming aware of it, through one of the intake channels: app,
      voice agent, workshop portal, drive-in scanner or agency. The
      report must describe the damage truthfully and include photos of
      every damaged area where possible. The customer must take
      reasonable steps to prevent further damage, for example covering
      a broken window, and must not have the vehicle repaired before
      Acme has released the repair, except for emergency measures
      needed to keep the vehicle safe. The damaged vehicle must be
      made available for inspection at a drive-in center, a partner
      workshop or by remote valuation when Acme requests it. Duties
      are breached when facts are misrepresented on purpose, for
      example when damage that existed before the event is presented
      as hail damage; Acme may then reduce or refuse the payment
      according to the degree of fault.

  - doc_id: PW-FLEET-1
    doc_type: policy_wordings
    title: Fleet policy specifics
    section: Motor policy conditions, fleets
    effective_from: "2025-01-01"
    tags: [fleet, segment, reporting, garage-parking]
    text: >
      Fleet policies cover several vehicles of one commercial customer
      (segment FLEET). Each vehicle keeps its own policy_id in the
      policy record, so claims are always assigned to a single vehicle
      and a single policy. The fleet manager may report losses for all
      vehicles through the workshop portal or the agency channel, and
      Acme accepts one consolidated FNOL per vehicle. After a hail
      event the fleet manager receives one status overview per fleet
      instead of individual letters. Deductibles apply per vehicle
      (see PW-DED-1). Fleet vehicles are usually parked in the open;
      the garage_parking flag is therefore false for most fleet
      vehicles, which raises the hail exposure of the fleet in the
      NatCat planning. The repair network clause RN-3 applies to
      fleets in the same way as to private customers, including the
      five working day rule for the slot proposal. Fleet claims in the
      MINOR severity band qualify for the Fast Lane.

  - doc_id: PW-VAL-1
    doc_type: policy_wordings
    title: Replacement value determination
    section: Motor policy conditions, valuation
    effective_from: "2025-01-01"
    tags: [replacement-value, valuation, total-loss, remote-valuation]
    text: >
      The replacement value is the amount the customer would have to
      pay on the day of the loss for a vehicle of the same make,
      model, equipment, age, mileage and condition on the regional
      used-vehicle market. Acme determines it from market data
      services and, where needed, from a remote valuation by the
      assistance partner, who inspects the vehicle by video and photo
      without moving it to a workshop. Remote valuations are the
      standard for hail total losses because the damage pattern is
      visible on the outside and the vehicle's mechanical condition is
      not in question. The residual value of the damaged vehicle is
      determined by offers from the Acme salvage exchange within two
      working days. A customer who disagrees with the valuation may
      present a written offer from a dealer; the claims handler
      compares both and documents the decision. Replacement value,
      residual value and deductible are stated in the settlement
      letter of every total loss.

  - doc_id: PW-EXCL-1
    doc_type: policy_wordings
    title: Exclusions and pre-existing damage
    section: Motor policy conditions, exclusions
    effective_from: "2025-01-01"
    tags: [exclusions, pre-existing, event-date, photos]
    text: >
      Hail cover does not extend to damage that existed before the
      event date of the weather cell recorded on the claim.
      Pre-existing dents, corrosion, scratches or earlier hail damage
      that was paid out and not repaired are excluded and are
      separated from the new damage during the scan or the estimate.
      Photos submitted with the FNOL must show the current condition;
      the capture date stored in the photo metadata is compared with
      the event date of the cell during intake validation. Wear and
      tear, damage from improper repair attempts, and damage to loose
      items inside the vehicle are not covered. Damage that occurred
      while the vehicle was used for a purpose not declared in the
      policy, for example commercial passenger transport under a
      private policy, is excluded. The exclusions are not applied
      automatically: a mismatch between the photo date and the event
      date is an indicator for a specialist review, not a refusal in
      itself (see CG-FR-5).

  # ---------------------------------------------------------------
  # claims_guidelines
  # ---------------------------------------------------------------
  - doc_id: CG-FL-1
    doc_type: claims_guidelines
    title: Fast Lane criteria
    section: Claims handling manual, section 4.1
    effective_from: "2026-01-01"
    tags: [fast-lane, minor, auto-confirm, drive-in, no-adjuster]
    text: >
      The Fast Lane is the automated confirmation track for small hail
      claims. A claim qualifies as MINOR and enters the Fast Lane when
      all of the following hold: the damage is glass or dents only,
      the estimate is below EUR 1,000, the policy is ACTIVE on the
      event date, and hail cover HC-7 is set on the policy. Fast Lane
      claims are auto-confirmed without an adjuster: the clerk checks
      the policy, states the deductible, proposes a drive-in slot at
      the nearest ACTIVE drive-in partner in the customer's district
      and sends a short confirmation of at most three sentences to the
      customer. No reserve review, no photo assessment and no workshop
      estimate are required before the confirmation. The Fast Lane
      never pays out; payment is released after the scan or the repair
      invoice. A MINOR claim that later shows a total-loss signature,
      a scanner mismatch or a fraud indicator leaves the Fast Lane and
      is routed to the standard track or to a specialist. Fast Lane
      confirmations are logged with the policy and clause references
      used.

  - doc_id: CG-TL-2
    doc_type: claims_guidelines
    title: Total Loss Fastlane
    section: Claims handling manual, section 4.2
    effective_from: "2026-01-01"
    tags: [total-loss, fastlane, pick-up, remote-valuation, settlement]
    text: >
      The Total Loss Fastlane is the track for claims that meet a
      criterion of clause TL-1. The customer is contacted within one
      working day, the assistance partner picks up the vehicle or
      inspects it where it stands, and a remote valuation determines
      the replacement value and the residual value. The settlement
      target is 5 working days from entry into the track. A claim in
      the Fastlane is not assigned to a drive-in center or a body
      shop; it must not sit in an AWAITING_WORKSHOP_SLOT queue, because
      every day in that queue is a day lost against the settlement
      target and against the BaFin processing clock. Claims handlers
      move a claim into the Fastlane when the intake data show glass
      shattered, roof deformed and more than 150 dents, or when an
      estimate exceeds 70 percent of the replacement value. The
      customer receives a replacement vehicle until the settlement is
      paid (see PW-RENTAL-1). The Fastlane is pre-staged with the
      assistance partner before a forecast cell arrives (see
      SP-NATCAT-4) so that pick-up capacity is available on day one.

  - doc_id: CG-BAFIN-30
    doc_type: claims_guidelines
    title: Processing-time rule
    section: Claims handling manual, section 2.3
    effective_from: "2026-01-01"
    tags: [bafin, 30-days, escalation, day-20, kpi, supervision]
    text: >
      The supervisory authority BaFin treats the claims processing
      time as a supervisory key figure and expects a decision on every
      claim within 30 days after the first notice of loss. Volume is
      no excuse: a NatCat event with ten thousand claims is subject to
      the same clock as a single claim. Acme operationalises the rule
      as follows. Day 0 is the FNOL date. On day 20 every claim without
      a decision is escalated to the claims lead of the line, who must
      document the cause and the planned decision date; for event
      cohorts the escalation is raised once for the whole cohort with
      the number of open claims. On day 25 open claims are reported to
      the head of claims. Claims held for a fraud specialist are not
      exempt; the hold must be lifted or turned into a decision within
      the same 30 days. Complaints about processing time are answered
      within seven days and recorded with the complaint flag on the
      customer record. Cohort dashboards show the day-20 date of the
      oldest claims.

  - doc_id: CG-FR-5
    doc_type: claims_guidelines
    title: Fraud indicators guideline
    section: Claims handling manual, section 7.1
    effective_from: "2026-01-01"
    tags: [fraud, indicators, exif, duplicate-vin, rates, scanner, gdv,
           human-decision]
    text: >
      Hail events attract opportunistic fraud and leakage. Claims
      handlers and the fraud analytics service watch for the following
      indicators: photo EXIF timestamps before the event date of the
      cell; the same VIN reported through two channels within 48
      hours, typically app and voice agent with different dent counts;
      a workshop estimate more than 25 percent above the contracted
      hourly or paint rate; identical line-item texts across several
      claims of one workshop; a drive-in scanner count that deviates
      by more than 50 percent from the number of dents claimed by the
      customer. Every indicator is a reason to look, not a verdict.
      Acme follows the fraud handling principle of the German
      Insurance Association (GDV): a single indicator proves nothing,
      the overall picture decides, a human specialist decides; never
      delay the honest majority.
      Claims with indicators are set to ON_HOLD with the indicator
      codes on the claim and passed to the fraud specialist; all other
      claims of the event are released on the normal track. Payment
      items of held claims are removed from the next payment run
      before its cut-off. Findings are documented so that a customer
      or a workshop can be told what was checked.

  - doc_id: CG-CX-3
    doc_type: claims_guidelines
    title: Repeat contact and complaint handling
    section: Claims handling manual, section 3.4
    effective_from: "2026-01-01"
    tags: [repeat-contact, complaint, voice-agent, customer-experience]
    text: >
      A repeat contact is a second intake document for a claim that
      already exists, for example a customer who reported through the
      app and then calls the voice agent two days later to ask for a
      slot. Repeat contacts are marked is_repeat_contact on the intake
      record and are not new claims. A rising share of repeat contacts
      in an event cohort is the earliest signal that customers are
      waiting too long; it appears days before formal complaints.
      Customers who called twice must receive a proactive status
      update within one working day. A formal complaint is recorded
      with the complaint flag on the customer and on the intake
      record, answered within seven days, and reported in the monthly
      complaint statistics to the supervisory authority. During NatCat
      events the claims lead reviews the repeat-contact and complaint
      numbers of every stalled cohort daily. A customer with a
      complaint flag must not be moved further down a queue by an
      automated reassignment; the handler decides the new slot
      personally.

  - doc_id: CG-SEV-1
    doc_type: claims_guidelines
    title: Severity classification
    section: Claims handling manual, section 3.1
    effective_from: "2026-01-01"
    tags: [severity, minor, moderate, severe, estimate]
    text: >
      Every hail claim receives a severity band at intake, derived
      from the damage signals and the estimate. MINOR: glass damage or
      dents only, drivable, estimate below EUR 1,000; these claims
      enter the Fast Lane. MODERATE: dents on several panels or a
      combination of glass and body damage, estimate between EUR 1,000
      and EUR 6,000, vehicle usually drivable; these claims go to a
      drive-in scan followed by a partner repair. SEVERE: extensive
      damage, estimate above EUR 6,000, roof or pillar deformation, or
      not drivable; these claims go to a body shop estimate or, when
      the total-loss signature is present, directly to the Total Loss
      Fastlane. The severity band steers the reserve, the partner type
      and the customer communication. It is corrected when the scan or
      the estimate shows a different picture; corrections are logged.
      In a typical 3 cm hail cell about 60 percent of claims are
      MINOR, 35 percent MODERATE and 5 percent SEVERE.

  - doc_id: CG-STAT-2
    doc_type: claims_guidelines
    title: Claim status model and stall threshold
    section: Claims handling manual, section 3.2
    effective_from: "2026-01-01"
    tags: [status, workflow, stalled, awaiting-slot, threshold, cohort]
    text: >
      Motor hail claims move through the following statuses: RECEIVED
      (intake complete, not yet validated), CONFIRMED (cover
      confirmed, customer informed), AWAITING_WORKSHOP_SLOT (assigned
      to a partner, waiting for a scan or repair slot), IN_REPAIR
      (vehicle at the partner), TOTAL_LOSS_FASTLANE (clause TL-1
      track) and ON_HOLD (specialist review, fraud indicators or
      missing documents). The status_since timestamp records the last
      change. A claim is stalled when it has been in
      AWAITING_WORKSHOP_SLOT for more than 4 hours without a confirmed
      slot; the triage service groups stalled claims by partner and
      district into a cohort and raises a triage event when a cohort
      exceeds 100 claims. A stalled cohort is analysed for its root
      cause: partner capacity, wrong track (total losses in a drive-in
      queue), or an inactive fallback partner. ON_HOLD is not a
      parking status; every hold needs a reason code and an owner.
      Status counts per event are the daily steering figures of the
      NatCat desk.

  - doc_id: CG-RES-1
    doc_type: claims_guidelines
    title: Reserve setting for hail claims
    section: Claims handling manual, section 5.1
    effective_from: "2026-01-01"
    tags: [reserve, estimate, severity, event-reserve]
    text: >
      A case reserve is set at intake for every claim from the
      severity band and is refined when the estimate arrives. Initial
      reserves: MINOR EUR 600, MODERATE EUR 2,800, SEVERE EUR 9,500;
      total losses are reserved at the replacement value less the
      expected residual value. The reserve is replaced by the workshop
      estimate or the scanner estimate as soon as one exists, and by
      the invoice amount when the repair is complete. Reserves are
      reviewed weekly for event cohorts and the event total is
      reported to the NatCat desk. Reserves must not be lowered
      because a claim is on hold; a hold changes the timing, not the
      expected cost. For estimates that deviate by more than 25
      percent from contracted rates the reserve stays at the
      contracted-rate level until the estimate review is complete. The
      event reserve of a 3 cm cell with ten thousand motor claims is
      typically in the range of EUR 25 to 30 million.

  - doc_id: CG-DP-1
    doc_type: claims_guidelines
    title: Data protection note for claim photos
    section: Claims handling manual, section 9.2
    effective_from: "2026-01-01"
    tags: [data-protection, photos, exif, gps, retention]
    text: >
      Photos submitted with a claim contain personal data: the vehicle
      registration, sometimes persons, and metadata such as the
      capture time and GPS position. Acme processes the metadata for
      the purpose of validating the claim, in particular to compare
      the capture time with the event date and the capture position
      with the warning polygon. Customers are informed about this use
      in the intake channels. Metadata is not used for any other
      purpose and is not shared with partners; workshops receive the
      images without EXIF data. Photos are retained for the life of
      the claim plus the statutory retention period and are then
      deleted. Persons visible in the background are not identified.
      Where a photo shows a mismatch, for example a capture time
      before the event, the customer is asked for an explanation
      before a conclusion is drawn; the mismatch is recorded as an
      indicator, not as a finding. Access to photo metadata is limited
      to claims handlers, the fraud specialist and the intake
      validation service.

  - doc_id: CG-ESC-2
    doc_type: claims_guidelines
    title: Complaint escalation path
    section: Claims handling manual, section 3.5
    effective_from: "2026-01-01"
    tags: [complaint, escalation, ombudsman, bafin, register]
    text: >
      Complaints are handled in three stages. Stage one: the claims
      handler answers within seven days and offers a concrete next
      step, usually a slot or a decision date. Stage two: complaints
      not resolved after fourteen days, and every complaint that
      mentions the supervisory authority, the ombudsman or a lawyer,
      go to the complaint management team, which answers in writing
      and records the case in the complaint register. Stage three:
      cases with a systematic cause, for example a stalled cohort at
      one partner, are escalated to the head of claims together with
      the cohort figures and the planned remedy. The complaint
      register is the source for the annual complaint report to BaFin;
      motor complaints about processing time are reported separately.
      Customers are told at every stage whom they are talking to and
      what happens next. A complaint never worsens the position of the
      customer in a queue. Complaint figures of NatCat cohorts are
      reviewed daily during the event.

  - doc_id: CG-PAY-1
    doc_type: claims_guidelines
    title: Payment run rules
    section: Claims handling manual, section 6.1
    effective_from: "2026-01-01"
    tags: [payment-run, cut-off, hold, friday, controller]
    text: >
      Claim payments are bundled into weekly payment runs identified
      as PR-YYYY-WW, executed on Fridays at 16:00. Items are scheduled
      when a claim is approved for payment: customer payments for
      settlements and deductible refunds, workshop payments for
      invoices under direct settlement. Each item carries the claim,
      the payee type, the payee partner where applicable, a hashed
      IBAN reference and the amount. Items may be removed from a run
      until its cut-off; removal is a hold, not a cancellation, and
      the item is rescheduled when the claim is released. Holds must
      be placed before the cut-off of the run; after 16:00 on Friday
      the run is final and a wrong payment can only be recovered.
      Fraud holds on a payment run are placed by the fraud specialist
      or the claims lead with the indicator codes of the claim. The
      run total and the number of items are confirmed by the claims
      controller before execution. During NatCat events the run size
      rises to several thousand items; the controller then reviews
      the held items separately.

  - doc_id: CG-HOLD-1
    doc_type: claims_guidelines
    title: Placing a claim on hold
    section: Claims handling manual, section 7.2
    effective_from: "2026-01-01"
    tags: [on-hold, reason-code, specialist, honest-majority]
    text: >
      A claim is set to ON_HOLD only for a documented reason: fraud
      indicators awaiting a specialist, missing documents requested
      from the customer, an estimate under review, or a legal dispute.
      The hold record names the reason code, the owner and the planned
      review date, at most ten working days ahead. The customer is
      informed that the claim is under review, without naming fraud
      indicators. Holds never apply to a whole cohort or to a
      partner's entire book: they are placed per claim, and the honest
      majority of an event cohort continues on the normal track. A
      hold suspends payment items in the next payment run but does not
      change the reserve. Holds are reviewed daily during NatCat
      events; a hold older than ten working days is escalated to the
      claims lead. The BaFin 30-day clock keeps running during a hold.
      When the review clears the claim, the status returns to the
      previous track and the customer receives the next step within
      one working day.

  - doc_id: CG-AI-1
    doc_type: claims_guidelines
    title: AI-assisted decisions and human oversight
    section: Claims handling manual, section 1.4
    effective_from: "2026-06-01"
    tags: [ai, human-oversight, transparency, eu-ai-act, no-payout]
    text: >
      Acme uses AI agents to read intake data, confirm small claims,
      draft reports and propose actions. The rules: no agent may pay
      out; payments are released by a human or by the payment
      controller's approval. Customers are told when they interact
      with an automated system and can ask for a human handler at any
      time, in line with the transparency obligations of the EU AI
      Act, Article 50, which apply from 2 August 2026 and which Acme
      applies ahead of that date. Decisions with
      legal effect for a customer, such as a refusal, a reduction for
      breach of duty or a fraud finding, are made by a human who has
      seen the evidence; the agent's analysis is an input, not the
      decision. Every automated confirmation records the data and
      rules used, so that the decision can be explained afterwards.
      Recommendations for cohorts (reassignments, partner activations,
      warning messages to customers) are executed only after a named
      person approves them; the approval is published as a decision
      event with the approver's identity. Model changes are tested
      against the claims evaluation set before release.

  - doc_id: CG-SC-1
    doc_type: claims_guidelines
    title: Drive-in scanner results handling
    section: Claims handling manual, section 4.3
    effective_from: "2026-01-01"
    tags: [scanner, drive-in, dent-count, mismatch, calibration]
    text: >
      Drive-in hail centers scan the vehicle with an optical dent
      scanner that counts dents per panel and produces an estimate
      from the partner rate card. The scanner result is the reference
      for the repair scope; the customer's dent estimate at intake is
      an indication only. The scanner record stores the partner, the
      scan time, the dent count, the panels and the estimate. A
      mismatch flag is set when the scanned count deviates by more
      than 50 percent from the count claimed at intake. A mismatch is
      not a refusal: many customers overestimate small dents, and
      scanners miss dents on dark or dirty panels. The claim is
      settled on the scanned scope; when the customer disagrees, a
      second scan at another partner is offered. A mismatch combined
      with other indicators (see CG-FR-5), such as photos taken before
      the event or an estimate far above contracted rates, routes the
      claim to the fraud specialist. Mismatch rates per partner are
      monitored; a rate above 10 percent triggers a calibration check
      of the scanner.

  - doc_id: CG-EST-1
    doc_type: claims_guidelines
    title: Workshop estimate review
    section: Claims handling manual, section 5.2
    effective_from: "2026-01-01"
    tags: [estimate, rates, review, line-items, deviation, leakage]
    text: >
      Workshop estimates are checked against the contracted rates of
      the partner (see PC-RATES-2026): hourly rate, paint rate, parts
      prices from the manufacturer price list, and the standard times
      for paintless dent repair. An estimate is released automatically
      when hours, rates and parts are within the contracted values. An
      estimate whose hourly or paint rate exceeds the contracted rate
      by more than 25 percent, or whose total exceeds the scanner
      estimate by more than 25 percent, is set to review and returned
      to the partner with the deviation marked. Identical line-item
      texts across several claims of one workshop are a leakage
      indicator: real hail damage differs from car to car, so
      identical texts suggest a template rather than an inspection.
      Review findings are shared with the partner manager; repeated
      deviations of one workshop lead to a rate audit under the
      partner contract. Estimates in review do not stop the customer's
      repair when the customer bears no extra cost; they stop the
      workshop payment until the review is closed.

  - doc_id: CG-NATCAT-1
    doc_type: claims_guidelines
    title: NatCat event coding
    section: Claims handling manual, section 8.1
    effective_from: "2026-01-01"
    tags: [natcat, event-id, cohort, weather-cell, conversion]
    text: >
      Every weather-related loss is assigned to a NatCat event id when
      the loss location and date fall into the track and time window
      of a recorded weather cell. Hail cells are coded HZ-NNNN by the
      NatCat desk in the order of occurrence; the cell record stores
      the observed or forecast start and end time, the hail size, the
      warning level, the district, the affected postal codes and the
      exposure figures computed from the policy portfolio (motor
      policies, vehicles without garage, property policies). Claims
      outside the polygon or reported for a date outside the window
      are assigned manually after a check. The event id ties together
      claims, intake documents, scanner results, payment items and
      cohort reports, so that all figures of an event can be
      reproduced. Conversion, the number of motor claims divided by
      the number of exposed vehicles without garage, is computed per
      event and fed back into the playbook planning assumptions. Event
      coding must be complete before the first cohort report.

