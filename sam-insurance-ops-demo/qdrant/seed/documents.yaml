    text: >
      Partner P-DELLENDOC, Dellen-Doktor Sindelfingen, is the fallback
      drive-in partner for Landkreis Boeblingen with a contracted
      capacity of 90 scans per day, tier STANDARD. Contract status:
      INACTIVE since 2026-01-01. The renewal for 2026 is blocked
      because the parts-channel clause PC-4 (mandatory sourcing of
      glazing and trim parts through the Acme parts channel) remains
      unsigned; the partner disputes the rebate split. Contract note
      in the partner record: tier renegotiation, parts-channel clause
      PC-4 unsigned. While inactive, the partner receives no
      assignments and does not appear in slot proposals. The interim
      contract template IC-2 allows a 48 hour activation under the old
      terms for NatCat events: the NatCat desk issues the IC-2
      activation, the partner confirms within 24 hours, the scanner
      lane is operational within 48 hours, and the old 2024 rate card
      applies for the duration of the event, at most 60 days. IC-2
      activations do not prejudice the pending renewal negotiation.
      The partner's scanner was last calibrated in December 2025.

  - doc_id: PC-IC-2
    doc_type: partner_contracts
    title: Interim contract template IC-2
    section: Partner contracts, templates
    effective_from: "2025-06-01"
    tags: [interim-contract, ic-2, natcat, activation, 48-hours,
           old-terms]
    text: >
      The interim contract template IC-2 is used to activate a partner
      whose regular contract is inactive, expired or under
      renegotiation when a NatCat event requires additional capacity.
      Trigger: a weather cell with warning level 3 or an event cohort
      of more than 1,000 claims in the partner's district. Terms: the
      partner works under the terms and rates of its last active
      contract; the activation is valid for the duration of the event
      and at most 60 days; either side may end it with five days
      notice once the event cohort is cleared. Activation: the NatCat
      desk sends the IC-2 activation notice, the partner confirms in
      writing within 24 hours, and operations start within 48 hours of
      the notice. Capacity under IC-2 is the capacity of the last
      active contract, for example 90 scans per day for P-DELLENDOC.
      Open commercial disputes of the regular renewal, such as an
      unsigned clause, are explicitly parked and are not conditions of
      the interim activation. The claims lead approves the activation;
      the partner manager documents it in the partner record.

  - doc_id: PC-ROADASSIST-2025
    doc_type: partner_contracts
    title: Assistance contract P-ROADASSIST
    section: Partner contract, assistance
    effective_from: "2025-01-15"
    tags: [assistance, pick-up, remote-valuation, total-loss, capacity,
           standby]
    text: >
      Partner P-ROADASSIST is Acme's assistance partner for the
      Stuttgart region, contract status ACTIVE. Services: pick-up and
      transport of vehicles that are not drivable or that are in the
      Total Loss Fastlane, remote valuation by video and photo
      inspection for total losses, secure storage of vehicles until
      the residual value sale, and delivery of replacement vehicles in
      cooperation with the rental partner. Contracted capacity: 200
      vehicles per day for pick-up and remote valuation combined,
      expandable to 300 per day with 48 hours notice by bringing in
      subcontracted transporters. Service levels: first customer
      contact within one working day of assignment, pick-up within two
      working days, remote valuation report within one working day
      after pick-up or inspection. Pre-staging: for a forecast cell
      with warning level 3 the NatCat desk may reserve the partner's
      capacity 24 hours ahead at a standby fee; the reservation is
      converted into assignments as claims arrive. Rates are per
      vehicle and distance band. The partner reports daily pick-up and
      valuation figures to Acme during events.

  - doc_id: PC-RENTAFLEET-2026
    doc_type: partner_contracts
    title: Rental contract P-RENTAFLEET
    section: Partner contract, rental
    effective_from: "2026-01-01"
    tags: [rental, pre-booking, 24-hours, capacity, ludwigsburg]
    text: >
      Partner P-RENTAFLEET, contract status ACTIVE, provides
      replacement vehicles to Acme customers under clause PW-RENTAL-1.
      Standard availability is a pool of about 35 cars in Ludwigsburg
      and comparable pools in Boeblingen and Stuttgart, allocated on
      demand. Pre-booking clause: with 24 hours notice Acme may
      pre-book up to 150 cars for a named event and district; the
      partner relocates cars from its regional network and guarantees
      availability from the start of the booking window. Pre-booked
      cars that are not taken up within 72 hours are released without
      charge; cars taken up are invoiced at the contracted daily rate
      for the actual rental period. The partner delivers cars to
      drive-in centers, partner workshops or the customer's home.
      Priority during events: customers without a drivable vehicle
      first, then Total Loss Fastlane customers, then repair
      customers. The partner reports the number of cars available per
      district daily during events. Rental periods beyond 14 days
      require approval by the claims handler.

  - doc_id: PC-RATES-2026
    doc_type: partner_contracts
    title: Partner network rate card 2026
    section: Partner contracts, rates
    effective_from: "2026-01-01"
    tags: [rates, hourly, paint, deviation, 25-percent, review]
    text: >
      The rate card for the Acme partner network in 2026 sets the
      contracted hourly rate for body and paintless dent repair labour
      at EUR 118.00 and the contracted paint rate at EUR 96.00 per
      hour. Parts are invoiced at the manufacturer price list less the
      contracted rebate. Standard times for paintless dent repair
      follow the network's time schedule per panel and dent class.
      Deviation review threshold: an estimate or invoice whose hourly
      or paint rate exceeds the contracted rate by more than 25
      percent is set to review and not paid until the review is
      closed; deviations below the threshold are paid and reported in
      the monthly partner statistics. Repeated deviations of one
      workshop trigger a rate audit under the partner contract.
      Drive-in scans are invoiced at a flat fee per scan; the fee is
      included in the repair invoice when the partner repairs the
      vehicle. The rate card applies to all body shops and drive-in
      centers of the network; assistance and rental partners have
      their own price schedules.

  - doc_id: PC-KAROSSERIE-2025
    doc_type: partner_contracts
    title: Body shop contract P-KAROSSERIE-SCHNELL (workshop W-0471)
    section: Partner contract, body shop, Boeblingen
    effective_from: "2025-04-01"
    tags: [body-shop, karosserie-schnell, w-0471, estimates,
           transparency, boeblingen]
    text: >
      Partner P-KAROSSERIE-SCHNELL, workshop code W-0471, Boeblingen,
      is a contracted body shop of the Acme network, contract status
      ACTIVE, tier STANDARD. The partner repairs MODERATE and SEVERE
      hail claims assigned by Acme after a drive-in scan or a body
      shop estimate. Contracted rates follow PC-RATES-2026: hourly
      rate EUR 118.00, paint rate EUR 96.00. Estimate transparency
      clause: every estimate lists the panels, the dent count per
      panel, the repair method, the hours and the rates per line item,
      so that Acme can compare the estimate with the scanner result.
      Estimates must be individual to the vehicle; template texts are
      not accepted. Acme may audit the partner's estimates and
      invoices of the last twelve months on two weeks notice. Direct
      settlement: Acme pays approved invoices through the weekly
      payment run with the partner as payee. The partner offers slots
      within five working days for assigned vehicles. Contract term
      until 2027-03-31.

  - doc_id: PC-AUTOWERK-2025
    doc_type: partner_contracts
    title: Body shop contract P-AUTOWERK-BB
    section: Partner contract, body shop, Boeblingen
    effective_from: "2025-04-01"
    tags: [body-shop, autowerk, boeblingen, capacity, overflow]
    text: >
      Partner P-AUTOWERK-BB, Boeblingen, is a contracted body shop of
      the Acme network, contract status ACTIVE, tier PREMIUM. The
      partner has eight repair bays and a paint booth and accepts
      MODERATE and SEVERE hail claims from the Boeblingen district,
      including vehicles that need panel replacement after paintless
      dent repair is ruled out. Contracted rates follow PC-RATES-2026.
      The partner offers slots within five working days for assigned
      vehicles and informs Acme within 24 hours when its order book
      exceeds ten working days. The partner accepts overflow vehicles
      reassigned from drive-in partners under their overflow clauses.
      Estimates follow the transparency requirements of the network
      and are compared with the scanner result. Direct settlement
      through the weekly payment run applies. The partner provides a
      replacement vehicle from the Acme rental partner's pool when the
      repair takes longer than two days. Contract term until
      2027-03-31 with automatic renewal.

