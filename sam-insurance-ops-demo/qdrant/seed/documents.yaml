  - doc_id: PC-SLA-1
    doc_type: partner_contracts
    title: Partner network service levels
    section: Partner contracts, network standard
    effective_from: "2025-03-01"
    tags: [sla, slot, 24-hours, five-working-days, reporting, overflow]
    text: >
      The network standard defines the service levels that every
      drive-in and body shop contract of the Acme network includes.
      Slot proposals: the partner confirms or rejects a slot proposal
      within 24 hours of the assignment; a confirmed proposal names a
      date and a time window. Slot offer: for assigned vehicles the
      partner offers a slot within five working days; this mirrors
      the customer's right under clause RN-3, where the absence of a
      partner slot within 5 working days after FNOL restores the free
      choice of workshop. Status reporting: partners update the claim
      status when the vehicle arrives (IN_REPAIR) and when the repair
      is complete, within four hours of the event. Event reporting:
      during NatCat events partners report daily capacity, scans
      performed, vehicles waiting and the oldest waiting assignment.
      Overflow: when waiting vehicles exceed three days of capacity
      the partner notifies Acme within four hours. Calibration of
      scanners quarterly. Breaches of the service levels are recorded
      in the partner scorecard and affect the tier.

  - doc_id: PC-PC-4
    doc_type: partner_contracts
    title: Parts-channel clause PC-4
    section: Partner contracts, standard clauses
    effective_from: "2026-01-01"
    tags: [parts-channel, pc-4, rebate, renewal, glazing, dellendoc]
    text: >
      Clause PC-4 is the parts-channel clause of the 2026 partner
      contract generation. It obliges drive-in and body shop partners
      to source glazing, trim and lamp parts for Acme claims through
      the Acme parts channel, a framework agreement with two
      distributors, and it shares the channel rebate between Acme and
      the partner. The clause is mandatory for the 2026 renewal of all
      drive-in contracts; a partner that does not sign PC-4 cannot be
      renewed on the 2026 terms and its contract status becomes
      INACTIVE at the end of the previous term. PC-4 is the open point
      in the P-DELLENDOC renewal. PC-4 has no bearing on the interim
      contract template IC-2: an IC-2 activation runs under the last
      active contract, which for pre-2026 contracts contains no
      parts-channel obligation. The partner manager reports open PC-4
      negotiations monthly. Parts sourced outside the channel during
      an IC-2 activation are reimbursed at the manufacturer price list
      less the standard rebate.

  - doc_id: PC-MOBILE-1
    doc_type: partner_contracts
    title: Mobile scanner unit framework (Stuttgart hub)
    section: Partner contracts, mobile units
    effective_from: "2025-05-01"
    tags: [mobile-scanner, stuttgart-hub, capacity, lead-time, natcat]
    text: >
      Acme maintains a framework agreement with a scanner service
      provider for three mobile scanner units stationed at the
      Stuttgart hub. Each unit consists of a truck-mounted optical
      dent scanner, two operators and a marshalling team, and delivers
      90 scans per day. Lead time from call-off to operation is 24
      hours; units are deployed to a partner site that provides power
      and a marshalling area, typically a drive-in partner or a large
      body shop. Call-off is by the NatCat desk with approval of the
      claims lead; the daily rate per unit covers equipment and staff,
      plus a mobilisation fee per deployment. Units can be deployed
      for a minimum of three days and a maximum of thirty days per
      event. Scan results are delivered in the same format as the
      partner scanners and enter the scanner result store with the
      host partner's id. The three units together add 270 scans per
      day. The provider guarantees availability of at least two units
      at any time.

