      four hours and Acme may reassign waiting vehicles to another
      partner without penalty to either side. The partner confirms
      slot proposals within 24 hours. Rates follow the Acme rate card
      PC-RATES-2026. Scanner calibration is checked quarterly. The
      contract runs until 2027-02-28 with automatic renewal.

  - doc_id: PC-DELLENDOC-2024
    doc_type: partner_contracts
    title: Drive-in contract P-DELLENDOC (Dellen-Doktor Sindelfingen)
    section: Partner contract, drive-in, Sindelfingen
    effective_from: "2024-02-01"
    tags: [drive-in, dellendoc, inactive, pc-4, ic-2, renewal,
