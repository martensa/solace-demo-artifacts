  - doc_id: SP-NATCAT-4
    doc_type: storm_playbooks
    title: NatCat hail playbook v4
    section: Storm playbooks, hail, version 4
    effective_from: "2026-04-01"
    tags: [natcat, playbook, conversion, planning, mobile-scanner, sms,
           fastlane, capacity, rental]
    text: >
      Planning assumptions. For a forecast hail cell with warning
      level 3 the NatCat desk plans with a conversion of 30 percent of
      the vehicles parked without garage in the warning polygon
      reporting a motor claim within 48 hours, and 18 percent of
      exposed buildings reporting a property claim. The assumptions
      come from the 2025 and 2026 small cells; they must be replaced
      by the observed conversion of the current event when a cell of
      the same season has already produced claims. Options. (a) Mobile
      scanner units: 3 units at the Stuttgart hub, 90 scans per day
      each, 24 hours lead time, deployed to a partner site in the
      district. (b) Rental pre-booking with P-RENTAFLEET, 24 hours
      notice, up to 150 cars. (c) Proactive warning SMS to customers
      with vehicles without garage in the polygon; the batch is
      prepared by the system and released by a human, never sent
      automatically. (d) Pre-stage the Total Loss Fastlane with
      P-ROADASSIST at standby. Capacity math example: 8,900 vehicles
      without garage times 0.30 gives about 2,700 motor claims; at 180
      scans per day the drive-in network needs about 15 scan-days to
      clear them; three mobile units raise the district to 450 scans
      per day and cut the clearing time to about six days. Rental
      demand is estimated at one car per 45 motor claims.

  - doc_id: SP-HZ-0907
    doc_type: storm_playbooks
    title: Lessons learned HZ-0907 (Ludwigsburg, 2026-07-04)
    section: Storm playbooks, event reviews
    effective_from: "2026-07-10"
    tags: [lessons-learned, hz-0907, conversion, ludwigsburg,
           small-cell, 2-cm]
    text: >
      Hail cell HZ-0907 crossed the northern part of Landkreis
      Ludwigsburg on 2026-07-04 between 17:10 and 17:50 with
      hailstones of 2.0 cm, warning level 2. Exposure in the track:
      4,400 motor policies with vehicles parked without garage. Claims
      within 48 hours: 1,240 motor claims, giving an observed
      conversion of 0.28. The drive-in partners P-HAGELPOINT-LB and
      P-DELLENFIX-LB cleared the scan queue in seven days at 180 scans
      per day without additional units; rental demand stayed within
      the standing pool of 35 cars. Lessons: the playbook assumption
      of 0.30 held for a 2 cm cell; 62 percent of the claims were
      MINOR and went through the Fast Lane; repeat contacts stayed
      below 3 percent. Warning: the conversion of a 2 cm cell must not
      be used for larger stones. Cells with 3 cm hail and more convert
      far higher, because 3 cm stones dent roofs and bonnets on every
      exposed vehicle instead of only the thinner panels; the
      Reutlingen cell of 2023 converted at 0.58. Recommendation: at
      hail sizes of 3 cm or more, plan with the observed conversion of
      the most recent large cell, not with the 0.30 assumption.

  - doc_id: SP-REUTLINGEN-2023
    doc_type: storm_playbooks
    title: Lessons learned Reutlingen cell 2023
    section: Storm playbooks, event reviews
    effective_from: "2023-09-15"
    tags: [lessons-learned, reutlingen, 2023, conversion,
           rental-shortage, large-cell, 3.5-cm]
    text: >
      On 2023-08-11 a hail cell with stones of 3.5 cm crossed the
      Reutlingen area between 15:30 and 16:20, warning level 3.
      Exposure: 12,100 motor policies with vehicles without garage.
      Claims within 48 hours: 7,000 motor claims, an observed
      conversion of 0.58, plus 310 property claims. What went wrong:
      the drive-in capacity in the district was 150 scans per day, the
      scan queue peaked at 3,900 waiting vehicles and took 26 days to
      clear; rental cars ran out on day two because the standing pool
      of 40 cars was not increased before the event; 480 total losses
      were queued for drive-in scans for up to nine days before they
      were recognised as total losses; complaint volume was five times
      the normal level and the supervisory authority asked for a
      report on processing times. What worked: the Fast Lane confirmed
      4,100 small claims within minutes; the mobile scanner units,
      called off on day three, added 270 scans per day. Lessons: call
      off mobile units before the cell, not after; pre-book rental
      cars; route total-loss signatures to the Fastlane at intake;
      plan large cells with a conversion near 0.6.

  - doc_id: SP-WARN-1
    doc_type: storm_playbooks
    title: Customer warning SMS procedure
    section: Storm playbooks, customer communication
    effective_from: "2026-04-01"
    tags: [sms, warning, human-release, no-garage, polygon, decision]
    text: >
      When a forecast cell reaches warning level 3, the NatCat desk
      prepares a warning SMS batch for customers whose vehicles are
      parked without garage in the warning polygon (garage_parking =
      false, postal code in the cell's list). The message template:
      "Acme Insurance: hail warning level 3 for your area on <date>
      between <start> and <end>. If you can, park your vehicle under
      cover or away from trees. Your hail cover is active; report
      damage in the app. Reply STOP to opt out." The batch is prepared
      by the system with the recipient count and the polygon, and it
      is released by a human: the claims lead or the NatCat duty
      officer reviews the count, the wording and the time window and
      releases the batch at least six hours before the forecast
      window. Batches are never sent automatically. Customers who
      opted out of service messages are excluded. The release is
      recorded as a decision event with the approver's identity. A
      warning SMS does not create a claim and does not change the
      policy. Response rates and claim rates of warned and unwarned
      customers are compared in the post-event review.

  - doc_id: SP-CAP-1
    doc_type: storm_playbooks
    title: Capacity math worksheet
    section: Storm playbooks, planning tools
    effective_from: "2026-04-01"
    tags: [capacity, scan-days, rental, formula, gap, mobile-units]
    text: >
      The capacity worksheet turns an exposure figure into a capacity
      gap in three steps. Step one, expected volume: exposed vehicles
      without garage times conversion gives expected motor claims
      within 48 hours; exposed buildings times 0.18 gives expected
      property claims. Use the playbook conversion of 0.30 for cells
      below 3 cm and the observed conversion of the most recent large
      cell for cells of 3 cm or more. Step two, scan demand: about 90
      percent of motor claims need a drive-in scan (MINOR and
      MODERATE); total losses and SEVERE body shop cases do not.
      Scan-days needed equals scan demand divided by the district's
      contracted daily scan capacity. Step three, gap: divide the scan
      demand by the target clearing time in days, subtract the
      contracted capacity, and divide the missing scans per day by 90
      to get the number of mobile units. Rental demand: one car per
      45 motor claims; compare with the partner's standing pool.
      Example for Ludwigsburg: 180 scans per day contracted; at 2,700
      claims about 15 scan-days; at 5,400 claims about 30 scan-days;
      the standing rental pool of 35 cars covers about 1,600 claims.

  - doc_id: SP-COMMS-1
    doc_type: storm_playbooks
    title: Storm communications and status page
    section: Storm playbooks, communication
    effective_from: "2026-04-01"
    tags: [communication, status-page, agencies, workshops, media]
    text: >
      During a NatCat event Acme runs a single communication rhythm so
      that customers, agencies and partners hear the same figures. The
      NatCat desk publishes an event status at 08:00 and 16:00 with
      the number of claims by status, the oldest waiting assignment
      per partner and the expected slot horizon per district. Agencies
      receive the status with a customer-facing summary they may
      forward. The app shows the customer's own claim status and the
      next step; a stalled claim shows the reason (waiting for partner
      slot) and the expected date. Voice agents read from the same
      status so that repeat callers get consistent answers. Partners
      receive their assignment lists and the reassignment decisions of
      the day. Media requests go to corporate communications with the
      figures of the last status. Individual customer promises about
      dates are made only by claims handlers. The status page is
      archived per event for the post-event review and for
      supervisory requests about processing times.

  - doc_id: SP-TRIAGE-1
    doc_type: storm_playbooks
    title: First-contact triage script for intake channels
    section: Storm playbooks, intake
    effective_from: "2026-04-01"
    tags: [triage, first-contact, voice-agent, app, signature, routing]
    text: >
      First-contact triage captures the facts that decide the track
      within the first contact. Questions in order: is anyone hurt; is
      the vehicle drivable; is glass shattered; is the roof deformed;
      roughly how many dents (fewer than 20, 20 to 150, more than
      150); where is the vehicle parked now; do you have photos. The
      answers populate the damage signals of the intake record.
      Routing: glass or dents only with an estimate below EUR 1,000
      goes to the Fast Lane; glass shattered plus roof deformed plus
      more than 150 dents is the total-loss signature and goes to the
      Total Loss Fastlane with an assistance pick-up; everything else
      goes to a drive-in scan. The customer receives the track and the
      next step in the same contact, in plain language, at most three
      sentences. Voice agents flag repeat callers and complaints for
      the claims lead. Agencies and the workshop portal use the same
      questions. A wrong track at first contact is the most expensive
      triage error, because it puts vehicles into the wrong queue for
      days.

  - doc_id: SP-POST-1
    doc_type: storm_playbooks
    title: Post-event review checklist
    section: Storm playbooks, review
    effective_from: "2026-04-01"
    tags: [review, lessons-learned, conversion, kpi, checklist]
    text: >
      Every NatCat event with more than 1,000 claims gets a post-event
      review within 30 days after the cohort is cleared. The review
      documents: the observed conversion (motor claims divided by
      exposed vehicles without garage) and the property rate; the
      share of MINOR, MODERATE and SEVERE claims and the share of
      total losses; the time to first contact, the time to first
      payment (median) and the share of claims decided within 30 days;
      the largest stalled cohort, its root cause and the time to clear
      it; partner capacity used, second shifts and mobile units called
      off with their lead times; rental cars pre-booked and used;
      repeat contacts and complaints; fraud indicators found, claims
      held and released, and the amount recovered. The review ends
      with the numbers that update the playbook: the conversion to
      plan with for the hail size class, the rental demand per claim,
      and the pre-staging steps to trigger before the next cell.
      Reviews are filed as lessons-learned documents in the storm
      playbook knowledge base.

  - doc_id: SP-STAGE-1
    doc_type: storm_playbooks
    title: Readiness stages by lead time
    section: Storm playbooks, readiness
    effective_from: "2026-04-01"
    tags: [readiness, stages, lead-time, warning-level, checklist,
           t-24h]
    text: >
      Readiness for a forecast cell follows three stages by lead time.
      Stage T-48 h (warning level 2 or higher forecast): compute the
      exposure of the forecast polygon (motor policies, vehicles
      without garage, property policies) and the expected volume at
      the current conversion; check partner capacity and the standing
      rental pool in the district; inform partners of the forecast.
      Stage T-24 h (warning level 3): decide the playbook options,
      call off mobile scanner units (24 hours lead), pre-book rental
      cars (24 hours notice), put the assistance partner on standby,
      activate inactive partners in the district under the interim
      contract template IC-2 (48 hours to operation), prepare the
      warning SMS batch for human release, and brief the claims lead
      on the expected cohort size. Stage T-6 h: release
      the warning SMS batch, confirm unit deployment sites with the
      host partners, open the event id in the claims system and switch
      the intake channels to the event triage script. After the cell:
      monitor conversion hourly for the first 48 hours and re-plan
      capacity when the observed conversion exceeds the planning
      assumption by more than 20 percent.

  - doc_id: SP-FASTLANE-STAGE
    doc_type: storm_playbooks
    title: Pre-staging the Total Loss Fastlane
    section: Storm playbooks, total loss
    effective_from: "2026-04-01"
    tags: [fastlane, pre-staging, roadassist, total-loss, standby,
           signature]
    text: >
      Total losses are the claims that suffer most from a wrong queue:
      a vehicle with shattered glass, a deformed roof and more than
      150 dents gains nothing from a drive-in scan, and every day in a
      scan queue is a day lost against the five working day settlement
      target. Before a forecast cell of 3 cm or more, the NatCat desk
      pre-stages the Total Loss Fastlane: it reserves standby capacity
      of the assistance partner P-ROADASSIST (200 vehicles per day for
      pick-up and remote valuation), briefs the salvage exchange, and
      activates the total-loss signature routing in the intake
      channels so that qualifying claims are set to
      TOTAL_LOSS_FASTLANE at first contact. For a large cell about 5
      to 8 percent of motor claims are total losses. After the cell
      the desk checks daily whether claims with the signature are
      waiting in drive-in queues and moves them to the Fastlane; in
      the Reutlingen cell of 2023, 480 such claims waited up to nine
      days. The claims lead approves the move as one cohort decision.
