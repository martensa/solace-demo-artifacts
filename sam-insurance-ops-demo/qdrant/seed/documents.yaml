  - doc_id: PC-DELLENFIX-2025
    doc_type: partner_contracts
    title: Drive-in contract P-DELLENFIX-LB
    section: Partner contract, drive-in, Ludwigsburg
    effective_from: "2025-03-01"
    tags: [drive-in, dellenfix, ludwigsburg, capacity]
    text: >
      Partner P-DELLENFIX-LB, Ludwigsburg, is the second drive-in
      partner for Landkreis Ludwigsburg, contract status ACTIVE, tier
      STANDARD. Contracted capacity is 80 scans per day in a single
      shift. The partner has one scanner lane and four paintless dent
      repair technicians and specialises in small and medium dent
      counts; vehicles with more than 150 dents or with roof
      deformation are referred to a body shop or, where clause TL-1
