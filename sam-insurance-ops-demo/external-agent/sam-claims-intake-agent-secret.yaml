# Claims Intake Analyst -- agent-specific values. Committed WITH
# demo values on purpose (repo convention: sam_ro/sam_ro is the
# read-only demo user of the acme_claims store, never production).
# Common values (broker, LLM endpoint + key, S3, NAMESPACE) come
# from `sam-shared-secret` in this namespace; envFrom lists the
# shared secret first, this one second (agent-specific overrides).
apiVersion: v1
kind: Secret
metadata:
  namespace: sam-solace-lab-agents
  name: sam-claims-intake-agent-secret
  labels:
    app: sam-claims-intake-agent
    tier: external-agents
    demo: sam-insurance-ops
type: Opaque
stringData:
  # Its OWN model, picked outside the platform's model aliases --
  # part of the story: the mesh sees the hop, not the model.
  LLM_SERVICE_GENERAL_MODEL_NAME: "openai/claude-haiku-4-5-20251001"

  # acme-claims-mongo runs on the host (docker, port 27017).
  # MONGO_HOST is a connection URI, not a bare host name: the
  # sam_mongodb 0.1.0 plugin calls MongoClient(host, port,
  # username, password) WITHOUT an authSource, so a bare host
  # authenticates against `admin` and fails ("Authentication
  # failed") for sam_ro, which is defined in acme_claims (verified
  # 2026-09-10). pymongo accepts a URI as host, takes authSource
  # from it and still uses the username/password/port arguments.
  MONGO_HOST: "mongodb://host.docker.internal:27017/acme_claims?authSource=acme_claims"
  MONGO_PORT: "27017"
  MONGO_USER: "sam_ro"
  MONGO_PASSWORD: "sam_ro"
  MONGO_DB: "acme_claims"
