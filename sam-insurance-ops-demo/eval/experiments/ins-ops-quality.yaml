kind: experiment
name: ins-ops-quality
description: >-
  Production quality gate: does the Acme Insurance Query Expert
  answer the claims operations questions correctly on its
  production model? Judged by the seeded LLM Judge plus
  Factuality against the expected responses.
spec:
  datasetId: ins-ops-questions
  targetAgent: Acme Insurance Query Expert
  # Seeded evaluators (exact platform names; there is no "rouge"
  # in 2.225.14 -- the heuristic overlap evaluator is called
  # "Response Match"; the seeded list was not re-checked on
  # 2.348.22, where this experiment ran fine with these two).
  evaluatorIds:
    - LLM Judge
    - Factuality
  primaryEvaluatorId: LLM Judge
  runsPerExample: 1
  maxWorkers: 2
