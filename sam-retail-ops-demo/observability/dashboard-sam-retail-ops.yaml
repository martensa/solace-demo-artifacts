apiVersion: v1
data:
  sam-retail-ops.json: "{\n \"uid\": \"sam-retail-ops\",\n \"title\": \"SAM Retail Ops Demo\",\n \"tags\": [\n  \"sam\",\n  \"retail-ops\"\n ],\n \"schemaVersion\": 39,\n \"editable\": true,\n \"refresh\": \"10s\",\n \"time\": {\n  \"from\": \"now-1h\",\n  \"to\": \"now\"\n },\n \"timezone\": \"browser\",\n \"panels\": [\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"## SAM Retail Ops Demo - the guided flow\\n**1. Health** -> **2. Speed** -> **3. Cost & chargeback** -> **4. Governance (who does what?)** -> **5. The proof (traces & activities)** - all from ONE stack: Prometheus metrics, Loki audit logs, platform DB, Tempo traces.\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 2,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 1. Is the AI workforce healthy? *(sam_instance_up, broker link, tasks in flight - outage = alert)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Components up\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 4,\n    \"w\": 4,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum(sam_instance_up)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"up\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"yellow\",\n        \"value\": 2\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 3\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Broker connections\",\n   \"gridPos\": {\n    \"x\": 4,\n    \"y\": 4,\n    \"w\": 4,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum(sam_broker_connection_state)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"connected\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 3\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Tasks in Flight\",\n   \"gridPos\": {\n    \"x\": 8,\n    \"y\": 4,\n    \"w\": 4,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sam_gateway_tasks_in_flight\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"in flight\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Request rate (entrypoint)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 4,\n    \"w\": 12,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum(rate(sam_entrypoint_requests_total[2m]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"req/s\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 9,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 2. How fast does it respond? *(request duration p50/p95 + LLM latency per model)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Request duration p50/p95 (s)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 11,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.50, sum by (le) (rate(sam_entrypoint_duration_seconds_bucket[5m])))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"p50\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(sam_entrypoint_duration_seconds_bucket[5m])))\",\n     \"refId\": \"B\",\n     \"legendFormat\": \"p95\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"LLM latency p95 by model (s)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 11,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(sam_gen_ai_client_operation_duration_seconds_bucket[5m])))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{gen_ai_request_model}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 18,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 3. What does it cost - and WHO spends the tokens? *(Prometheus knows models, the platform DB knows users -> chargeback)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Token rate by model/type\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 20,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum by (gen_ai_request_model, gen_ai_token_type) (rate(sam_gen_ai_tokens_used_total[5m]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{gen_ai_request_model}} {{gen_ai_token_type}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"table\",\n   \"title\": \"Token chargeback by user (time range)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 20,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT user_id, count(*) AS tasks,\\n       sum(total_input_tokens) AS input_tokens,\\n       sum(total_output_tokens) AS output_tokens\\nFROM tasks\\nWHERE to_timestamp(start_time/1000) BETWEEN $__timeFrom() AND $__timeTo()\\nGROUP BY user_id ORDER BY input_tokens DESC NULLS LAST LIMIT 8\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 27,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 4. Governance: who uses what? *(audit stream from Loki: every tool execution with its user - RBAC denies and auth failures included)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Tool executions by user -> tool (audit)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 29,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (userID, tool) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `tool execution` | json userID=\\\"userID\\\", tool=\\\"tool\\\" | __error__=\\\"\\\" [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"{{userID}} -> {{tool}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Auth failures & RBAC denies\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 29,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (reason) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `authentication failed` | json reason=\\\"reason\\\" | __error__=\\\"\\\" [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"auth-fail: {{reason}}\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum(count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `denied` [$__auto]))\",\n     \"refId\": \"B\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"rbac denied\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 36,\n    \"w\": 24,\n    \"h\": 3\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 5. The proof *(drilldown: every A2A hop is a broker span in Tempo; every LLM/tool action is in SAM -> Activities)*\\n**Tempo**: Explore -> Tempo -> search sam-solace-lab/a2a | **Logs with traceID**: Loki line -> click the *traceID* field | **SAM Activities**: https://sam.solace.lab -> Activities -> task -> *Performance* (Gantt)\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  }\n ]\n}"
kind: ConfigMap
metadata:
  name: dashboard-sam-retail-ops
  namespace: sam-solace-lab
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: SAM

