# Event-triggered incident workflow (meetup demo): a failed shop
# order (published by sam-retail-ops-demo/shop on the sam VPN) is routed
# here by the shop-events event-mesh entrypoint. Fans out to OMS,
# PDM and POS specialists in parallel, then merges into an
# incident report. fail_fast stays false: if the Retail POS
# Analyst does not exist yet (it is created LIVE in the demo via
# the AI Builder), the report transparently notes the missing POS
# section instead of failing.
kind: workflow
name: order-incident-report
description: >-
  Order incident analysis: fans a failed shop order out to the
  OMS, PDM and POS specialists in parallel and merges their
  findings into one incident report for the OMS team.
spec:
  appConfig:
    # Bump to force a redeploy (deploy phase fires on change only).
    # NOTE: event-triggered runs deliver NO structured input keys
    # (awe logs inputKeys: []), so nodes must reference the raw
    # task text as {{workflow.input}} -- {{workflow.input.text}}
    # stays an unresolved literal here (verified 2026-07-31).
    version: "1.1.2"
    display_name: Order Incident Report
    description: >-
      Failed-order analysis across OMS, PDM and POS, merged into
      one incident report.
    workflow_timeout: "600s"
    default_node_timeout: "240s"
    fail_fast: false
    skills:
      - id: order_incident_report
        name: Order Incident Report
        description: >-
          Analyze a failed shop order across OMS, PDM and POS and
          produce an incident report.
    # Workflow-level INPUT contract: describes the realtime
    # shop event that (conceptually) triggers this SOP -- the
    # exact payload shape shop/index.html publishes on
    # acmeretail/shop/order/failed/>. Today the event PATH runs
    # via the Orchestrator (promptTemplate quirk), so this
    # schema is the published contract + the typed Run form in
    # the UI, not a gate on the event flow. Loose by design:
    # only the fields the SOP actually needs are required.
    input_schema:
      type: object
      required: [order_id, status, failure_reason, lines]
      properties:
        order_id:
          type: string
          description: Shop order id, e.g. WEB-20260812-0001.
        channel:
          type: string
        store_id:
          type: string
        ts:
          type: string
          description: Event timestamp (ISO 8601).
        customer_id:
          type: string
        status:
          type: string
          enum: [FAILED]
          description: This SOP handles failed orders only.
        failure_reason:
          type: string
          enum: [OUT_OF_STOCK, OUT_OF_SEASON, DATA_QUALITY]
        failure_detail:
          type: string
        total:
          type: number
        currency:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, sku]
            properties:
              product_id: { type: string }
              sku: { type: string }
              description: { type: string }
              qty: { type: number }
              unit_price: { type: number }
              extended_price: { type: number }
    # Workflow-level output contract: visible in the UI's
    # "I/O & Mapping" panel. Deliberately loose ({report:
    # string}) -- the report stays free-form markdown; the
    # STRICT contracts sit on the specialist NODES below
    # (UI shows those in the workflow's YAML view).
    output_schema:
      type: object
      required: [report]
      properties:
        report:
          type: string
          description: The incident report in markdown.
    output_mapping:
      report: "{{report.output}}"
    nodes:
      # Output contracts (JSON Schema) on the three specialist
      # nodes: the platform validates the agent's answer against
      # the schema and auto-retries on violation -- deterministic
      # hand-offs mid-workflow. The final report node stays
      # free-form markdown on purpose (it is read aloud).
      - id: oms
        type: agent
        agent_name: Retail OMS Query Expert
        output_schema:
          type: object
          required: [customer_known, product_sold_before, findings]
          properties:
            customer_known:
              type: boolean
              description: Has this customer ordered online before?
            product_sold_before:
              type: boolean
              description: Has this product sold online before?
            customer_order_count:
              type: integer
            findings:
              type: string
              description: 2-4 sentences with the key numbers.
        input:
          message: >-
            A shop order failed. Analyze the ORDER context in
            retail_oms: has this customer ordered before, has
            this product sold online before, and does anything
            about the order look unusual? Fill the structured
            output contract; findings = 2-4 sentences with
            numbers. Failed order event: {{workflow.input}}
      - id: pdm
        type: agent
        agent_name: Retail PDM Query Expert
        output_schema:
          type: object
          required: [stock_level, inventory_status,
                     failure_reason_consistent, findings]
          properties:
            stock_level:
              type: integer
            inventory_status:
              type: string
            seasonality:
              type: string
            margin:
              type: number
            failure_reason_consistent:
              type: boolean
              description: >-
                Does the master data support the stated failure
                reason?
            findings:
              type: string
              description: 2-4 sentences with the key numbers.
        input:
          message: >-
            A shop order failed. Analyze the PRODUCT master data
            (retail_pdm) for the ordered product: stock_level,
            inventory_status, seasonality, margin, price -- and
            whether the failure reason matches what the data
            shows. Fill the structured output contract; findings
            = 2-4 sentences with numbers. Failed order event:
            {{workflow.input}}
      - id: pos
        type: agent
        agent_name: Retail POS Analyst
        output_schema:
          type: object
          required: [receipts, voided, quantity_sold, findings]
          properties:
            receipts:
              type: integer
              description: POSLOG receipts containing the product.
            voided:
              type: integer
            quantity_sold:
              type: number
            contradicts_online_failure:
              type: boolean
              description: >-
                Does in-store reality contradict the stated
                failure reason?
            findings:
              type: string
              description: 2-4 sentences with the key numbers.
        input:
          message: >-
            A shop order failed online. Check the STORE (POS)
            channel for the ordered product: recent POSLOG
            transactions, voids, quantities sold -- does the
            in-store reality confirm or contradict the failure
            reason? Fill the structured output contract;
            findings = 2-4 sentences with numbers. Failed order
            event: {{workflow.input}}
      - id: report
        type: agent
        agent_name: Order Incident Reporter
        depends_on:
          - oms
          - pdm
          - pos
        input:
          message: |
            Create the incident report for this failed shop order:
            {{workflow.input}}

            ## OMS findings (schema-validated JSON)
            {{oms.output}}

            ## PDM findings (schema-validated JSON)
            {{pdm.output}}

            ## POS findings (schema-validated JSON)
            {{pos.output}}
