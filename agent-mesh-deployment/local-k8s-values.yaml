# Helm values for Solace Agent Mesh v2 (chart solace-agent-mesh 2.0.x)
# on the local solace-lab cluster (Rancher Desktop / k3s).
#
# v2 architecture: three Go components replace the v1 core pod --
#   gwe (Entrypoint Executor: WebUI + platform API, ingress backend),
#   awe (Agent-Workflow Executor), str (Secure Tool Runtime).
# There is no agent-deployer in v2.
#
# Removed v1 keys (do not re-add; the v2 schema rejects unknown keys):
#   sam.platform, sam.communityMode, samDeployment.image,
#   samDeployment.agentDeployer, sam.authenticationRbac.customRoles/
#   idpClaims/defaultRoles (RBAC beyond bootstrap admins is managed
#   post-install via `sam config apply`, see scripts/rbac/).

sam:
  # Enforce OIDC + RBAC (disabled would make every user an admin).
  authorization:
    enabled: true

  # External URL host. Takes precedence over ingress.host for all
  # computed URLs (frontend URL, OIDC redirect URI).
  dnsName: "sam.solace.lab"

  # Session secret for local demo use (deliberately checked in).
  sessionSecretKey: "s6iRVUVvTsAkXCcWyedhFE6d4wLCw0ZA"

  # OIDC configuration -- issuer, clientId, clientSecret are injected
  # via --set in start.sh. providerName stays empty: the binary's
  # default catalog entry is generic OIDC fed by these values, which
  # works for Keycloak. The redirect URI is computed by the chart as
  # https://<dnsName>/api/v1/auth/callback; Keycloak accepts
  # https://sam.solace.lab/* (setup-keycloak-client.sh).
  oauthProvider:
    oidc:
      issuer: ""
      clientId: ""
      clientSecret: ""

  # Bootstrap admins only. All other roles and IDP claim mappings
  # are applied post-install via `sam config apply`, plus one
  # defaultRoles REST call (see scripts/rbac/apply-rbac.sh).
  # Identity = OIDC identity (email) of the Keycloak demo admin
  # created by setup-keycloak-users.sh.
  authenticationRbac:
    users:
      - identity: "sam_admin@solace.lab"
        roles: ["sam_admin"]
        description: "Bootstrap admin (Keycloak demo user sam_admin)"

  # Chart default is localhost-only; empty disables the CORS origin
  # restriction for the demo (same-origin via ingress anyway).
  cors:
    allowedOriginRegex: ""

# Solace Broker Configuration (external).
# Connects to the sam VPN on solace-1 from event-mesh-deployment.
# Only used because global.broker.embedded is false; all four fields
# are required by the chart in that mode. TLS/host/port are encoded
# in the single URL (ws:// = plaintext WebSocket).
broker:
  url: "ws://host.docker.internal:8008"
  clientUsername: "default"
  password: "default"
  vpn: "sam"

# LLM Service Configuration.
# API key is injected via --set in start.sh. Non-empty models are
# seeded into the platform model_configurations table (aliases
# planning/general/report_gen/image_gen; transcriptionModel is env
# only, not table-seeded) at startup. Seeding is insert-only, so
# post-install tuning (scripts/models/set-max-tokens.sh) survives
# restarts and upgrades.
llmService:
  # Haiku, NOT Opus: the only consumer of this env is the STR IPC
  # callback for skill-bundled tools (sam-test-harness
  # generate_test_plan / generate_recommendations), which run in a
  # subprocess with a HARD, non-configurable 30 s timeout -- Opus
  # 4.8 exceeds it on the real plan prompt (verified 2026-08-03),
  # Haiku fits with headroom. The DB-managed 'planning' model
  # alias is independent of this env and stays on Opus.
  planningModel: "openai/claude-haiku-4-5-20251001"
  generalModel: "openai/claude-opus-4-8"
  reportModel: "openai/claude-opus-4-8"
  imageModel: "openai/imagen-3"
  transcriptionModel: "openai/whisper"
  llmServiceEndpoint: "https://lite-llm.mymaas.net"
  llmServiceApiKey: ""

# Note: REQUESTS_CA_BUNDLE and SSL_CERT_FILE are injected
# cluster-wide by the Kyverno policy
# 'inject-solace-lab-ca-trust-bundle' from
# solace-lab-infrastructure/pki. Do NOT enable
# samDeployment.customCA -- it mounts the same path
# (/etc/ssl/certs/ca-certificates.crt) and would conflict with the
# Kyverno mechanism.

# Kubernetes Service Configuration (gwe is the only exposed
# component; TLS terminates at the ingress).
service:
  type: ClusterIP

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # Increase buffer size for OIDC auth callback responses
    # (JWT session cookie + Set-Cookie + state exceeds default 4k/8k)
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    # MCP tools/call holds one HTTP request open for the whole
    # agent/workflow run (retail-360-report: workflow_timeout
    # 900s). The NGINX default proxy-read-timeout of 60s cut
    # those off with 504 -- match the workflow budget instead.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
    cert-manager.io/cluster-issuer: "solace-lab-ca-issuer"
  autoConfigurePaths: true
  host: "sam.solace.lab"
  tls:
    - secretName: sam-tls
      hosts:
        - sam.solace.lab

global:
  # The chart defaults global.imageRegistry to "gcr.io/gcp-maas-prod"
  # (Solace's private MaaS registry) and PREPENDS it to every image
  # whose per-image registry is empty -- including the bundled
  # postgres/seaweedfs. Set it empty so those resolve from Docker Hub;
  # the SAM app/str images carry their own registry below.
  imageRegistry: ""
  # Applied to ALL pods including the sam-doctor pre-install hook
  # (which runs the gwe image from registry.solace.lab). The secret
  # is synced into the namespace by the Kyverno policy
  # 'inject-registry-pull-secret'. Must be a list of plain strings.
  imagePullSecrets:
    - registry-pull-secret
  broker:
    # Use the external event-mesh broker, not the embedded one.
    embedded: false
  persistence:
    # Bundled PostgreSQL + SeaweedFS (dev/POC persistence).
    # namespaceId also namespaces broker topics (kept identical to v1
    # so the topic prefix sam-solace-lab/... stays stable) and derives
    # the DB/bucket names.
    enabled: true
    namespaceId: "sam-solace-lab"

samDeployment:
  # gwe = app image (WebUI + platform API + entrypoints). Loaded into
  # the private registry by scripts/load-images.sh from the offline
  # tarball. awe inherits this image field-by-field (no awe block).
  gwe:
    image:
      registry: "registry.solace.lab"
      repository: "solace-agent-mesh"
      tag: "2.225.14"
      pullPolicy: IfNotPresent
  # str has its own image (Go+Python tool venvs). Never blank its
  # repository -- it would silently inherit the gwe image and break
  # tool execution.
  str:
    image:
      registry: "registry.solace.lab"
      repository: "solace-agent-mesh-str"
      tag: "1.50.3"
      pullPolicy: IfNotPresent
  # S3 (SeaweedFS) init container used with bundled persistence.
  # The chart default tag "3.97-compliant" is a Solace-private
  # rebuild absent from Docker Hub; pin the valid upstream tag.
  s3Init:
    image:
      tag: "3.97"
  # dbInit uses postgres:18.0-trixie (valid Docker Hub tag) -- chart
  # default is fine with imageRegistry "".

# sam-doctor pre-install/pre-upgrade hook: keep the checks (broker,
# LLM, OIDC reachability) but warn-only, so start.sh stays push-button
# even when a dependency is briefly down.
samDoctor:
  failOnError: false

# Bundled persistence (postgresql + seaweedfs) subchart overrides.
# postgres:18.0-trixie is a valid Docker Hub tag, but the seaweedfs
# default tag "3.97-compliant" is a Solace-private build absent from
# Docker Hub -- pin the valid upstream tag "3.97" (same override as
# the s3Init image above). Subchart pullPolicy defaults to Always;
# IfNotPresent avoids re-pulls from Docker Hub on every pod start.
persistence-layer:
  postgresql:
    image:
      pullPolicy: IfNotPresent
  seaweedfs:
    image:
      tag: "3.97"
      pullPolicy: IfNotPresent
