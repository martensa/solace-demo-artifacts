#
# MCP connector to the local Kubernetes SAM deployment. Uses the
# same MCP entrypoint as Claude Code (Streamable HTTP + OAuth 2.1
# discovery against the cluster Keycloak).
#
# The static tool manifest below is REQUIRED: the entrypoint
# blocks tools/list until the user completes OAuth, and without
# a manifest the desktop runtime refuses the MCP client at agent
# startup ("failed to add MCP client ... requires a manifest").
# It must be a real YAML list (a JSON string is rejected). Every
# entrypoint tool takes one required string field "message".
kind: connector
name: SAM K8s Mesh
description: >-
  Local Kubernetes Solace Agent Mesh (sam.solace.lab) exposed via
  its MCP entrypoint. Provides the retail demo agents (CRM, OMS
  and PDM query experts, Retail 360 Reporter) as callable tools.
spec:
  type: mcp
  subtype: remote
  values:
    server_url: https://sam.solace.lab/gw/dev
    connection_type: streamable-http
    auth_type: oauth
    auth_oauth_mode: discovery
    manifest:
