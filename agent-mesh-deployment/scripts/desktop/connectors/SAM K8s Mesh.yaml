# GENERATED by generate-manifest.sh -- edit the generator, not
# this file. Regenerate (then ./connect.sh) after every K8s
# platform rebuild: tool names embed the DB UUIDs of DB-managed
# agents and workflows, which change when stop.sh destroys the
# platform DB.
#
# MCP connector to the local Kubernetes SAM deployment. Uses the
# same MCP entrypoint as Claude Code (Streamable HTTP + OAuth 2.1
# discovery against the cluster Keycloak).
#
# The static tool manifest below is REQUIRED: the entrypoint
# blocks tools/list until the user completes OAuth, and without
# a manifest the desktop runtime refuses the MCP client at agent
# startup ("failed to add MCP client ... requires a manifest").
# It must be a real YAML list (a JSON string is rejected). Every
# entrypoint tool takes one required string field "message".
kind: connector
name: SAM K8s Mesh
description: >-
  Local Kubernetes Solace Agent Mesh (sam.solace.lab) exposed via
  its MCP entrypoint. Provides the mesh agents and deployed
  workflows as callable tools (retail demo experts, Retail 360
  workflow, web research and utility agents).
spec:
  type: mcp
  subtype: remote
  values:
    server_url: https://sam.solace.lab/gw/dev
    connection_type: streamable-http
    auth_type: oauth
    auth_oauth_mode: discovery
    manifest:
      - name: markitdownagent_markdown_converter
        description: >-
          Converts various file types to Markdown format. (K8s mesh
          agent: MarkitdownAgent)
        inputSchema:
          type: object
          properties:
            message:
              type: string
              description: The message or request to send to the agent
          required:
            - message
      - name: mermaidagent_mermaid_diagram_generator
        description: >-
          Generates a PNG image from Mermaid diagram syntax. Input:
          mermaid_syntax (string), output_filename (string, optional).
          (K8s mesh agent: MermaidAgent)
        inputSchema:
          type: object
          properties:
            message:
              type: string
              description: The message or request to send to the agent
          required:
            - message
      - name: agent_019f7f95_9813_78d6_a115_076f0230ba93_general
        description: >-
          General conversation, task orchestration, and getting
          started with Solace Agent Mesh. (K8s mesh agent:
          Orchestrator) Can delegate to the mesh workflows
          ('retail-360-report') and returns their full results
          directly -- preferred for report requests.
        inputSchema:
          type: object
          properties:
            message:
              type: string
              description: The message or request to send to the agent
          required:
            - message
      - name: workflow_019f7fdf_1e7f_7cfb_8c22_09e9eec30302_retail_360_report
        description: >-
          Fan a business question out to the CRM, OMS and PDM experts
          in parallel and merge the findings into one executive
          report. (K8s mesh workflow: retail-360-report) NOTE: the
          tool result is only a completion status; the produced
          report/artifacts stay on the mesh and re-fetching from an
          agent REGENERATES them. To receive the result directly in
          one call, use
          agent_019f7f95_9813_78d6_a115_076f0230ba93_general instead
          and ask it to delegate to the workflow 'retail-360-report'
          and return the full report text.
        inputSchema:
          type: object
          properties:
            message:
              type: string
              description: The message or request to send to the agent
          required:
            - message
      - name: agent_019f7fdf_1e6b_7d5d_aaa5_c78bc9003f66_retail_360_synthesis
        description: >-
          Merge CRM, OMS and PDM findings into one executive report.
