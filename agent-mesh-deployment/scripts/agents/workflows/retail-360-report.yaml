# Retail 360 workflow: fan out to the three domain experts in
# parallel (no depends_on between them), then merge their findings.
# Triggered via Orchestrator delegation once deployed (the 2.225.14
# WebUI chat picker lists agents only); the caller needs
# workflow:*:invoke AND agent:*:invoke scopes (each node hop is
# authorized against the caller).
kind: workflow
name: retail-360-report
description: >-
  Retail 360 report: fans a business question out to the CRM, OMS
  and PDM query experts in parallel and merges their findings into
  one executive report.
spec:
  appConfig:
    # Bump this version to force a redeploy: the apply deploy phase
    # only fires for resources whose config CHANGED (see create.sh).
    version: "1.0.4"
    display_name: Retail 360 Report
    description: >-
      Parallel CRM/OMS/PDM analysis merged into one executive
      report.
    # Give slow first runs room (cold LLM caches + several SQL
    # queries per expert) and keep going if one domain fails - the
    # Reporter is instructed to mark failed sections transparently.
    workflow_timeout: "900s"
    default_node_timeout: "420s"
    fail_fast: false
    # Agent-card skill advertisement: capability metadata for
    # Orchestrator delegation and MCP tool naming (the 2.225.14
    # WebUI chat picker hides workflow cards regardless).
    skills:
      - id: retail_360_report
        name: Retail 360 Report
        description: >-
          Fan a business question out to the CRM, OMS and PDM
          experts in parallel and merge the findings into one
          executive report.
    output_mapping:
      report: "{{report.output}}"
    nodes:
      - id: crm
        type: agent
        agent_name: Retail CRM Query Expert
        input:
          message: >-
            Analyze the CUSTOMER (CRM) perspective of this request.
            Query the retail_crm database as needed and return your
            key findings as a concise markdown section (numbers
            included, no fluff). Request:
            {{workflow.input.text}}
      - id: oms
        type: agent
        agent_name: Retail OMS Query Expert
        input:
          message: >-
            Analyze the ORDER (OMS) perspective of this request.
            Query the retail_oms database as needed (mind the
            line-item grain) and return your key findings as a
            concise markdown section (numbers included, no fluff).
            Request: {{workflow.input.text}}
      - id: pdm
        type: agent
        agent_name: Retail PDM Query Expert
        input:
          message: >-
            Analyze the PRODUCT (PDM) perspective of this request.
            Query the retail_pdm database as needed and return your
            key findings as a concise markdown section (numbers
            included, no fluff). Request:
            {{workflow.input.text}}
      - id: report
        type: agent
        agent_name: Retail 360 Reporter
        depends_on:
          - crm
          - oms
          - pdm
        input:
          message: |
            Merge these three findings sections into one executive
            Retail 360 report answering the original request:
            {{workflow.input.text}}

            ## CRM findings
            {{crm.output}}

            ## OMS findings
            {{oms.output}}

            ## PDM findings
            {{pdm.output}}
