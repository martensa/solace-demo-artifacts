kind: connector
name: Retail CRM DB
description: >-
  This connector is used to generate dynamic SQL queries for the
  database of the connected retail CRM (customer relationship
  management) system. The database holds one table
  (retail_customers) with customer master data: customer type,
  loyalty card and membership tier, demographics (age group,
  income range, household size, lifestyle), location
  (city/state/region), shopping preference flags (organic,
  premium, local, health-conscious, sustainable,
  budget-conscious) and lifetime purchase aggregates (total
  transactions, total spend, first/last transaction dates).
  Timestamps are in UTC.
spec:
  type: sql
  subtype: postgres
  values:
    database: retail_crm
    hostname: host.docker.internal
    port: 5432
    username: ${RETAIL_DB_USERNAME}
    password: ${RETAIL_DB_PASSWORD}
