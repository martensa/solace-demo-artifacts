kind: connector
name: Retail PDM DB
description: >-
  This connector is used to generate dynamic SQL queries for the
  database of the connected retail PDM (product data management)
  system. The database holds one table (retail_product_master)
  with product master data: categories and departments, brand,
  supplier, unit and cost price, margin percentage, product flags
  (organic, local, artisan, luxury, premium), stock level and
  inventory status, unit of measure, dimensions and weight,
  popularity score and seasonality. Timestamps are in UTC.
spec:
  type: sql
  subtype: postgres
  values:
    database: retail_pdm
    hostname: host.docker.internal
    port: 5432
    username: ${RETAIL_DB_USERNAME}
    password: ${RETAIL_DB_PASSWORD}
