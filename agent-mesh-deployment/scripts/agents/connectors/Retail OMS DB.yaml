kind: connector
name: Retail OMS DB
description: >-
  This connector is used to generate dynamic SQL queries for the
  database of the connected retail OMS (order management system).
  The database holds one table (retail_sales_orders) at order
  LINE-ITEM grain: one row per product line of a point-of-sale
  order, with order and transaction identifiers, customer and
  store references, order date and time (the demo dataset covers
  a single day, 2024-10-22), product references (product_id,
  sku), quantities, line prices, discounts and taxes, payment
  method, cashier, and order-level totals repeated on every line.
  Timestamps are in UTC.
spec:
  type: sql
  subtype: postgres
  values:
    database: retail_oms
    hostname: host.docker.internal
    port: 5432
    username: ${RETAIL_DB_USERNAME}
    password: ${RETAIL_DB_PASSWORD}
