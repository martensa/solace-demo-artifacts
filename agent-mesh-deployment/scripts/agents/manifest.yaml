# Declarative manifest for the retail demo agents.
# Applied with:  sam config plan/apply -m manifest.yaml  (see create.sh)
#
# Order of creation is handled by the CLI: connectors are reconciled
# before the agents that reference them (by name).
kind: manifest
name: retail-demo-agents
description: >-
  Retail demo end to end: CRM/OMS/PDM postgres connectors, schema
  skill bundles, the three SQL query expert agents plus the Retail
  360 Reporter, the retail-360-report workflow and the developer
  MCP entrypoint.
target:
  name: solace-lab
  url: https://sam.solace.lab
  auth:
    # Token cache from `sam auth login solace-lab` (browser flow,
    # log in as a user with agent_builder/connector scopes, e.g.
    # the bootstrap admin sam_admin).
    type: oauth
variables:
  # Demo defaults (see repo conventions); override via environment
  # at apply time, e.g. RETAIL_DB_PASSWORD=secret ./create.sh
  RETAIL_DB_USERNAME: "postgres"
  RETAIL_DB_PASSWORD: "postgres"
resources:
  connectors:
    - Retail CRM DB
    - Retail OMS DB
    - Retail PDM DB
  skills:
    - retail-crm-schema
    - retail-oms-schema
    - retail-pdm-schema
  agents:
    - Retail CRM Query Expert
    - Retail OMS Query Expert
    - Retail PDM Query Expert
    - Retail 360 Reporter
    # Meetup demo: merge agent for the order-incident workflow.
    # NOTE: the Retail POS Analyst is deliberately NOT managed
    # here -- it is created live via the AI Builder (fallback:
    # sam-retail-ops-demo/fallback/).
    - Order Incident Reporter
    # Meetup demo: Haiku-bound clerk for the good-case shop path.
    - Order Confirmation Clerk
  workflows:
    - retail-360-report
    - order-incident-report
  entrypoints:
    - developer-mcp
    - shop-events
