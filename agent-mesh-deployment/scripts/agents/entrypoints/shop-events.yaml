# Event-Mesh entrypoint (meetup demo): shop order events on the
# sam VPN trigger SAM without any human in the loop.
#   failed  -> order-incident-report workflow -> incident report
#   created -> Retail OMS Query Expert -> short order confirmation
# Both rules publish their result back onto the mesh
# (acmeretail/shop/order/result/...), which the shop page
# subscribes to -- the loop closes in the browser.
#
# The broker connection mirrors the SAM deployment values
# (external broker solace-1, VPN sam). qos 1 + on_completion:
# the event is only acknowledged after the workflow/agent
# finishes (redelivery on crash).
kind: entrypoint
name: shop-events
description: >-
  Event-mesh entrypoint for the Acme Retail shop demo: failed
  orders trigger the order-incident-report workflow, created
  orders get a confirmation from the OMS expert.
spec:
  type: event_mesh
  deploy: true
  values:
    broker_url: "ws://host.docker.internal:8008"
    broker_vpn: sam
    broker_username: default
    broker_password: default
    tls_skip_verify: "false"
    event_rules:
      - name: failed_orders
        subscriptions:
          - topic: "acmeretail/shop/order/failed/>"
            qos: 1
        messageFormat: json
        # NOTE (verified 2026-07-31): with targetWorkflowName the
        # entrypoint delivers an EMPTY A2A message -- promptTemplate
        # is only rendered for AGENT targets (A2A sniff:
        # parts[0].text == ""). Therefore the incident path runs
        # through the Reporter AGENT, which delegates to the OMS,
        # PDM and POS experts itself. The order-incident-report
        # workflow stays deployed and is used for the UI/Activities
        # story; vendor gap reported.
        #
        # Target is the ORCHESTRATOR: only it can delegate to peer
        # agents (a standard agent reports "peer delegation lives at
        # my level, not theirs"). It fans out to the OMS/PDM/POS
        # experts and has the Order Incident Reporter merge.
        targetAgent: Orchestrator
        promptTemplate: >-
          A shop order failed. Delegate in parallel: "Retail OMS
          Query Expert" for the order context in retail_oms,
          "Retail PDM Query Expert" for the product master data in
          retail_pdm (stock, inventory_status, seasonality, margin
          vs. the stated failure reason) and "Retail POS Analyst"
          for the store channel in the POSLOG MongoDB (register
          sales, voids, quantities). Then have "Order Incident
          Reporter" merge the findings into the incident report and
          return that report as your answer. Failed order event
          JSON: {payload}
        acknowledgmentPolicy:
          mode: on_completion
          timeoutSeconds: 600
        successOutput:
          enabled: true
          topic: "acmeretail/shop/order/result/incident"
          topicType: static
          responseType: full
        errorOutput:
          enabled: true
          topic: "acmeretail/shop/order/result/error"
          topicType: static
      - name: created_orders
        subscriptions:
          - topic: "acmeretail/shop/order/created/>"
            qos: 1
        messageFormat: json
        targetAgent: Retail OMS Query Expert
        promptTemplate: >-
          A new online order arrived. Confirm it in 3 sentences:
          check in retail_oms whether the customer is known and
          whether the product has sold before, then confirm the
          order looks good. Order event JSON: {payload}
        acknowledgmentPolicy:
          mode: on_completion
          timeoutSeconds: 300
        successOutput:
          enabled: true
          topic: "acmeretail/shop/order/result/confirmation"
          topicType: static
          responseType: full
        errorOutput:
          enabled: true
          topic: "acmeretail/shop/order/result/error"
          topicType: static
