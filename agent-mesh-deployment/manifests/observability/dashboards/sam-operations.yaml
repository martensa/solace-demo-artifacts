apiVersion: v1
data:
  sam-operations.json: "{\n \"uid\": \"sam-operations\",\n \"title\": \"SAM Operations\",\n \"tags\": [\n  \"sam\",\n  \"operations\"\n ],\n \"schemaVersion\": 39,\n \"editable\": true,\n \"refresh\": \"30s\",\n \"time\": {\n  \"from\": \"now-6h\",\n  \"to\": \"now\"\n },\n \"timezone\": \"browser\",\n \"panels\": [\n  {\n   \"type\": \"stat\",\n   \"title\": \"Instance Up\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 6,\n    \"h\": 4\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sam_instance_up\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{job}}\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Broker Connection\",\n   \"gridPos\": {\n    \"x\": 6,\n    \"y\": 0,\n    \"w\": 6,\n    \"h\": 4\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sam_broker_connection_state\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{job}}\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Tasks in Flight (Gateway)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 4\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sam_gateway_tasks_in_flight\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"in flight\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Entrypoint Request-Rate nach Route\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 4,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum by (route_template) (rate(sam_entrypoint_requests_total[5m]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{route_template}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Entrypoint-Latenz p50/p95/p99\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 4,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.50, sum by (le) (rate(sam_entrypoint_duration_seconds_bucket[5m])))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"p50\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(sam_entrypoint_duration_seconds_bucket[5m])))\",\n     \"refId\": \"B\",\n     \"legendFormat\": \"p95\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(sam_entrypoint_duration_seconds_bucket[5m])))\",\n     \"refId\": \"C\",\n     \"legendFormat\": \"p99\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Fehlerrate nach error_type\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 12,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum by (error_type) (rate(sam_entrypoint_requests_total{error_type!=\\\"\\\"}[5m]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{error_type}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Agent-/Tool-Ausfuehrung p95\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 12,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.95, sum by (le, type) (rate(sam_operation_duration_seconds_bucket[5m])))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{type}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Outbound-Calls p95 nach Ziel\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 20,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.95, sum by (le, service_peer_name) (rate(sam_outbound_request_duration_seconds_bucket[5m])))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{service_peer_name}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Go-Heap nach Komponente\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 20,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sam_runtime_go_heap_alloc_bytes\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{job}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"bytes\"\n    },\n    \"overrides\": []\n   }\n  }\n ]\n}"
kind: ConfigMap
