apiVersion: v1
data:
  sam-token-cost.json: "{\n \"uid\": \"sam-token-cost\",\n \"title\": \"SAM Token und Cost (Chargeback)\",\n \"tags\": [\n  \"sam\",\n  \"governance\",\n  \"chargeback\"\n ],\n \"schemaVersion\": 39,\n \"editable\": true,\n \"refresh\": \"30s\",\n \"time\": {\n  \"from\": \"now-6h\",\n  \"to\": \"now\"\n },\n \"timezone\": \"browser\",\n \"panels\": [\n  {\n   \"type\": \"table\",\n   \"title\": \"Tokens je User (Chargeback, Zeitraum)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"\\nSELECT user_id,\\n       count(*) AS tasks,\\n       sum(total_input_tokens) AS input_tokens,\\n       sum(total_output_tokens) AS output_tokens,\\n       sum(total_cached_input_tokens) AS cached_tokens\\nFROM tasks\\nWHERE to_timestamp(start_time/1000) BETWEEN $__timeFrom() AND $__timeTo()\\nGROUP BY user_id ORDER BY input_tokens DESC NULLS LAST\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"table\",\n   \"title\": \"Tokens je Modell (aus token_usage_details)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"\\nSELECT m.key AS model,\\n       sum((m.value->>'input_tokens')::bigint)  AS input_tokens,\\n       sum((m.value->>'output_tokens')::bigint) AS output_tokens,\\n       sum((m.value->>'cached_input_tokens')::bigint) AS cached_tokens\\nFROM tasks, jsonb_each(token_usage_details::jsonb->'by_model') m\\nWHERE token_usage_details IS NOT NULL\\n  AND to_timestamp(start_time/1000) BETWEEN $__timeFrom() AND $__timeTo()\\nGROUP BY 1 ORDER BY 2 DESC\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Token-Verbrauch ueber Zeit (je User)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 8,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"\\nSELECT date_trunc('hour', to_timestamp(start_time/1000)) AS time,\\n       user_id AS metric,\\n       sum(coalesce(total_input_tokens,0)+coalesce(total_output_tokens,0)) AS tokens\\nFROM tasks\\nWHERE to_timestamp(start_time/1000) BETWEEN $__timeFrom() AND $__timeTo()\\nGROUP BY 1,2 ORDER BY 1\",\n     \"format\": \"time_series\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"table\",\n   \"title\": \"Teuerste Tasks\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 8,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"\\nSELECT to_timestamp(start_time/1000) AS start,\\n       user_id,\\n       substring(initial_request_text,1,60) AS request,\\n       total_input_tokens, total_output_tokens,\\n       round((end_time-start_time)/1000.0,1) AS dauer_s,\\n       status\\nFROM tasks\\nWHERE to_timestamp(start_time/1000) BETWEEN $__timeFrom() AND $__timeTo()\\nORDER BY coalesce(total_input_tokens,0) DESC LIMIT 15\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Token-Rate live (Prometheus, je Modell/Typ)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 16,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum by (gen_ai_request_model, gen_ai_token_type) (rate(sam_gen_ai_tokens_used_total[5m]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{gen_ai_request_model}} {{gen_ai_token_type}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"LLM-Latenz p95 je Modell\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 16,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(sam_gen_ai_client_operation_duration_seconds_bucket[5m])))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{gen_ai_request_model}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Geschaetzte LLM-Kosten (24h, je Modell)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 24,\n    \"w\": 12,\n    \"h\": 6\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum by (gen_ai_request_model) (increase(sam_gen_ai_cost_total[24h]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{gen_ai_request_model}}\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"currencyUSD\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"table\",\n   \"title\": \"Task-Dauer je User (Median, aus DB)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 24,\n    \"w\": 12,\n    \"h\": 6\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"\\nSELECT user_id,\\n       round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (end_time-start_time))/1000.0, 1) AS median_s,\\n       round(max(end_time-start_time)/1000.0,1) AS max_s\\nFROM tasks\\nWHERE end_time IS NOT NULL\\n  AND to_timestamp(start_time/1000) BETWEEN $__timeFrom() AND $__timeTo()\\nGROUP BY user_id\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  }\n ]\n}"
kind: ConfigMap
metadata:
  name: dashboard-sam-token-cost
  namespace: sam-solace-lab
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: SAM

