apiVersion: v1
data:
  sam-meetup.json: "{\n \"uid\": \"sam-meetup\",\n \"title\": \"SAM Meetup Demo\",\n \"tags\": [\n  \"sam\",\n  \"meetup\"\n ],\n \"schemaVersion\": 39,\n \"editable\": true,\n \"refresh\": \"10s\",\n \"time\": {\n  \"from\": \"now-1h\",\n  \"to\": \"now\"\n },\n \"timezone\": \"browser\",\n \"panels\": [\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"## SAM Meetup Demo - der rote Faden\\n**1. Gesundheit** -> **2. Geschwindigkeit** -> **3. Kosten & Chargeback** -> **4. Governance (wer tut was?)** -> **5. Der Beweis (Traces & Activities)** - alles aus EINEM Stack: Prometheus-Metriken, Loki-Audit-Logs, Platform-DB, Tempo-Traces.\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 2,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 1. Ist der AI-Worker gesund? *(sam_instance_up, Broker-Link, laufende Tasks - Ausfall = Alert)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Komponenten up\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 4,\n    \"w\": 4,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum(sam_instance_up)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"up\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"yellow\",\n        \"value\": 2\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 3\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Broker-Verbindungen\",\n   \"gridPos\": {\n    \"x\": 4,\n    \"y\": 4,\n    \"w\": 4,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum(sam_broker_connection_state)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"connected\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 3\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Tasks in Flight\",\n   \"gridPos\": {\n    \"x\": 8,\n    \"y\": 4,\n    \"w\": 4,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sam_gateway_tasks_in_flight\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"in flight\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Request-Rate (Entrypoint)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 4,\n    \"w\": 12,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum(rate(sam_entrypoint_requests_total[2m]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"req/s\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 9,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 2. Wie schnell antwortet er? *(Anfrage-Dauer p50/p95 + LLM-Latenz je Modell)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Anfrage-Dauer p50/p95 (s)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 11,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.50, sum by (le) (rate(sam_entrypoint_duration_seconds_bucket[5m])))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"p50\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(sam_entrypoint_duration_seconds_bucket[5m])))\",\n     \"refId\": \"B\",\n     \"legendFormat\": \"p95\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"LLM-Latenz p95 je Modell (s)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 11,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(sam_gen_ai_client_operation_duration_seconds_bucket[5m])))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{gen_ai_request_model}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 18,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 3. Was kostet er - und WER verbraucht die Tokens? *(Prometheus kennt Modelle, die Platform-DB kennt User -> Chargeback)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Token-Rate je Modell/Typ\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 20,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum by (gen_ai_request_model, gen_ai_token_type) (rate(sam_gen_ai_tokens_used_total[5m]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{gen_ai_request_model}} {{gen_ai_token_type}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"table\",\n   \"title\": \"Token-Chargeback je User (Zeitraum)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 20,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT user_id, count(*) AS tasks,\\n       sum(total_input_tokens) AS input_tokens,\\n       sum(total_output_tokens) AS output_tokens\\nFROM tasks\\nWHERE to_timestamp(start_time/1000) BETWEEN $__timeFrom() AND $__timeTo()\\nGROUP BY user_id ORDER BY input_tokens DESC NULLS LAST LIMIT 8\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 27,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 4. Governance: Wer nutzt was? *(Audit-Stream aus Loki: jede Tool-Ausfuehrung mit User - RBAC-Denies und Auth-Fehler inklusive)*\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Tool-Executions je User -> Tool (Audit)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 29,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (userID, tool) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `tool execution` | json userID=\\\"userID\\\", tool=\\\"tool\\\" | __error__=\\\"\\\" [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"{{userID}} -> {{tool}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Auth-Failures & RBAC-Denies\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 29,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (reason) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `authentication failed` | json reason=\\\"reason\\\" | __error__=\\\"\\\" [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"auth-fail: {{reason}}\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum(count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `denied` [$__auto]))\",\n     \"refId\": \"B\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"rbac denied\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 36,\n    \"w\": 24,\n    \"h\": 3\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### 5. Der Beweis *(Drilldown: jeder A2A-Hop ist ein Broker-Span in Tempo; jede LLM-/Tool-Aktion steht in SAM -> Activities)*\\n**Tempo**: Explore -> Tempo -> Search sam-solace-lab/a2a | **Logs mit traceID**: Loki-Zeile -> Feld *traceID* klicken | **SAM Activities**: https://sam.solace.lab -> Activities -> Task -> *Performance* (Gantt)\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"transparent\": true\n  }\n ]\n}"
kind: ConfigMap
metadata:
  name: dashboard-sam-meetup
  namespace: sam-solace-lab
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: SAM

