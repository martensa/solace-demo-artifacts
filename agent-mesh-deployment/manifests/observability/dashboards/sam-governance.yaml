apiVersion: v1
data:
  sam-governance.json: "{\n \"uid\": \"sam-governance\",\n \"title\": \"SAM Governance und Security\",\n \"tags\": [\n  \"sam\",\n  \"governance\",\n  \"security\"\n ],\n \"schemaVersion\": 39,\n \"editable\": true,\n \"refresh\": \"30s\",\n \"time\": {\n  \"from\": \"now-6h\",\n  \"to\": \"now\"\n },\n \"timezone\": \"browser\",\n \"panels\": [\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Wer nutzt was: Tool-Executions je User+Tool (Audit)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 24,\n    \"h\": 9\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (userID, tool) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `tool execution` | json userID=\\\"userID\\\", tool=\\\"tool\\\" | __error__=\\\"\\\" [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"{{userID}} -> {{tool}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Auth-Failures nach Grund\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 9,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (reason) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `authentication failed` | json reason=\\\"reason\\\" | __error__=\\\"\\\" [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"{{reason}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"RBAC-Denies (Tool/Agent/Control-Plane)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 9,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (userID) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `denied` | json userID=\\\"userID\\\" | __error__=\\\"\\\" [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"{{userID}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Tool-Failures (WARN/ERROR, Audit)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 17,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (tool, level) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `tool execution` != `succeeded` | json tool=\\\"tool\\\", level=\\\"level\\\" | __error__=\\\"\\\" [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"{{tool}} {{level}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Tool-Dauer p95 (Audit duration_ms)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 17,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"quantile_over_time(0.95, {namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` |= `tool execution` | json | __error__=\\\"\\\" | unwrap duration_ms [$__auto]) by (tool)\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"{{tool}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"ms\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Audit-Ereignisse je User (Aktivitaet)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 25,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"sum by (userID) (count_over_time({namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` | json userID=\\\"userID\\\" | __error__=\\\"\\\" | userID != `` [$__auto]))\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\",\n     \"legendFormat\": \"{{userID}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"logs\",\n   \"title\": \"Audit-Rohstrom (Drilldown)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 25,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"{namespace=\\\"sam-solace-lab\\\"} |= `\\\"logger_name\\\":\\\"audit\\\"` | json | line_format `{{.level}} {{.message}} user={{.userID}} tool={{.tool}} agent={{.agentName}}`\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  }\n ]\n}"
