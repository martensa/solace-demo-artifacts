extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1000
    spike_limit_mib: 500

  batch:

# Backends: der Grafana-Stack im lokalen k3s-Cluster (namespace
# monitoring, aus solace-lab-infrastructure). Die *.svc.cluster.local
# FQDNs funktionieren, weil der Container kube-dns (10.43.0.10) als
# Upstream-DNS nutzt (siehe docker-compose.yaml) und die Compose-
# Container in derselben Rancher-Desktop-VM wie k3s laufen.
exporters:
  debug:
    verbosity: "basic"

  # Traces -> Grafana Tempo (OTLP HTTP)
  otlphttp/tempo:
    endpoint: http://tempo.monitoring.svc.cluster.local:4318
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

  # Logs -> Grafana Loki (nativer OTLP-Ingest; Exporter haengt
  # /v1/logs an den Endpoint an; auth_enabled=false, kein Header)
  otlphttp/loki:
    endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
    retry_on_failure:
      enabled: true

  # Metriken -> Prometheus Remote Write (Receiver aktiviert via
  # enableRemoteWriteReceiver in solace-lab-infrastructure).
  # resource_to_telemetry_conversion legt Ressourcen-Attribute
  # (z. B. service.name) direkt auf die Serien - wichtig fuer die
  # kuenftige SAM-Anbindung.
  prometheusremotewrite:
    endpoint: http://kube-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
    target_info:
      enabled: false
    retry_on_failure:
      enabled: true

receivers:
  # OTLP: Broker-fremde Quellen. Kuenftig pusht auch SAM (gwe/awe/str)
  # Metriken+Logs hierher: management_server.exporters ->
  # http://host.docker.internal:4318 (HTTP) bzw. :4317 (gRPC).
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  solace/solace-1:
    broker: [solace-1:5672]
    max_unacknowledged: 500
    auth:
      sasl_plain:
        username: trace
        password: trace
    queue: queue://#telemetry-trace
    tls:
      insecure: true
      insecure_skip_verify: true

  solace/solace-2:
    broker: [solace-2:5672]
    max_unacknowledged: 500
    auth:
      sasl_plain:
        username: trace
        password: trace
    queue: queue://#telemetry-trace
    tls:
      insecure: true
      insecure_skip_verify: true

  # SAM A2A tracing: the sam VPN on solace-1 exposes AMQP on its
  # own per-VPN port (5673). Every gwe<->awe<->str hop is a
  # guaranteed message and becomes a broker span in Tempo.
  solace/solace-1-sam:
    broker: [solace-1:5673]
    max_unacknowledged: 500
    auth:
      sasl_plain:
        username: trace
        password: trace
    queue: queue://#telemetry-trace
    tls:
      insecure: true
      insecure_skip_verify: true

service:
  extensions: [health_check, zpages]
  telemetry:
    logs:
      level: "info"
  pipelines:
    traces:
      receivers: [solace/solace-1, solace/solace-1-sam, solace/solace-2, otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
