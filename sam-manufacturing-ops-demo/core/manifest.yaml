# Declarative manifest for the Acme Manufacturing CORE package:
# CRM/OMS/PDM/SCM postgres connectors, schema skill bundles and
# the four SQL query expert agents. This is the manufacturing
# analog of sam-retail-ops-demo/core -- every demo owns its core;
# agent-mesh-deployment stays pure SAM infrastructure (models,
# RBAC, observability, developer-mcp). uninstall.sh removes the
# core together with the overlay; --keep-core keeps it for fast
# switching between demo overlays.
#
# Applied with:  sam config plan/apply -m manifest.yaml
# (install.sh does this; order is handled by the CLI, connectors
# before the agents that reference them.)
#
# NEVER pass --prune: the platform hosts resources this manifest
# does not manage (Orchestrator, developer-mcp, other demos ...).
kind: manifest
name: mfg-core-agents
description: >-
  Acme Manufacturing core: CRM/OMS/PDM/SCM postgres connectors,
  schema skill bundles and the four query expert agents.
target:
  name: solace-lab
  url: https://sam.solace.lab
  auth:
    type: oauth
# Environment variables of this package (no `variables:` block on
# purpose): MFG_DB_USERNAME / MFG_DB_PASSWORD, default postgres,
# defaulted INLINE in the connectors -- `${VAR, default}` -- so an
# exported value (e.g. from agent-mesh-deployment/.env) wins. A
# default under `variables:` beats the environment on CLI 2.348.22
# (verified 2026-09-21).
# e.g. MFG_DB_PASSWORD=secret ./install.sh
resources:
  connectors:
    - Acme CRM DB
    - Acme OMS DB
    - Acme PDM DB
    - Acme SCM DB
  skills:
    - mfg-crm-schema
    - mfg-oms-schema
    - mfg-pdm-schema
    - mfg-scm-schema
  agents:
    - Acme CRM Query Expert
    - Acme OMS Query Expert
    - Acme PDM Query Expert
    - Acme SCM Query Expert
    # NOTE: demo-specific resources (Production Confirmation
    # Clerk, Quality Incident Reporter, Supply Chain Watcher,
    # the two workflows, plant-events entrypoint, Shop Floor
    # Analyst) are NOT managed here -- they live in ../mesh and
    # ../fallback and are installed/removed via install.sh /
    # uninstall.sh.
