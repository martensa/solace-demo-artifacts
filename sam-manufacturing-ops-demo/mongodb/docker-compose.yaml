# Distinct compose project name: the retail demo's compose also
# lives in a dir called mongodb/ -- without this both would share
# the project "mongodb" and see each other's container as orphan.
name: mfg-plant

networks:
  solace_net:
    name: solace_net
    external: true

services:
  mfg-plant-mongo:
    image: mongo:7
    container_name: mfg-plant-mongo
    hostname: mfg-plant-mongo
    networks:
      - solace_net
    ports:
      # Standard port: only one demo's mongo runs at a time --
      # stop retail-pos-mongo before starting this container.
      - "27017:27017"
    environment:
      # Demo-only credentials (repo convention, never production)
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: mfg_plant
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    restart: on-failure
