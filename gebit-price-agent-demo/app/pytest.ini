[pytest]
# gpos-demo tests (UC1-BUILD-SPEC 13). Run from the demo root:
#   .venv/bin/python -m pytest app/tests/<pkg> -q
# make test: -m "not db and not gebit and not integration"
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --import-mode=importlib
markers =
    db: needs the host Postgres container (fixture scratch_db, throwaway DB per session)
    gebit: needs the GEBIT descriptor sets (GEBIT_DESCRIPTOR_SETS or GEBIT_DESCRIPTOR_DIR)
    integration: integration test (13.2); lab broker or Postgres, skipped if unreachable
