# mesh/connectors/gpos-loyalty-api.yaml
# Agent tools (spec 8.4): one compact JSON text content, no outputSchema. The
# manifest: block is generated from `python -m gposdemo.loyalty --dump-tools`.
kind: connector
name: gpos-loyalty-api
description: >-
  Read-only loyalty API of the fictional showcase store: member profile, consent
  and purchase behaviour of one card, anonymous cardholder trends.
spec:
  type: mcp
  subtype: remote
  values:
    server_url: http://gpos-loyalty.gpos-demo.svc:8772/mcp
    connection_type: streamable-http
    auth_type: none
    manifest:
      # GENERATED by scripts/gen_connector_manifest.py -- do not edit
      # source: python -m gposdemo.loyalty --dump-tools
      - name: "get_member_profile"
        description: "Profile of one fictional loyalty card (no personal attributes)."
        inputSchema: {"properties": {"membership_id": {"description": "Membership id of the card, e.g. M-1001.", "title": "Membership Id", "type": "string"}, "ref": {"default": "", "description": "review_id of the basket review (for the monitor).", "title": "Ref", "type": "string"}}, "required": ["membership_id"], "title": "get_member_profileArguments", "type": "object"}
      - name: "get_purchase_behaviour"
        description: "Purchase behaviour of one fictional loyalty card for one article (member fields only with profiling consent) plus the anonymous cardholder trend."
        inputSchema: {"properties": {"membership_id": {"description": "Membership id of the card, e.g. M-1001.", "title": "Membership Id", "type": "string"}, "article_number": {"description": "Article number, e.g. 100012.", "title": "Article Number", "type": "string"}, "ref": {"default": "", "description": "review_id of the basket review (for the monitor).", "title": "Ref", "type": "string"}}, "required": ["membership_id", "article_number"], "title": "get_purchase_behaviourArguments", "type": "object"}
