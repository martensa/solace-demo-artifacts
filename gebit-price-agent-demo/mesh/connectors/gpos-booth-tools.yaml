# mesh/connectors/gpos-booth-tools.yaml
# The manifest: block is generated (spec 8.5): `make manifests` runs
# `python -m gposdemo.engine --dump-tools` in the image and
# scripts/gen_connector_manifest.py rewrites the block. Without a manifest the
# connector keeps no tool list after `sam config apply` and the workflow tool
# nodes cannot bind (G0-01). scripts/install.sh mesh refuses a PLACEHOLDER block.
kind: connector
name: gpos-booth-tools
description: >-
  Deterministic workflow tools of the EuroCIS price agent (engine): ingest and
  analyse POS events, raise and prepare basket reviews, stage, check and record
  price proposals. Never changes a price.
spec:
  type: mcp
  subtype: remote
  values:
    server_url: http://gpos-engine.gpos-demo.svc:8765/mcp
    connection_type: streamable-http
    auth_type: none
    manifest:
      # GENERATED by scripts/gen_connector_manifest.py -- do not edit
      # source: python -m gposdemo.engine --dump-tools
      - name: "assess_event"
        description: "Ingest one raw GEBIT POS event idempotently and analyse it (no model)."
        inputSchema: {"properties": {"raw": {"description": "Raw GEBIT purchase event (proto3 JSON).", "title": "Raw", "type": "string"}, "run_id": {"default": "", "description": "Workflow run id of the calling SAM run.", "title": "Run Id", "type": "string"}}, "required": ["raw"], "title": "assess_eventArguments", "type": "object"}
        outputSchema: {"properties": {"verdict": {"title": "Verdict", "type": "string"}, "event_key": {"title": "Event Key", "type": "string"}, "event_type": {"title": "Event Type", "type": "string"}, "tx_id": {"default": "", "title": "Tx Id", "type": "string"}, "store": {"default": "", "title": "Store", "type": "string"}, "till": {"default": "", "title": "Till", "type": "string"}, "article_number": {"default": "", "title": "Article Number", "type": "string"}, "insight_code": {"default": "", "title": "Insight Code", "type": "string"}, "insight_text": {"default": "", "title": "Insight Text", "type": "string"}}, "required": ["verdict", "event_key", "event_type"], "title": "AssessResult", "type": "object"}
      - name: "check_proposal"
        description: "Check a staged proposal before approval; returns the summary texts."
        inputSchema: {"properties": {"proposal_id": {"description": "Proposal id, e.g. GP-270216-0003.", "title": "Proposal Id", "type": "string"}, "run_id": {"default": "", "description": "Workflow run id of the calling SAM run.", "title": "Run Id", "type": "string"}}, "required": ["proposal_id"], "title": "check_proposalArguments", "type": "object"}
        outputSchema: {"properties": {"status": {"title": "Status", "type": "string"}, "proposal_id": {"title": "Proposal Id", "type": "string"}, "proposal_hash": {"default": "", "title": "Proposal Hash", "type": "string"}, "article_name": {"default": "", "title": "Article Name", "type": "string"}, "old_price": {"default": "", "title": "Old Price", "type": "string"}, "new_price": {"default": "", "title": "New Price", "type": "string"}, "pct_label": {"default": "", "title": "Pct Label", "type": "string"}, "reason_label": {"default": "", "title": "Reason Label", "type": "string"}, "valid_to_label": {"default": "", "title": "Valid To Label", "type": "string"}, "notify_title": {"default": "", "title": "Notify Title", "type": "string"}, "notify_message": {"default": "", "title": "Notify Message", "type": "string"}}, "required": ["status", "proposal_id"], "title": "CheckResult", "type": "object"}
      - name: "close_review"
        description: "Close a basket review without a proposal."
        inputSchema: {"properties": {"review_id": {"description": "Review id, e.g. GR-270216-0007.", "title": "Review Id", "type": "string"}, "outcome": {"description": "no_action|no_candidates|only_blocked|deferred|failed|unknown|stale", "title": "Outcome", "type": "string"}, "rationale": {"description": "Agent rationale or SAM error.", "title": "Rationale", "type": "string"}, "run_id": {"default": "", "description": "Workflow run id of the calling SAM run.", "title": "Run Id", "type": "string"}, "model": {"default": "", "description": "Model alias of the agent that wrote the recommendation (planning).", "title": "Model", "type": "string"}}, "required": ["review_id", "outcome", "rationale"], "title": "close_reviewArguments", "type": "object"}
        outputSchema: {"properties": {"status": {"title": "Status", "type": "string"}, "event_key": {"default": "", "title": "Event Key", "type": "string"}, "verdict": {"default": "", "title": "Verdict", "type": "string"}}, "required": ["status"], "title": "StatusResult", "type": "object"}
      - name: "note_event"
        description: "Record an event or run that needs no further action."
        inputSchema: {"properties": {"event_key": {"description": "event_key from assess_event or an id.", "title": "Event Key", "type": "string"}, "verdict": {"description": "Verdict or status to record.", "title": "Verdict", "type": "string"}, "run_id": {"default": "", "description": "Workflow run id of the calling SAM run.", "title": "Run Id", "type": "string"}}, "required": ["event_key", "verdict"], "title": "note_eventArguments", "type": "object"}
        outputSchema: {"properties": {"status": {"title": "Status", "type": "string"}, "event_key": {"default": "", "title": "Event Key", "type": "string"}, "verdict": {"default": "", "title": "Verdict", "type": "string"}}, "required": ["status"], "title": "StatusResult", "type": "object"}
      - name: "note_evidence"
        description: "Record the evidence of the pricing agent for one prepared review (validated by the engine; no model, never a price)."
        inputSchema: {"properties": {"review_id": {"description": "Review id, e.g. GR-270216-0007.", "title": "Review Id", "type": "string"}, "model": {"default": "", "description": "Model alias of the agent that gathered the evidence (fast).", "title": "Model", "type": "string"}, "tx_status": {"default": "", "description": "closed|not_closed|unknown", "title": "Tx Status", "type": "string"}, "c1_article": {"default": "", "description": "Candidate article number (a), or none.", "title": "C1 Article", "type": "string"}, "c1_reason": {"default": "", "description": "slow_seller|season_end|customer_behaviour|none", "title": "C1 Reason", "type": "string"}, "c1_holds": {"default": "", "description": "yes|no|unknown", "title": "C1 Holds", "type": "string"}, "c1_numbers": {"default": "", "description": "key=value pairs from the API results.", "title": "C1 Numbers", "type": "string"}, "c1_tools": {"default": "", "description": "Agent tools called for this candidate.", "title": "C1 Tools", "type": "string"}, "c2_article": {"default": "", "description": "Candidate article number (a), or none.", "title": "C2 Article", "type": "string"}, "c2_reason": {"default": "", "description": "slow_seller|season_end|customer_behaviour|none", "title": "C2 Reason", "type": "string"}, "c2_holds": {"default": "", "description": "yes|no|unknown", "title": "C2 Holds", "type": "string"}, "c2_numbers": {"default": "", "description": "key=value pairs from the API results.", "title": "C2 Numbers", "type": "string"}, "c2_tools": {"default": "", "description": "Agent tools called for this candidate.", "title": "C2 Tools", "type": "string"}, "run_id": {"default": "", "description": "Workflow run id of the calling SAM run.", "title": "Run Id", "type": "string"}}, "required": ["review_id"], "title": "note_evidenceArguments", "type": "object"}
        outputSchema: {"properties": {"status": {"title": "Status", "type": "string"}, "review_id": {"title": "Review Id", "type": "string"}, "checked": {"default": 0, "title": "Checked", "type": "integer"}, "holding": {"default": 0, "title": "Holding", "type": "integer"}, "evidence": {"default": "", "title": "Evidence", "type": "string"}}, "required": ["status", "review_id"], "title": "EvidenceResult", "type": "object"}
      - name: "prepare_review"
        description: "Prepare a basket review: signals, guardrails and the pricing agent's input."
        inputSchema: {"properties": {"review_id": {"description": "Review id, e.g. GR-270216-0007.", "title": "Review Id", "type": "string"}, "run_id": {"default": "", "description": "Workflow run id of the calling SAM run.", "title": "Run Id", "type": "string"}}, "required": ["review_id"], "title": "prepare_reviewArguments", "type": "object"}
        outputSchema: {"properties": {"candidate": {"title": "Candidate", "type": "string"}, "review_id": {"title": "Review Id", "type": "string"}, "tx_id": {"default": "", "title": "Tx Id", "type": "string"}, "membership_id": {"default": "", "title": "Membership Id", "type": "string"}, "lines": {"default": 0, "title": "Lines", "type": "integer"}, "candidates": {"default": 0, "title": "Candidates", "type": "integer"}, "reason": {"default": "", "title": "Reason", "type": "string"}, "agent_input": {"default": "", "title": "Agent Input", "type": "string"}}, "required": ["candidate", "review_id"], "title": "PrepareReviewResult", "type": "object"}
      - name: "raise_basket_review"
        description: "Raise the basket review of one closed transaction (once per transaction)."
        inputSchema: {"properties": {"tx_id": {"description": "purchaseTransactionId of a closed basket.", "title": "Tx Id", "type": "string"}, "run_id": {"default": "", "description": "Workflow run id of the calling SAM run.", "title": "Run Id", "type": "string"}}, "required": ["tx_id"], "title": "raise_basket_reviewArguments", "type": "object"}
        outputSchema: {"properties": {"status": {"title": "Status", "type": "string"}, "review_id": {"default": "", "title": "Review Id", "type": "string"}, "tx_id": {"default": "", "title": "Tx Id", "type": "string"}}, "required": ["status"], "title": "ReviewTriggerResult", "type": "object"}
      - name: "record_outcome"
        description: "Record the approval outcome from the database; returns the outcome texts."
        inputSchema: {"properties": {"proposal_id": {"description": "Proposal id, e.g. GP-270216-0003.", "title": "Proposal Id", "type": "string"}, "run_id": {"default": "", "description": "Workflow run id of the calling SAM run.", "title": "Run Id", "type": "string"}, "agent_status": {"default": "", "description": "Approver's status.", "title": "Agent Status", "type": "string"}, "action_id": {"default": "", "description": "Approver's action_id.", "title": "Action Id", "type": "string"}, "error": {"default": "", "description": "SAM error message (on_exit).", "title": "Error", "type": "string"}, "approved_at": {"default": "", "description": "F2 only: time returned by the gated time tool (ISO 8601).", "title": "Approved At", "type": "string"}, "tool_message": {"default": "", "description": "Message of the gated tool result as the approver copied it (SAM's text on a denial or timeout).", "title": "Tool Message", "type": "string"}}, "required": ["proposal_id"], "title": "record_outcomeArguments", "type": "object"}
        outputSchema: {"properties": {"outcome": {"title": "Outcome", "type": "string"}, "proposal_id": {"title": "Proposal Id", "type": "string"}, "action_id": {"default": "", "title": "Action Id", "type": "string"}, "notify": {"default": "no", "title": "Notify", "type": "string"}, "notify_title": {"default": "", "title": "Notify Title", "type": "string"}, "notify_message": {"default": "", "title": "Notify Message", "type": "string"}}, "required": ["outcome", "proposal_id"], "title": "OutcomeResult", "type": "object"}
      - name: "stage_proposal"
        description: "Stage the agent's choice as a proposal; the engine fixes step and price."
        inputSchema: {"properties": {"review_id": {"description": "Review id, e.g. GR-270216-0007.", "title": "Review Id", "type": "string"}, "article_number": {"description": "Chosen candidate (a).", "title": "Article Number", "type": "string"}, "reason": {"description": "slow_seller|season_end|customer_behaviour", "title": "Reason", "type": "string"}, "step_pct": {"description": "Agent's step, e.g. \"20\".", "title": "Step Pct", "type": "string"}, "headline": {"description": "German headline, <= 70 characters.", "title": "Headline", "type": "string"}, "rationale": {"description": "German rationale, <= 240 characters.", "title": "Rationale", "type": "string"}, "facts_line": {"description": "German key numbers, <= 120 chars.", "title": "Facts Line", "type": "string"}, "run_id": {"default": "", "description": "Workflow run id of the calling SAM run.", "title": "Run Id", "type": "string"}, "model": {"default": "", "description": "Model alias of the agent that wrote the recommendation (planning).", "title": "Model", "type": "string"}}, "required": ["review_id", "article_number", "reason", "step_pct", "headline", "rationale", "facts_line"], "title": "stage_proposalArguments", "type": "object"}
        outputSchema: {"properties": {"status": {"title": "Status", "type": "string"}, "proposal_id": {"default": "", "title": "Proposal Id", "type": "string"}, "article_number": {"default": "", "title": "Article Number", "type": "string"}, "article_name": {"default": "", "title": "Article Name", "type": "string"}, "old_price": {"default": "", "title": "Old Price", "type": "string"}, "new_price": {"default": "", "title": "New Price", "type": "string"}, "pct_label": {"default": "", "title": "Pct Label", "type": "string"}, "reason_label": {"default": "", "title": "Reason Label", "type": "string"}, "step_pct": {"default": 0, "title": "Step Pct", "type": "integer"}, "clamped": {"default": false, "title": "Clamped", "type": "boolean"}, "blocked_rule": {"default": "", "title": "Blocked Rule", "type": "string"}, "text_source": {"default": "", "title": "Text Source", "type": "string"}}, "required": ["status"], "title": "StageResult", "type": "object"}
