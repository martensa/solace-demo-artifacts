# mesh/connectors/gpos-wws-api.yaml
# Agent tools (spec 8.4): one compact JSON text content, no outputSchema. The
# manifest: block is generated from `python -m gposdemo.wws --dump-tools`.
kind: connector
name: gpos-wws-api
description: >-
  Read-only merchandise management API (Warenwirtschaft) of the fictional showcase
  store: article master data and price, sales against plan, stock, season.
spec:
  type: mcp
  subtype: remote
  values:
    server_url: http://gpos-wws.gpos-demo.svc:8773/mcp
    connection_type: streamable-http
    auth_type: none
    manifest:
      # GENERATED by scripts/gen_connector_manifest.py -- do not edit
      # source: python -m gposdemo.wws --dump-tools
      - name: "get_article"
        description: "Article master data, effective price, ref30, stock, margin."
        inputSchema: {"properties": {"article_number": {"description": "Article number, e.g. 100001.", "title": "Article Number", "type": "string"}, "ref": {"default": "", "description": "Review id of the caller (e.g. GR-270216-0007), shown on the monitor.", "title": "Ref", "type": "string"}}, "required": ["article_number"], "title": "get_articleArguments", "type": "object"}
      - name: "get_sales_performance"
        description: "Sales against plan and weeks of supply of one article."
        inputSchema: {"properties": {"article_number": {"description": "Article number, e.g. 100001.", "title": "Article Number", "type": "string"}, "ref": {"default": "", "description": "Review id of the caller (e.g. GR-270216-0007), shown on the monitor.", "title": "Ref", "type": "string"}}, "required": ["article_number"], "title": "get_sales_performanceArguments", "type": "object"}
      - name: "get_season_info"
        description: "Season status and leftover stock of one article."
        inputSchema: {"properties": {"article_number": {"description": "Article number, e.g. 100001.", "title": "Article Number", "type": "string"}, "ref": {"default": "", "description": "Review id of the caller (e.g. GR-270216-0007), shown on the monitor.", "title": "Ref", "type": "string"}}, "required": ["article_number"], "title": "get_season_infoArguments", "type": "object"}
