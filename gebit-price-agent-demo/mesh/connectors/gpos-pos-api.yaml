# mesh/connectors/gpos-pos-api.yaml
# Agent tools (spec 8.4): one compact JSON text content, no outputSchema. The
# manifest: block is generated from `python -m gposdemo.pos --dump-tools`.
kind: connector
name: gpos-pos-api
description: >-
  Read-only POS API of the booth till (GEBIT purchase simulator): one transaction
  with its lines and prices, till status.
spec:
  type: mcp
  subtype: remote
  values:
    server_url: http://gpos-pos.gpos-demo.svc:8771/mcp
    connection_type: streamable-http
    auth_type: none
    manifest:
      # GENERATED by scripts/gen_connector_manifest.py -- do not edit
      # source: python -m gposdemo.pos --dump-tools
      - name: "get_till_status"
        description: "Status of the booth till: open transaction, number and revenue of the transactions closed today."
        inputSchema: {"properties": {"ref": {"default": "", "description": "Review id (review_id) for the monitor.", "title": "Ref", "type": "string"}}, "title": "get_till_statusArguments", "type": "object"}
      - name: "get_transaction"
        description: "One POS transaction with lines, prices and membership."
        inputSchema: {"properties": {"tx_id": {"description": "Purchase transaction id (tx_id of the review input).", "title": "Tx Id", "type": "string"}, "ref": {"default": "", "description": "Review id (review_id) for the monitor.", "title": "Ref", "type": "string"}}, "required": ["tx_id"], "title": "get_transactionArguments", "type": "object"}
