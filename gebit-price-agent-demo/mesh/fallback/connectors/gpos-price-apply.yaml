# mesh/fallback/connectors/gpos-price-apply.yaml -- fallback F2 only (spec 9.9).
# UNGATED access to the gate service: the F2 workflow calls apply_price in a tool
# node after the store manager approved the gated time tool of
# gpos-price-approver-f2. The gate service checks every call against the stored
# proposal and, with GATE_GUARD=f2, requires a plausible approved_at (11.4).
# The manifest: block is generated from `python -m gposdemo.engine.gate
# --dump-tools` (make manifests, 8.5).
kind: connector
name: gpos-price-apply
description: >-
  Fallback F2 only: ungated apply_price of the EuroCIS price agent gate service,
  called by the F2 approval workflow after the store manager's approval.
spec:
  type: mcp
  subtype: remote
  values:
    server_url: http://gpos-gate.gpos-demo.svc:8766/mcp
    connection_type: streamable-http
    auth_type: none
    manifest:
      # GENERATED by scripts/gen_connector_manifest.py -- do not edit
      # source: python -m gposdemo.engine.gate --dump-tools
      - name: "apply_price"
        description: "Apply one staged price proposal (idempotent per proposal)."
        inputSchema: {"properties": {"proposal_id": {"description": "Proposal id, e.g. GP-270216-0003.", "title": "Proposal Id", "type": "string"}, "proposal_hash": {"description": "proposal_hash of check_proposal.", "title": "Proposal Hash", "type": "string"}, "article_name": {"description": "Article name, copied unchanged.", "title": "Article Name", "type": "string"}, "old_price": {"description": "Old price, e.g. 9,99.", "title": "Old Price", "type": "string"}, "new_price": {"description": "New price, e.g. 7,99.", "title": "New Price", "type": "string"}, "pct_label": {"description": "Reduction label, e.g. -20 %.", "title": "Pct Label", "type": "string"}, "reason_label": {"description": "Reason label, e.g. Ladenhüter.", "title": "Reason Label", "type": "string"}, "valid_to_label": {"description": "Validity, e.g. Di 23.02. 20:00.", "title": "Valid To Label", "type": "string"}, "run_id": {"default": "", "description": "Workflow run id of the approval.", "title": "Run Id", "type": "string"}, "approved_at": {"default": "", "description": "ISO time of the approval (fallback F2 only, else empty).", "title": "Approved At", "type": "string"}}, "required": ["proposal_id", "proposal_hash", "article_name", "old_price", "new_price", "pct_label", "reason_label", "valid_to_label"], "title": "apply_priceArguments", "type": "object"}
        outputSchema: {"properties": {"status": {"title": "Status", "type": "string"}, "proposal_id": {"title": "Proposal Id", "type": "string"}, "action_id": {"default": "", "title": "Action Id", "type": "string"}, "new_price": {"default": "", "title": "New Price", "type": "string"}, "message": {"default": "", "title": "Message", "type": "string"}}, "required": ["status", "proposal_id"], "title": "ApplyResult", "type": "object"}
