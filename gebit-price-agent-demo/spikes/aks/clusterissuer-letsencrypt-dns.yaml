# SKETCH -- Let's Encrypt via DNS-01 on an Azure DNS zone, cert-manager
# authenticated by workload identity (UAMI with "DNS Zone Contributor"
# on the zone; federated credential for
# system:serviceaccount:cert-manager:cert-manager; cert-manager Helm
# value podLabels: {azure.workload.identity/use: "true"}).
# DNS-01 works although every demo host resolves to a PRIVATE IP.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns-account
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: SUBSCRIPTION_ID
            resourceGroupName: RESOURCE_GROUP
            hostedZoneName: DEMO_DOMAIN
            environment: AzurePublicCloud
            managedIdentity:
              clientID: CERT_MANAGER_UAMI_CLIENT_ID
---
# Same solver against the staging endpoint for rebuild drills
# (production rate limits: 5 duplicate certificates per week).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns-staging-account
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: SUBSCRIPTION_ID
            resourceGroupName: RESOURCE_GROUP
            hostedZoneName: DEMO_DOMAIN
            environment: AzurePublicCloud
            managedIdentity:
              clientID: CERT_MANAGER_UAMI_CLIENT_ID
