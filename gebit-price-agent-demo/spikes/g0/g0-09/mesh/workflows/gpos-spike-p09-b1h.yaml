# G0-09 Part B, hardening variant: copy of gpos-spike-p09-b1 with the
# hardened agent gpos-spike-p09-approver-h and a hardened node instruction.
# Question: does the agent's tool approval reach marktleitung's SAM
# inbox and resume the run when the run was started by an event?
kind: workflow
name: gpos-spike-p09-b1h
description: >-
  Gate 0 spike G0-09 B1h (hardened prompt): approval through an agent node with a gated
  tool in an event-triggered run, notify_user after the approval.
spec:
  appConfig:
    version: "0.1.1"
    workflow_timeout: "15m"
    default_node_timeout: "10s"
    fail_fast: true
    skills:
      - id: gpos_spike_p09_b1h
        name: HIL spike B1
        description: Agent-node approval spike (Gate 0).
    input_schema:
      type: object
      properties:
        seq: {type: [string, "null"]}
        note: {type: [string, "null"]}
    tools:
      - tool_type: builtin-group
        group_name: notification_tools
    nodes:
      - id: apply
        type: agent
        agent_name: gpos-spike-p09-approver-h
        timeout: "12m"
        instruction: >-
          Call get_current_time once, as one single call, and never repeat
          it. After its first result call no further tool and immediately
          return status and time.
        input:
          seq: "{{workflow.input.seq}}"
        output_schema_override:
          type: object
          required: [status, time]
          properties:
            status: {type: string}
            time: {type: string}
      - id: tell
        type: tool
        tool_name: notify_user
        depends_on: [apply]
        when: "'{{apply.output.status}}' == 'applied'"
        timeout: "5s"
        input:
          title: "Spike G0-09 B1h: Preis aktiv"
          message: "Freigabe angewendet (seq {{workflow.input.seq}}, {{apply.output.time}})."
          channels: ["web"]
      - id: tell_fail
        type: tool
        tool_name: notify_user
        timeout: "5s"
        input:
          title: "Spike G0-09 B1h: Lauf beendet ohne Freigabe"
          message: "seq {{workflow.input.seq}}: {{workflow.error.message}}"
          channels: ["web"]
    on_exit:
      on_failure: tell_fail
    output_mapping:
      seq: "{{workflow.input.seq}}"
      status: "{{apply.output.status}}"
      time: "{{apply.output.time}}"
