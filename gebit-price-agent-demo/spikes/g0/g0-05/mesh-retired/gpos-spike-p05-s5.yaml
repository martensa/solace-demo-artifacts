# G0-05 S5 (fallback A2b): MCP tool load_photo returns ImageContent
# (stand-in for media.photo); describe_image reads the created artifact.
kind: workflow
name: gpos-spike-p05-s5
description: >-
  Gate 0 spike G0-05 S5: load_photo MCP tool node, then describe_image
  on the artifact the MCP image content created.
spec:
  appConfig:
    version: "0.1.0"
    workflow_timeout: "40s"
    default_node_timeout: "30s"
    fail_fast: true
    skills:
      - id: gpos_spike_p05_s5
        name: G0-05 S5
        description: load_photo then describe_image (Gate 0).
    input_schema:
      type: object
      required: [scan_id]
      properties:
        scan_id: {type: string}
    tools:
      - tool_type: builtin
        tool_name: describe_image
        tool_config:
          model: "openai/claude-haiku-4-5-20251001"
          api_base: "https://lite-llm.mymaas.net"
          api_key: "${P05_LLM_KEY}"
    nodes:
      - id: photo
        type: tool
        connector: gpos-spike-p05-photo
        tool: load_photo
        timeout: "15s"
        input:
          scan_id: "{{workflow.input.scan_id}}"
          run_id: "{{workflow.run_id}}"
      - id: read
        type: tool
        tool_name: describe_image
        depends_on: [photo]
        timeout: "30s"
        input:
          input_image: "{{photo.output.created_artifact}}"
          prompt: "Read the price tag or flyer. Answer only with JSON: {\"readable\": bool, \"product_text\": str, \"pack_size\": str, \"price_eur\": number, \"unit_price\": str, \"valid_text\": str, \"confidence\": number}. If the price is not clearly legible, set readable to false and price_eur to null."
    output_mapping:
      scan_id: "{{workflow.input.scan_id}}"
      variant: "s5"
      created_artifact: "{{photo.output.created_artifact}}"
      description: "{{read.output.description}}"
      image_filename: "{{read.output.image_filename}}"
