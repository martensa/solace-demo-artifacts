# Kyverno probe (kubectl apply --dry-run=server only): gRPC ingress
# WITHOUT ssl-redirect. Expected: denied by ingress-require-tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpos-g0-probe-no-redirect
  namespace: gpos-g0
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gpos-grpc.solace.lab
      secretName: gpos-g0-grpc-tls
  rules:
    - host: gpos-grpc.solace.lab
      http:
        paths:
          - path: /probe
            pathType: Prefix
            backend:
              service:
                name: gpos-g0-grpc
                port:
                  name: grpc
