# gpos-loyalty: Loyalty (showcase.loyalty.v1, gRPC 50052) and MCP gpos-loyalty-api on 8772.
# Shape of bsg-trading-desk-demo/k8s and G0-07, hardened (spec 12.4).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpos-loyalty
  labels:
    app: gpos-loyalty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpos-loyalty
  template:
    metadata:
      labels:
        app: gpos-loyalty
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: registry-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loyalty
          image: gpos-demo
          imagePullPolicy: Always
          command: ["python", "-m", "gposdemo.loyalty"]
          env:
            - name: GRPC_PORT
              value: "50052"
            - name: MCP_PORT
              value: "8772"
            - name: GPOS_DSN
              valueFrom:
                secretKeyRef:
                  name: gpos-db
                  key: DSN_LOYALTY
          envFrom:
            - configMapRef:
                name: gpos-config
            - secretRef:
                name: gpos-broker
          ports:
            - name: grpc
              containerPort: 50052
            - name: http
              containerPort: 8772
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gpos-loyalty
  labels:
    app: gpos-loyalty
spec:
  selector:
    app: gpos-loyalty
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
    - name: http
      port: 8772
      targetPort: http
