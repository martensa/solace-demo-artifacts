# Compatibility entry: `kubectl kustomize k8s` (UC1-BUILD-SPEC 12.4) renders the lab
# overlay, byte-identical to the render before the base/overlay split. Scripts render
# k8s/overlays/$TARGET (scripts/install.sh k8s); the AKS Postgres of the demo DB is
# k8s/postgres-aks (scripts/install.sh pg).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - overlays/lab
