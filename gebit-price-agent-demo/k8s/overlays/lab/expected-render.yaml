apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gpos-engine
    app.kubernetes.io/part-of: gpos-demo
  name: gpos-engine
  namespace: gpos-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpos-engine
  template:
    metadata:
      labels:
        app: gpos-engine
        app.kubernetes.io/part-of: gpos-demo
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - -m
        - gposdemo.engine
        env:
        - name: MCP_PORT
          value: "8765"
        - name: GPOS_DSN
          valueFrom:
            secretKeyRef:
              key: DSN_ENGINE
              name: gpos-db
        envFrom:
        - configMapRef:
            name: gpos-config
        - secretRef:
            name: gpos-broker
        image: registry.solace.lab/gpos-demo/gpos-demo:0.1.3
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        name: engine
        ports:
        - containerPort: 8765
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
        resources:
          limits:
            memory: 384Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      imagePullSecrets:
      - name: registry-pull-secret
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir:
          sizeLimit: 50Mi
        name: tmp
---
