apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/part-of: gpos-demo
  name: gpos-demo
  namespace: gpos-demo
spec:
  dnsNames:
  - gpos.solace.lab
  - gpos-grpc.solace.lab
  - gpos-wws-grpc.solace.lab
  - gpos-loyalty-grpc.solace.lab
  duration: 2160h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: solace-lab-ca-issuer
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 720h
  secretName: gpos-demo-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
    nginx.ingress.kubernetes.io/proxy-body-size: 4m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  labels:
    app.kubernetes.io/part-of: gpos-demo
  name: gpos-grpc
  namespace: gpos-demo
spec:
  ingressClassName: nginx
  rules:
  - host: gpos-grpc.solace.lab
    http:
      paths:
      - backend:
          service:
            name: gpos-pos
            port:
              name: grpc
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - gpos-grpc.solace.lab
    secretName: gpos-demo-tls
---
apiVersion: networking.k8s.io/v1
