# Expected `kubectl kustomize k8s/overlays/lab` (= `kubectl kustomize k8s` before the
# base/overlay split, 19.11.2026). Not a resource of any kustomization:
# scripts/tests/test_k8s.py compares the live render with this file (comment lines
# stripped; the image tag follows newTag of overlays/lab), so any other lab change is
# a visible diff. Refresh only for an intended lab change, in gebit-price-agent-demo:
#   F=k8s/overlays/lab/expected-render.yaml
#   (sed -n '/^#/p' $F; kubectl kustomize k8s/overlays/lab) > $F.new && mv $F.new $F
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: gpos-demo
  name: gpos-demo
---
apiVersion: v1
data:
  CLOSE_MAX_AGE_SECONDS: "300"
  DATA_DIR: /app/data
  ENGINE_URL: http://gpos-engine:8765
  GATE_GUARD: block
  GATE_MIN_DELAY_S: "3"
  GEBIT_DESCRIPTOR_SETS: /descriptors/purchase-api-2.50.0.pb:/descriptors/receipt-api-2.13.0.pb
  GPOS_BOOTH_LOCATION: Root.DE.999.101.01
  GPOS_BUS: solace
  GPOS_COMPANY: "999"
  GPOS_COUNTRY: DE
  GPOS_DELIVERY: direct
  GPOS_DEMO_DATE: "2027-02-16"
  GPOS_PROBE_LOCATION: Root.DE.999.199.98
  GPOS_TEST_LOCATION: Root.DE.999.199.99
  GPOS_TOOL_STORE: "101"
  GPOS_TZ: Europe/Berlin
  LOG_LEVEL: INFO
  LOYALTY_GRPC: gpos-loyalty:50052
  POLICY_FILE: /app/policy/pricing-policy.yaml
  POS_ADMIN_URL: http://gpos-pos:8771
  POS_GRPC: gpos-pos:50051
  PROPOSAL_EXPIRY_SECONDS: "150"
  SAM_URL: https://sam.solace.lab
  SHOWCASE_DESCRIPTOR_SET: /app/descriptors/showcase.pb
  STALE_SECONDS: "20"
  WWS_GRPC: gpos-wws:50053
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: gpos-demo
  name: gpos-config
  namespace: gpos-demo
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gpos-engine
    app.kubernetes.io/part-of: gpos-demo
  name: gpos-engine
  namespace: gpos-demo
spec:
  ports:
  - name: http
    port: 8765
    targetPort: http
  selector:
    app: gpos-engine
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gpos-gate
    app.kubernetes.io/part-of: gpos-demo
  name: gpos-gate
  namespace: gpos-demo
spec:
  ports:
  - name: http
    port: 8766
    targetPort: http
  selector:
    app: gpos-gate
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gpos-loyalty
    app.kubernetes.io/part-of: gpos-demo
  name: gpos-loyalty
  namespace: gpos-demo
spec:
  ports:
  - appProtocol: kubernetes.io/h2c
    name: grpc
    port: 50052
    targetPort: grpc
  - name: http
    port: 8772
    targetPort: http
  selector:
    app: gpos-loyalty
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gpos-pos
    app.kubernetes.io/part-of: gpos-demo
