  rules:
    - host: eurocis-showcase.germanywestcentral.cloudapp.azure.com
      http:
        paths:
          - path: /grpc.reflection.v1.ServerReflection/
            pathType: Prefix
            backend:
              service:
                name: gpos-pos
                port:
                  name: grpc
          - path: /grpc.reflection.v1alpha.ServerReflection/
            pathType: Prefix
            backend:
              service:
                name: gpos-pos
                port:
                  name: grpc
