---
# GET /api/events (SSE, spec 10.2): never buffered in either direction, long reads
# (heartbeat every 15 s), 10 concurrent connections per IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpos-ui-events
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/limit-connections: "10"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - eurocis-showcase.germanywestcentral.cloudapp.azure.com
  rules:
    - host: eurocis-showcase.germanywestcentral.cloudapp.azure.com
      http:
        paths:
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: gpos-ui
                port:
                  name: http
