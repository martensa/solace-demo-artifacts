data:
  sam-bsg-trading-desk.json: "{\n \"uid\": \"sam-bsg-trading-desk\",\n \"title\": \"BSG Trading Desk Demo\",\n \"tags\": [\n  \"sam\",\n  \"bsg\",\n  \"trading-desk\"\n ],\n \"schemaVersion\": 39,\n \"editable\": true,\n \"refresh\": \"10s\",\n \"time\": {\n  \"from\": \"now-15m\",\n  \"to\": \"now\"\n },\n \"timezone\": \"browser\",\n \"templating\": {\n  \"list\": [\n   {\n    \"name\": \"ep\",\n    \"label\": \"Entrypoint\",\n    \"type\": \"query\",\n    \"datasource\": {\n     \"type\": \"postgres\",\n     \"uid\": \"sam-platform-db\"\n    },\n    \"refresh\": 1,\n    \"query\": \"SELECT DISTINCT entrypoint_id FROM tasks WHERE initial_request_text LIKE '%watcher_api%' AND entrypoint_id IS NOT NULL\",\n    \"current\": {},\n    \"options\": [],\n    \"includeAll\": false,\n    \"multi\": false,\n    \"hide\": 0\n   }\n  ]\n },\n \"panels\": [\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"transparent\": true,\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 24,\n    \"h\": 3\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"## BSG Trading Desk Assistant -- ein Lauf im Detail\\n**Alert -> Workflow -> Desk-Note.** Die deterministischen Schritte (`Alert anreichern`, `Desk-Note publizieren`) sind Tool-Knoten ohne Modell und tauchen hier nicht als Kosten auf; bezahlt werden nur die vier Agenten. Zeitraum oben rechts auf *Last 15 minutes* stellen.\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Letzter Lauf: Alert bis Desk-Note\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 3,\n    \"w\": 5,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT (t.end_time - t.start_time)/1000.0 AS \\\"Sekunden\\\"\\nFROM tasks t WHERE t.id = (SELECT id FROM tasks\\n     WHERE entrypoint_id = '$ep' AND handler_type = 'workflow'\\n           AND parent_task_id IS NULL\\n     ORDER BY start_time DESC LIMIT 1)\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"textMode\": \"auto\",\n    \"colorMode\": \"value\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\",\n     \"decimals\": 1,\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       },\n       {\n        \"color\": \"yellow\",\n        \"value\": 45\n       },\n       {\n        \"color\": \"red\",\n        \"value\": 60\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Tokens im letzten Lauf\",\n   \"gridPos\": {\n    \"x\": 5,\n    \"y\": 3,\n    \"w\": 5,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT sum(coalesce(t.total_input_tokens,0)\\n          + coalesce(t.total_output_tokens,0)) AS \\\"Tokens\\\"\\nFROM tasks t WHERE t.parent_task_id = (SELECT id FROM tasks\\n     WHERE entrypoint_id = '$ep' AND handler_type = 'workflow'\\n           AND parent_task_id IS NULL\\n     ORDER BY start_time DESC LIMIT 1)\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"textMode\": \"auto\",\n    \"colorMode\": \"value\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"decimals\": 0,\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"text\",\n        \"value\": null\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Laeufe im Zeitraum\",\n   \"gridPos\": {\n    \"x\": 10,\n    \"y\": 3,\n    \"w\": 4,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT count(*) AS \\\"Laeufe\\\" FROM tasks t\\nWHERE t.entrypoint_id = '$ep' AND t.handler_type = 'workflow'\\n  AND t.parent_task_id IS NULL AND to_timestamp(t.start_time/1000.0) BETWEEN $__timeFrom() AND $__timeTo()\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"textMode\": \"auto\",\n    \"colorMode\": \"value\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"decimals\": 0,\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"text\",\n        \"value\": null\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Fehlgeschlagen\",\n   \"gridPos\": {\n    \"x\": 14,\n    \"y\": 3,\n    \"w\": 4,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT count(*) AS \\\"Fehler\\\" FROM tasks t\\nWHERE t.entrypoint_id = '$ep' AND t.handler_type = 'workflow' AND t.parent_task_id IS NULL\\n  AND t.status <> 'completed' AND to_timestamp(t.start_time/1000.0) BETWEEN $__timeFrom() AND $__timeTo()\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"textMode\": \"auto\",\n    \"colorMode\": \"value\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"decimals\": 0,\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       },\n       {\n        \"color\": \"red\",\n        \"value\": 1\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Zweig des letzten Laufs\",\n   \"gridPos\": {\n    \"x\": 18,\n    \"y\": 3,\n    \"w\": 6,\n    \"h\": 5\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT CASE\\n         WHEN bool_or(t.initial_request_text LIKE 'Zweig marktweit%')\\n           THEN 'marktweit'\\n         WHEN bool_or(t.initial_request_text LIKE 'Zweig emittentenspez%')\\n           THEN 'emittentenspezifisch'\\n         ELSE '-' END AS \\\"Zweig\\\"\\nFROM tasks t WHERE t.parent_task_id = (SELECT id FROM tasks\\n     WHERE entrypoint_id = '$ep' AND handler_type = 'workflow'\\n           AND parent_task_id IS NULL\\n     ORDER BY start_time DESC LIMIT 1)\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"textMode\": \"auto\",\n    \"colorMode\": \"value\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"text\",\n        \"value\": null\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"transparent\": true,\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 8,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### Der letzte Lauf, Knoten fuer Knoten\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"table\",\n   \"title\": \"Knoten des letzten Laufs\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 10,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT\\n  CASE\\n    WHEN t.handler_type = 'workflow' THEN 'Workflow-Lauf'\\n    WHEN t.initial_request_text LIKE 'Compare the alerting issuer%' THEN '2 bsg-quote-analyst'\\n    WHEN t.initial_request_text LIKE 'Decide from the reference prices%' THEN '3 bsg-market-context'\\n    WHEN t.initial_request_text LIKE 'Zweig emittentenspezifisch%' THEN '5 bsg-desk-communicator'\\n    WHEN t.initial_request_text LIKE 'Zweig marktweit%' THEN '5 bsg-desk-communicator'\\n    WHEN t.initial_request_text LIKE 'Auftrag eines QLP%' THEN '1 bsg-desk-assistant'\\n    ELSE coalesce(t.handler_name, '?')\\n  END AS \\\"Knoten\\\",\\n  round((t.end_time - t.start_time)/1000.0, 1) AS \\\"Sekunden\\\",\\n  t.total_input_tokens AS \\\"Input-Tokens\\\",\\n  t.total_output_tokens AS \\\"Output-Tokens\\\",\\n  t.status AS \\\"Status\\\"\\nFROM tasks t\\nWHERE t.parent_task_id = (SELECT id FROM tasks\\n     WHERE entrypoint_id = '$ep' AND handler_type = 'workflow'\\n           AND parent_task_id IS NULL\\n     ORDER BY start_time DESC LIMIT 1)\\nORDER BY t.start_time\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\"\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"barchart\",\n   \"title\": \"Dauer je Knoten (letzter Lauf)\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 10,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT\\n  CASE\\n    WHEN t.handler_type = 'workflow' THEN 'Workflow-Lauf'\\n    WHEN t.initial_request_text LIKE 'Compare the alerting issuer%' THEN '2 bsg-quote-analyst'\\n    WHEN t.initial_request_text LIKE 'Decide from the reference prices%' THEN '3 bsg-market-context'\\n    WHEN t.initial_request_text LIKE 'Zweig emittentenspezifisch%' THEN '5 bsg-desk-communicator'\\n    WHEN t.initial_request_text LIKE 'Zweig marktweit%' THEN '5 bsg-desk-communicator'\\n    WHEN t.initial_request_text LIKE 'Auftrag eines QLP%' THEN '1 bsg-desk-assistant'\\n    ELSE coalesce(t.handler_name, '?')\\n  END AS \\\"Knoten\\\",\\n  (t.end_time - t.start_time)/1000.0 AS \\\"Sekunden\\\"\\nFROM tasks t\\nWHERE t.parent_task_id = (SELECT id FROM tasks\\n     WHERE entrypoint_id = '$ep' AND handler_type = 'workflow'\\n           AND parent_task_id IS NULL\\n     ORDER BY start_time DESC LIMIT 1)\\nORDER BY t.start_time\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"xField\": \"Knoten\",\n    \"orientation\": \"horizontal\",\n    \"showValue\": \"always\",\n    \"legend\": {\n     \"showLegend\": false,\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\"\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\",\n     \"decimals\": 1,\n     \"color\": {\n      \"mode\": \"palette-classic\"\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"transparent\": true,\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 18,\n    \"w\": 24,\n    \"h\": 2\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### Alle Laeufe im Zeitraum\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"table\",\n   \"title\": \"Laeufe\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 20,\n    \"w\": 14,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT\\n  to_timestamp(t.start_time/1000.0) AS \\\"Start\\\",\\n  round((t.end_time - t.start_time)/1000.0, 1) AS \\\"Sekunden\\\",\\n  t.status AS \\\"Status\\\",\\n  (SELECT CASE\\n     WHEN bool_or(c.initial_request_text LIKE 'Zweig marktweit%') THEN 'marktweit'\\n     WHEN bool_or(c.initial_request_text LIKE 'Zweig emittentenspez%')\\n       THEN 'emittentenspezifisch'\\n     ELSE '-' END\\n   FROM tasks c WHERE c.parent_task_id = t.id) AS \\\"Zweig\\\",\\n  (SELECT sum(coalesce(c.total_input_tokens,0) + coalesce(c.total_output_tokens,0))\\n   FROM tasks c WHERE c.parent_task_id = t.id) AS \\\"Tokens\\\",\\n  coalesce(t.error_message, '') AS \\\"Fehler\\\"\\nFROM tasks t\\nWHERE t.entrypoint_id = '$ep' AND t.handler_type = 'workflow' AND t.parent_task_id IS NULL\\n  AND to_timestamp(t.start_time/1000.0) BETWEEN $__timeFrom() AND $__timeTo()\\nORDER BY t.start_time DESC\\nLIMIT 20\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\"\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"table\",\n   \"title\": \"Tokens je Agent (Zeitraum)\",\n   \"gridPos\": {\n    \"x\": 14,\n    \"y\": 20,\n    \"w\": 10,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"postgres\",\n      \"uid\": \"sam-platform-db\"\n     },\n     \"rawSql\": \"SELECT\\n  CASE\\n    WHEN t.handler_type = 'workflow' THEN 'Workflow-Lauf'\\n    WHEN t.initial_request_text LIKE 'Compare the alerting issuer%' THEN '2 bsg-quote-analyst'\\n    WHEN t.initial_request_text LIKE 'Decide from the reference prices%' THEN '3 bsg-market-context'\\n    WHEN t.initial_request_text LIKE 'Zweig emittentenspezifisch%' THEN '5 bsg-desk-communicator'\\n    WHEN t.initial_request_text LIKE 'Zweig marktweit%' THEN '5 bsg-desk-communicator'\\n    WHEN t.initial_request_text LIKE 'Auftrag eines QLP%' THEN '1 bsg-desk-assistant'\\n    ELSE coalesce(t.handler_name, '?')\\n  END AS \\\"Agent\\\",\\n  count(*) AS \\\"Aufrufe\\\",\\n  sum(coalesce(t.total_input_tokens,0)) AS \\\"Input\\\",\\n  sum(coalesce(t.total_output_tokens,0)) AS \\\"Output\\\",\\n  round(avg((t.end_time - t.start_time)/1000.0), 1) AS \\\"Sekunden (Mittel)\\\"\\nFROM tasks t\\nWHERE t.entrypoint_id = '$ep' AND t.handler_type = 'agent' AND t.end_time IS NOT NULL AND to_timestamp(t.start_time/1000.0) BETWEEN $__timeFrom() AND $__timeTo()\\nGROUP BY 1 ORDER BY 1\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"refId\": \"A\"\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\"\n     }\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"type\": \"text\",\n   \"title\": \"\",\n   \"transparent\": true,\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 28,\n    \"w\": 24,\n    \"h\": 3\n   },\n   \"options\": {\n    \"mode\": \"markdown\",\n    \"content\": \"### Der Beleg\\n**SAM Activities**: `https://sam.solace.lab` -> Activities -> den Lauf oeffnen -> *Performance* zeigt dieselben Knoten als Gantt. **Tempo**: Explore -> Tempo -> `sam-solace-lab/a2a` fuer die Broker-Spans jedes A2A-Hops. **Loki**: `{namespace=\\\"sam-solace-lab\\\"}` mit der traceID aus Activities.\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  }\n ]\n}"

