# MCP connector to the deterministic tools of the demo
# (app/bsgdemo/tools_server.py, Deployment bsg-tools in bsg-demo).
#
# The `manifest:` below is NOT decoration. SAM 2.493.0 refuses a
# workflow whose tool node names a tool the connector has no stored
# list for, and `sam config apply` never triggers live discovery: a
# connector created or updated that way keeps an empty list, and the
# workflow create fails with "has no stored tool list". Discovery does
# happen per agent registration -- bsg-desk-assistant shows
# toolCount 6 -- but the workflow check reads the connector, not the
# registration. With a manifest the connector skips discovery and
# registers exactly these tools, which also makes the apply independent
# of whether the MCP server happened to be reachable at save time.
#
# The `outputSchema` entries are the contract the workflow reads: a
# connector-backed MCP tool's structured result is addressed as
# {{<node>.output.mcp_structured_content.<field>}}, and only the
# top-level properties declared here are verified.
#
# Regenerate after any change to a tool's name or signature, with the
# MCP server reachable (make port-forward):
#   python scripts/gen_connector_manifest.py
#
# Gate 0 measured the path: workflows run in the `awe` pod,
# cross-namespace DNS resolves and sam-solace-lab has no NetworkPolicy,
# so bsg-tools.bsg-demo.svc:8765 is reachable.
kind: connector
name: bsg-desk-tools
description: >-
  Deterministic tools of the BSG trading desk demo: create, list and
  stop watches on the live quote feed, enrich an alert with the last
  15 minutes of quotes, reference prices and news, and publish the
  desk note onto the mesh.
spec:
  type: mcp
  subtype: remote
  values:
    server_url: http://bsg-tools.bsg-demo.svc:8765/mcp
    connection_type: streamable-http
    auth_type: none
    manifest:
      - name: "enrich_alert"
        description: "Workflow step 'Alert anreichern': fetch the last 15 minutes of quotes (alerting issuer plus the two peers as comparison), the reference prices and the news from the watcher, and return a compact summary with deterministic spread / reference statistics -- including the mean spread of every issuer over exactly the seconds the alert's condition has held, which is the number that separates an issuer specific anomaly from a market wide one. A workflow tool node passes the single fields; a caller holding the whole payload passes `alert` instead."
        inputSchema: {"properties": {"alert": {"default": "", "description": "The whole alert payload as JSON. Give this OR the single fields below.", "title": "Alert", "type": "string"}, "watch_id": {"default": "", "description": "watch_id of the alert.", "title": "Watch Id", "type": "string"}, "issuer": {"default": "", "description": "Issuer of the alert (alpha, beta, gamma).", "title": "Issuer", "type": "string"}, "product_class": {"default": "", "description": "Product class of the alert, or * for all.", "title": "Product Class", "type": "string"}, "condition_since_ms": {"default": 0, "description": "Epoch ms at which the alert's condition started.", "title": "Condition Since Ms", "type": "integer"}, "alert_id": {"default": "", "description": "alert_id of the alert.", "title": "Alert Id", "type": "string"}, "underlying": {"default": "", "description": "Underlying of the alert, optional.", "title": "Underlying", "type": "string"}, "observed_value": {"default": 0.0, "description": "Observed metric value, optional.", "title": "Observed Value", "type": "number"}, "detail": {"default": false, "description": "Also describe the data sets and echo the alert. Leave false in a workflow: a response over 2048 bytes is stored as an artifact and its fields stop resolving.", "title": "Detail", "type": "boolean"}}, "type": "object", "title": "enrich_alertArguments"}
        outputSchema: {"properties": {"watch_id": {"default": "", "title": "Watch Id", "type": "string"}, "issuer": {"default": "", "title": "Issuer", "type": "string"}, "peer_issuers": {"items": {"type": "string"}, "title": "Peer Issuers", "type": "array"}, "primary_underlying": {"default": "", "title": "Primary Underlying", "type": "string"}, "window_minutes": {"default": 0.0, "title": "Window Minutes", "type": "number"}, "statistics": {"additionalProperties": true, "title": "Statistics", "type": "object"}, "alert": {"anyOf": [{"additionalProperties": true, "type": "object"}, {"type": "null"}], "default": null, "title": "Alert"}, "affected_products": {"anyOf": [{"items": {}, "type": "array"}, {"type": "null"}], "default": null, "title": "Affected Products"}, "datasets": {"anyOf": [{"additionalProperties": true, "type": "object"}, {"type": "null"}], "default": null, "title": "Datasets"}, "attachments": {"anyOf": [{"items": {}, "type": "array"}, {"type": "null"}], "default": null, "title": "Attachments"}, "error": {"anyOf": [{"type": "string"}, {"type": "null"}], "default": null, "title": "Error"}, "hint": {"anyOf": [{"type": "string"}, {"type": "null"}], "default": null, "title": "Hint"}}, "type": "object", "description": "Result of enrich_alert.

It is a model, not a plain dict, on purpose: the MCP SDK only emits
an output schema and `structured_content` for a tool whose return
type is a model. Without that, SAM's workflow sees the raw envelope
(`mcp_tool_output`, `message_to_llm`, `status`) and no field of the
response resolves -- the consuming node then fails with
\"field ... not found in node output; that value has 3 fields\".", "title": "EnrichResult"}
      - name: "list_watches"
        description: "List the active watches (id, topic filter, condition, alerts sent)."
        inputSchema: {"properties": {}, "type": "object", "title": "list_watchesArguments"}
        outputSchema: {"properties": {"result": {"title": "Result", "type": "string"}}, "required": ["result"], "type": "object", "title": "list_watchesOutput"}
      - name: "publish_desk_note"
        description: "Workflow step 'Desk-Note publizieren': publish the final desk note on bsg/desk/notes/{watch_id} for the trading desk UI."
        inputSchema: {"properties": {"watch_id": {"description": "watch_id of the alert.", "title": "Watch Id", "type": "string"}, "note": {"description": "The desk note (German, max. 8 lines).", "title": "Note", "type": "string"}, "branch": {"description": "Branch taken: issuer_specific or market_wide.", "title": "Branch", "type": "string"}, "issuer": {"default": "", "description": "Issuer of the alert.", "title": "Issuer", "type": "string"}, "alert_id": {"default": "", "description": "alert_id of the alert.", "title": "Alert Id", "type": "string"}, "chart_ref": {"default": "", "description": "Artifact name or URI of the chart.", "title": "Chart Ref", "type": "string"}, "workflow_run_id": {"default": "", "description": "Workflow run / task id.", "title": "Workflow Run Id", "type": "string"}}, "required": ["watch_id", "note", "branch"], "type": "object", "title": "publish_desk_noteArguments"}
        outputSchema: {"properties": {"status": {"default": "", "title": "Status", "type": "string"}, "topic": {"default": "", "title": "Topic", "type": "string"}, "lines": {"default": 0, "title": "Lines", "type": "integer"}, "error": {"anyOf": [{"type": "string"}, {"type": "null"}], "default": null, "title": "Error"}}, "type": "object", "description": "Result of publish_desk_note -- a model for the same reason.", "title": "PublishResult"}
      - name: "report_progress"
        description: "Publish a progress event for the trading desk UI."
        inputSchema: {"properties": {"watch_id": {"description": "watch_id of the alert.", "title": "Watch Id", "type": "string"}, "node": {"description": "Workflow node id.", "title": "Node", "type": "string"}, "phase": {"description": "started, finished or failed.", "title": "Phase", "type": "string"}, "detail": {"default": "", "description": "Optional short detail.", "title": "Detail", "type": "string"}}, "required": ["watch_id", "node", "phase"], "type": "object", "title": "report_progressArguments"}
        outputSchema: {"properties": {"result": {"title": "Result", "type": "string"}}, "required": ["result"], "type": "object", "title": "report_progressOutput"}
      - name: "stop_watch"
        description: "Stop one watch by id."
        inputSchema: {"properties": {"watch_id": {"description": "The watch id, e.g. w-1a2b3c.", "title": "Watch Id", "type": "string"}}, "required": ["watch_id"], "type": "object", "title": "stop_watchArguments"}
        outputSchema: {"properties": {"result": {"title": "Result", "type": "string"}}, "required": ["result"], "type": "object", "title": "stop_watchOutput"}
      - name: "watch_feed"
        description: "Create a deterministic watch on the live quote feed. The watcher publishes exactly one alert on bsg/alerts/{watch_id} when the condition holds for hold_seconds. Returns watch_id, topic filter and the normalised condition -- confirm all three to the trader."
        inputSchema: {"properties": {"issuer": {"description": "Issuer: alpha, beta or gamma (fictional).", "title": "Issuer", "type": "string"}, "product_class": {"description": "Product class: dax-turbo, nasdaq-knockout, discount-cert, or * for all.", "title": "Product Class", "type": "string"}, "metric": {"description": "spread_pct (percent), quote_age_s (seconds without a quote) or drift_vs_ref_pct (percent).", "title": "Metric", "type": "string"}, "op": {"description": "Comparison: >, >=, < or <=.", "title": "Op", "type": "string"}, "threshold": {"description": "Threshold in the unit of the metric, e.g. 0.5 for 0.5 % spread.", "title": "Threshold", "type": "number"}, "hold_seconds": {"description": "How long the condition must hold continuously before one alert fires.", "title": "Hold Seconds", "type": "number"}, "ttl_minutes": {"default": 30, "description": "Lifetime of the watch in minutes.", "title": "Ttl Minutes", "type": "number"}}, "required": ["issuer", "product_class", "metric", "op", "threshold", "hold_seconds"], "type": "object", "title": "watch_feedArguments"}
        outputSchema: {"properties": {"result": {"title": "Result", "type": "string"}}, "required": ["result"], "type": "object", "title": "watch_feedOutput"}
