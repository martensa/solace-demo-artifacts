kind: manifest
name: bsg-trading-desk-demo
description: >-
  BSG trading desk demo: deterministic MCP tools, four desk agents
  plus the alert runner, and the bsg-alert-triage workflow.
target:
  name: solace-lab
  url: https://sam.solace.lab
  auth:
    type: oauth
resources:
  connectors:
    - bsg-desk-tools
  agents:
    - bsg-desk-assistant
    - bsg-alert-runner
    - bsg-quote-analyst
    - bsg-market-context
    - bsg-desk-communicator
  workflows:
    - bsg-alert-triage
