# Written against the SAM 2.493.0 schema Gate 0 established (README
# "Gate 0"), not the 2.348.22 shape of the other demos in this repo.
#
# Apply order (scripts/install.sh):
#   1. the Kubernetes part, so the MCP server bsg-tools is reachable --
#      a platform MCP connector stores its tool list only when it is
#      saved against a live server, and a workflow node naming a tool
#      outside that list is refused.
#   2. this manifest: connector, agents, workflow
#   3. entrypoints/ rendered from the template, once the workflow
#      exists (the rendering also covers the broker credentials)
kind: manifest
name: bsg-trading-desk-demo
description: >-
  BSG trading desk demo: the deterministic MCP tools, the four desk
  agents and the bsg-alert-triage workflow.
target:
  name: solace-lab
  url: https://sam.solace.lab
  auth:
    type: oauth
resources:
  connectors:
    - bsg-desk-tools
  agents:
    - bsg-desk-assistant
    - bsg-quote-analyst
    - bsg-market-context
    - bsg-desk-communicator
  workflows:
    - bsg-alert-triage
