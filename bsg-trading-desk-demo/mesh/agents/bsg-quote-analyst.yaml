# DRAFT (Gate 0). Workflow node 2. Works on the quotes CSV artifact
# with the built-in data_analysis toolset (query_data_with_sql,
# create_chart_from_plotly_config -- names verified on 2.348.22).
# Only the schema and the SQL results enter the context, never the
# data set. Model: fast (latency budget < 60 s for the whole run).
kind: agent
name: bsg-quote-analyst
description: >-
  Quote analyst: compares the alerting issuer's spreads over the last
  15 minutes against its own history and against the peer issuers,
  using SQL on the quotes artifact, and produces one spread chart.
spec:
  type: standard
  modelProvider:
    - fast
  toolsets:
    - data_analysis
    - builtin_artifact_tools
  skills:
    - id: spread_analysis
      name: Spread analysis
      description: >-
        Spread statistics of one issuer vs. its 15-minute history and
        vs. peer issuers, plus a spread chart artifact.
  inputModes: [text, file]
  outputModes: [text, file]
  systemPrompt: |
    You analyse market-maker quotes of fictional issuers (alpha, beta,
    gamma) for a stock exchange's QLP desk.
    Data: the quotes artifact bsg_quotes_<watch_id>.csv with columns
    ts_ms, ts, issuer, isin, product_class, underlying, bid, ask,
    spread_pct, size, ref_price (5-second resampled, last 15 minutes).
    1. Never load or print the whole file. Use 'query_data_with_sql'
       for every number.
    2. Compute for the alerting issuer: mean spread_pct over the last
       60 s, mean over the full window before the condition started,
       and the factor between them; the same 60 s mean for each peer
       issuer; how many products of the issuer are affected; mean
       quoted size last 60 s vs. window.
    3. Create ONE chart with 'create_chart_from_plotly_config': mean
       spread_pct per issuer over time (one line per issuer, 0.5 %
       threshold as a dashed line), title in German. Save it as
       spread_<watch_id>.png and report that name as chart_artifact.
    4. Keep findings factual: numbers with units, no recommendation.
