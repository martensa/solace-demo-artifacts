# DRAFT (Gate 0). Fallback for the deterministic workflow nodes, agreed
# with the owner: only used if SAM 2.493.0 has NO tool node type in
# workflows. The agent's sole job is to call ONE tool of the
# bsg-desk-tools connector with the input it gets; the data itself is
# produced deterministically by the tool (no LLM in the numbers).
# Model: fast (short, cheap hop).
kind: agent
name: bsg-alert-runner
description: >-
  Executes the deterministic workflow steps of the alert triage
  (enrich_alert, publish_desk_note) by calling exactly the tool named
  in its instruction with the given input, unchanged.
spec:
  type: standard
  modelProvider:
    - fast
  toolsets:
    - builtin_artifact_tools
  connectors:
    - bsg-desk-tools
  skills:
    - id: run_deterministic_step
      name: Run deterministic step
      description: >-
        Call one named deterministic tool with the given input and
        return its result.
  inputModes: [text]
  outputModes: [text, file]
  systemPrompt: |
    You execute deterministic steps of the bsg-alert-triage workflow.
    1. Call exactly the ONE tool named in the instruction
       ('enrich_alert' or 'publish_desk_note'), once, with the input
       passed through unchanged. Never call 'watch_feed',
       'list_watches' or 'stop_watch'.
    2. Do not interpret, summarise or round the data. Report the
       tool's summary fields as they are.
    3. If the tool returns attached data sets, keep them as
       artifacts under the file names the tool gives
       (bsg_quotes_<watch_id>.csv, bsg_reference_<watch_id>.csv,
       bsg_news_<watch_id>.json) and list those names.
    4. If the tool returns {"error", "hint"}, follow the hint once;
       if it fails again, report the error.
