# bsg-alert-triage: one run per alert from bsg/alerts/{watch_id}, started
# by the event-mesh entrypoint bsg-desk-events.
#
#   enrich (tool, deterministic)
#     -> analyst  (agent)  \
#     -> context  (agent)  /  run in parallel
#     -> route (switch on context.scope)
#          issuer_specific -> communicator_issuer \
#          market_wide     -> communicator_market /
#     -> publish (tool, deterministic)
#
# Written against SAM 2.493.0, whose schema Gate 0 established
# (`sam config schema show workflow --type <node-type>`, `sam docs`,
# `sam ai-assistance skill install`). What that changed against the
# 2.348.22 shape the other demos in this repo use:
#
# - The deterministic steps are `type: tool` nodes on the MCP connector
#   bsg-desk-tools, so no model sits in them at all. A node-level
#   `connector:` is the only way to reach a connector from the store.
# - The branch is `type: switch` with `cases: [{condition, node}]`; every
#   target must list the switch in its `depends_on`, and the two branches
#   converge through `coalesce`.
# - Node-level schemas are `output_schema_override`. A node written with
#   plain `output_schema:` declares NOTHING: the switch case would never
#   match and would fall through to `default`, and `output_mapping` would
#   return the literal `{{...}}` text. 2.493.0 also wants the keys named
#   in the instruction, the opposite of the 2.348.22 rule.
# - With this `input_schema` the entrypoint delivers the alert as
#   addressable fields (`workflow.input.<field>`), not as
#   `{"text": "<json>"}`, so every node reads what it needs by name.
# - Nothing depends on an artifact coming out of the MCP tool call:
#   whether SAM turns an MCP response's embedded resources into named
#   artifacts is unverified, so the numbers travel as structured data and
#   the 15-minute series stays in the demo UI's own chart.
# - A connector-backed MCP tool's result is read as
#   `{{<node>.output.mcp_structured_content.<field>}}`, and only when
#   the tool actually returns structured content. The MCP SDK emits it
#   solely for a tool whose return type is a model -- with a plain
#   `dict` the node output is the bare envelope
#   (`mcp_tool_output`, `message_to_llm`, `status`), which is the
#   "that value has 3 fields" failure. Both tools therefore return
#   Pydantic models, and the connector's manifest carries the
#   outputSchema the server advertises. Measured on 2.493.0.
kind: workflow
name: bsg-alert-triage
description: >-
  Alert triage for the QLP desk: enriches a quote alert with the last
  15 minutes of quotes, reference prices and news, analyses the
  spreads, decides issuer specific vs. market wide, branches, writes
  the German desk note and publishes it onto the mesh.
spec:
  appConfig:
    version: "1.0.2"
    description: >-
      From a quote alert to a desk note in under 60 seconds: enrich,
      analyse, classify, branch, write, publish.
    workflow_timeout: "90s"
    default_node_timeout: "40s"
    fail_fast: true
    skills:
      - id: bsg_alert_triage
        name: BSG alert triage
        description: >-
          Triage one quote alert of the BSG demo feed into a desk note
          (issuer specific or market wide).
    # Every field the watcher puts on an alert, so the payload is read
    # as fields. No `text` property on purpose: declaring one would let
    # the payload fall back to the wrapped form.
    input_schema:
      type: object
      required: [watch_id, issuer]
      properties:
        alert_id: {type: string}
        watch_id: {type: string}
        watch: {type: object}
        issuer: {type: string}
        isin: {type: string}
        product_class: {type: string}
        underlying: {type: string}
        metric: {type: string}
        op: {type: string}
        threshold: {type: number}
        observed_value: {type: number}
        held_seconds: {type: number}
        condition_since_ms: {type: integer}
        triggered_ms: {type: integer}
        triggered_at: {type: string}
        affected_products: {type: array}
        peer_issuers: {type: array}
        issuer_status: {type: [string, "null"]}
        live_reference: {type: [number, "null"]}
        watcher_api: {type: string}
    output_schema:
      type: object
      required: [branch, note]
      properties:
        branch: {type: string}
        note: {type: string}
        chart_artifact: {type: string}
    nodes:
      # (1) Alert anreichern -- deterministic, no model.
      - id: enrich
        type: tool
        connector: bsg-desk-tools
        tool: enrich_alert
        timeout: "20s"
        input:
          watch_id: "{{workflow.input.watch_id}}"
          issuer: "{{workflow.input.issuer}}"
          product_class: "{{workflow.input.product_class}}"
          condition_since_ms: "{{workflow.input.condition_since_ms}}"
          alert_id: "{{workflow.input.alert_id}}"
          underlying: "{{workflow.input.underlying}}"
          observed_value: "{{workflow.input.observed_value}}"

      # (2) Spreads einordnen. Depends only on enrich, so it runs in
      # parallel with (3).
      - id: analyst
        type: agent
        agent_name: bsg-quote-analyst
        depends_on: [enrich]
        instruction: >-
          Compare the alerting issuer's spreads against its own
          15-minute history and against both peer issuers over exactly
          the seconds the alert's condition has held, and draw the
          comparison chart. Return exactly these keys: issuer,
          spread_since_alert_pct, spread_window_mean_pct,
          factor_vs_window, peer_spread_since_alert_pct,
          affected_products, chart_artifact, findings.
        input:
          # The whole alert, exactly as the watcher published it: the
          # enrich node only echoes the fields it was given, so taking
          # the alert from the workflow input keeps every field.
          alert: "{{workflow.input}}"
          statistics: "{{enrich.output.mcp_structured_content.statistics}}"
        output_schema_override:
          type: object
          required: [issuer, spread_since_alert_pct, spread_window_mean_pct,
                     factor_vs_window, peer_spread_since_alert_pct,
                     affected_products, chart_artifact, findings]
          properties:
            issuer: {type: string}
            spread_since_alert_pct: {type: number}
            spread_window_mean_pct: {type: number}
            factor_vs_window: {type: number}
            peer_spread_since_alert_pct:
              type: object
              additionalProperties: {type: number}
            affected_products: {type: integer}
            chart_artifact: {type: string}
            findings: {type: string}

      # (3) Marktkontext -- the structured verdict that drives the branch.
      - id: context
        type: agent
        agent_name: bsg-market-context
        depends_on: [enrich]
        instruction: >-
          Decide from the reference prices, the news and the peer
          issuers' spreads whether this anomaly is issuer specific or
          market wide. Return exactly these keys: scope, reasoning,
          reference_move_pct, high_impact_news.
        input:
          alert: "{{workflow.input}}"
          statistics: "{{enrich.output.mcp_structured_content.statistics}}"
        output_schema_override:
          type: object
          required: [scope, reasoning]
          properties:
            scope:
              type: string
              enum: [issuer_specific, market_wide]
            reasoning: {type: string}
            reference_move_pct: {type: number}
            high_impact_news: {type: boolean}

      # (4) Verzweigung. It also waits for the analyst, which keeps the
      # chart finished before (6) reads its name.
      - id: route
        type: switch
        depends_on: [analyst, context]
        cases:
          - condition: "'{{context.output.scope}}' == 'issuer_specific'"
            node: communicator_issuer
          - condition: "'{{context.output.scope}}' == 'market_wide'"
            node: communicator_market
        # An unresolvable verdict is the cautious branch: watch the
        # market, do not act against an issuer.
        default: communicator_market

      # (5a) Zweig emittentenspezifisch.
      - id: communicator_issuer
        type: agent
        agent_name: bsg-desk-communicator
        depends_on: [route]
        instruction: >-
          Zweig emittentenspezifisch. Schreibe die Desk-Note. Als
          empfohlenen nächsten Schritt nennst du die
          Plausibilitätsprüfung der Quotes dieses Emittenten durch den
          QLP. Gib genau den Schlüssel note zurück.
        input:
          analysis: "{{analyst.output}}"
          context: "{{context.output}}"
          alert: "{{workflow.input}}"
        output_schema_override:
          type: object
          required: [note]
          properties:
            note: {type: string}

      # (5b) Zweig marktweit.
      - id: communicator_market
        type: agent
        agent_name: bsg-desk-communicator
        depends_on: [route]
        instruction: >-
          Zweig marktweit. Schreibe die Desk-Note. Es handelt sich um
          eine marktweite Bewegung, also KEINE Maßnahme gegen einen
          Emittenten; als empfohlenen nächsten Schritt nennst du,
          die Marktlage zu beobachten und die Watch aktiv zu lassen.
          Gib genau den Schlüssel note zurück.
        input:
          analysis: "{{analyst.output}}"
          context: "{{context.output}}"
          alert: "{{workflow.input}}"
        output_schema_override:
          type: object
          required: [note]
          properties:
            note: {type: string}

      # (6) Desk-Note publizieren -- deterministic, no model. coalesce
      # picks the note of whichever branch ran.
      - id: publish
        type: tool
        connector: bsg-desk-tools
        tool: publish_desk_note
        depends_on: [communicator_issuer, communicator_market]
        timeout: "20s"
        input:
          watch_id: "{{workflow.input.watch_id}}"
          alert_id: "{{workflow.input.alert_id}}"
          issuer: "{{workflow.input.issuer}}"
          branch: "{{context.output.scope}}"
          chart_ref: "{{analyst.output.chart_artifact}}"
          workflow_run_id: "{{workflow.run_id}}"
          note:
            coalesce:
              - "{{communicator_issuer.output.note}}"
              - "{{communicator_market.output.note}}"
    output_mapping:
      branch: "{{context.output.scope}}"
      note:
        coalesce:
          - "{{communicator_issuer.output.note}}"
          - "{{communicator_market.output.note}}"
      chart_artifact: "{{analyst.output.chart_artifact}}"
