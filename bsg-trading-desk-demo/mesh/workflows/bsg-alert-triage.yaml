# DRAFT -- NOT APPLICABLE YET. scripts/install.sh refuses to apply the
# mesh while this file contains the marker __GATE0__.
#
# bsg-alert-triage: one run per alert from bsg/alerts/{watch_id}
# (event-mesh entrypoint bsg-desk-events, runtime-name workaround).
#
#   enrich (deterministic) -> analyst -> context -> BRANCH on scope
#     issuer_specific -> communicator_issuer -> publish (deterministic)
#     market_wide     -> communicator_market -> publish (deterministic)
#
# What is taken from the versions verified in this repo (2.225.14 /
# 2.348.22, see sam-insurance-ops-demo/triage/workflows/claim-triage.yaml):
# - A node WITHOUT `input:` receives the raw workflow input (the event
#   path delivers {"text": "<alert JSON>"}) as its input FILE plus its
#   `instruction`. A node WITH `input:` receives only that map, and
#   templates must be WHOLE-string values ({{workflow.input.text}},
#   {{node.output}}); embedded templates stay literal.
# - output_schema on a node = contract validated by the platform
#   (auto-retry on violation). Instructions describe CONTENT only,
#   never the answer format (else the structured artifact stays empty).
# - output_mapping is required; bump `version` to force a redeploy.
#
# GATE 0 (SAM 2.493.0 docs + `sam` CLI schema), decided with the
# owner on 2026-11-04:
# 1. Branch node: if 2.493.0 has no switch/conditional node type, STOP
#    and report version + upgrade path (no workaround).
# 2. Tool node: if there is a native tool/function node, enrich and
#    publish call the bsg-desk-tools MCP tools directly; otherwise
#    they run on the agent bsg-alert-runner (as drafted below).
# 3. Artifact hand-over between nodes (enrich -> analyst/context):
#    how 2.493.0 passes artifacts (names in the output, artifact refs,
#    shared session) -- adjust the inputs below.
# 4. A template variable for the run id (for publish_desk_note).
kind: workflow
name: bsg-alert-triage
description: >-
  Alert triage for the QLP desk: enriches a quote alert with the last
  15 minutes of quotes, reference prices and news, analyses the
  spreads, decides issuer specific vs. market wide, branches, writes
  the German desk note and publishes it onto the mesh.
spec:
  appConfig:
    version: "0.1.0"
    display_name: BSG Alert Triage
    description: >-
      From a quote alert to a desk note in under 60 seconds: enrich,
      analyse, classify, branch, write, publish.
    workflow_timeout: "90s"
    default_node_timeout: "45s"
    fail_fast: true
    skills:
      - id: bsg_alert_triage
        name: BSG alert triage
        description: >-
          Triage one quote alert of the BSG demo feed into a desk note
          (issuer specific or market wide).
    # Loose on purpose: the event path delivers {"text": "<alert>"}.
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: Event path only -- the alert payload as JSON string.
        watch_id: {type: string}
        alert_id: {type: string}
        issuer: {type: string}
        isin: {type: string}
        product_class: {type: string}
    output_schema:
      type: object
      required: [branch, note]
      properties:
        branch: {type: string}
        note: {type: string}
        chart_artifact: {type: string}
    nodes:
      # (1) deterministic: Alert anreichern
      - id: enrich
        type: agent
        agent_name: bsg-alert-runner
        instruction: >-
          Run the deterministic step enrich_alert on the alert in your
          input file, passing the alert JSON unchanged.
        output_schema:
          type: object
          required: [watch_id, issuer, product_class, datasets]
          properties:
            watch_id: {type: string}
            alert_id: {type: string}
            issuer: {type: string}
            product_class: {type: string}
            datasets:
              type: array
              items: {type: string}
              description: Artifact names of the attached data sets.
            statistics:
              type: string
              description: The tool's statistics block, verbatim JSON text.

      # (2) Agent bsg-quote-analyst
      - id: analyst
        type: agent
        agent_name: bsg-quote-analyst
        depends_on: [enrich]
        instruction: >-
          Analyse the spread anomaly of the alerting issuer against its
          15-minute history and against the peer issuers, using the
          quotes data set named in the enrichment, and create the
          spread chart.
        input:
          alert: "{{workflow.input.text}}"
          enrichment: "{{enrich.output}}"
        output_schema:
          type: object
          required: [issuer, spread_last_60s_pct, spread_window_mean_pct,
                     factor_vs_window, peer_spread_last_60s_pct,
                     affected_products, chart_artifact, findings]
          properties:
            issuer: {type: string}
            spread_last_60s_pct: {type: number}
            spread_window_mean_pct: {type: number}
            factor_vs_window: {type: number}
            peer_spread_last_60s_pct:
              type: object
              additionalProperties: {type: number}
            affected_products: {type: integer}
            chart_artifact: {type: string}
            findings: {type: string}

      # (3) Agent bsg-market-context -> structured verdict for the branch
      - id: context
        type: agent
        agent_name: bsg-market-context
        depends_on: [analyst]
        instruction: >-
          Decide whether the anomaly is issuer specific or market wide
          from the reference prices, the news and the peer spreads.
        input:
          alert: "{{workflow.input.text}}"
          enrichment: "{{enrich.output}}"
          analysis: "{{analyst.output}}"
        output_schema:
          type: object
          required: [scope, reasoning]
          properties:
            scope:
              type: string
              enum: [issuer_specific, market_wide]
            reasoning: {type: string}
            reference_move_pct: {type: number}
            high_impact_news: {type: boolean}

      # (4) BRANCH on {{context.output.scope}}
      # __GATE0__ replace with the branch node of SAM 2.493.0 (switch /
      # conditional), routing issuer_specific -> communicator_issuer and
      # market_wide -> communicator_market. No workaround if absent.

      # (5a) Agent bsg-desk-communicator, branch issuer_specific
      - id: communicator_issuer
        type: agent
        agent_name: bsg-desk-communicator
        depends_on: [context]
        instruction: >-
          Zweig emittentenspezifisch: Schreibe die Desk-Note. Empfohlener
          nächster Schritt: Plausibilitätsprüfung der Quotes dieses
          Emittenten durch den QLP starten.
        input:
          analysis: "{{analyst.output}}"
          context: "{{context.output}}"
        output_schema:
          type: object
          required: [note]
          properties:
            note: {type: string}

      # (5b) Agent bsg-desk-communicator, branch market_wide
      - id: communicator_market
        type: agent
        agent_name: bsg-desk-communicator
        depends_on: [context]
        instruction: >-
          Zweig marktweit: Schreibe die Desk-Note. Marktweite Bewegung,
          keine Emittentenmaßnahme; empfohlener nächster Schritt:
          Marktlage beobachten, Watch aktiv lassen.
        input:
          analysis: "{{analyst.output}}"
          context: "{{context.output}}"
        output_schema:
          type: object
          required: [note]
          properties:
            note: {type: string}

      # (6) deterministic: Desk-Note publizieren
      # __GATE0__ input must take the note of whichever communicator ran
      # (branch-node output reference of 2.493.0) and the run id.
      - id: publish
        type: agent
        agent_name: bsg-alert-runner
        depends_on: [communicator_issuer, communicator_market]
        instruction: >-
          Run the deterministic step publish_desk_note with watch_id,
          alert_id and issuer from the enrichment, the note, the branch
          (the context's scope) and the chart artifact name.
        input:
          enrichment: "{{enrich.output}}"
          context: "{{context.output}}"
          analysis: "{{analyst.output}}"
        output_schema:
          type: object
          required: [status, topic]
          properties:
            status: {type: string}
            topic: {type: string}
    output_mapping:
      branch: "{{context.output.scope}}"
      note: "__GATE0__"
      chart_artifact: "{{analyst.output.chart_artifact}}"
