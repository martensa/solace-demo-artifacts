# Template -- DO NOT COMMIT a populated version.
# Replace the three CHANGEME values before `kubectl apply`.
apiVersion: v1
kind: Secret
metadata:
  name: solace-eventportal-bridge
  namespace: openmetadata-solace-lab
type: Opaque
stringData:
  # Event Portal API token with read access on the demo domains.
  # Generate at: https://console.solace.cloud (Token Management)
  EP_API_TOKEN: "CHANGEME"

  # Shared secret between Event Portal webhook subscription and the bridge.
  # Pick a long random string; the bridge validates HMAC-SHA256 of every
  # incoming webhook against this. Rotate via Secret update + register-webhook.
  EP_WEBHOOK_SECRET: "CHANGEME"

  # OM ingestion-bot JWT. Fetch from OM UI:
  # Settings -> Bots -> ingestion-bot -> Token
  OM_JWT_TOKEN: "CHANGEME"
