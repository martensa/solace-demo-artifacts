{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "solace-eventportal-bridge.fullname" . }}-otel
  labels:
    {{- include "solace-eventportal-bridge.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
    exporters:
      {{- if .Values.otelCollector.exporterEndpoint }}
      otlphttp:
        endpoint: {{ .Values.otelCollector.exporterEndpoint | quote }}
      {{- else }}
      # No downstream configured -> log to the collector's own stdout.
      debug:
        verbosity: normal
      {{- end }}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [{{ if .Values.otelCollector.exporterEndpoint }}otlphttp{{ else }}debug{{ end }}]
{{- end }}
