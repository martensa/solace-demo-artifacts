{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "solace-eventportal-connector.fullname" . }}
  labels:
    {{- include "solace-eventportal-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Plain K8s Secret (v1.0 decision). For production, set
  # secret.existingSecret to a Vault-synced Secret instead (v1.1).
  {{ .Values.secret.epApiTokenKey }}: {{ required "secret.epApiToken is required when secret.existingSecret is unset" .Values.secret.epApiToken | quote }}
  {{ .Values.secret.omJwtTokenKey }}: {{ required "secret.omJwtToken is required when secret.existingSecret is unset" .Values.secret.omJwtToken | quote }}
  {{- if .Values.secret.epWebhookSecret }}
  {{ .Values.secret.epWebhookSecretKey }}: {{ .Values.secret.epWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secret.solacePassword }}
  {{ .Values.secret.solacePasswordKey }}: {{ .Values.secret.solacePassword | quote }}
  {{- end }}
{{- end }}
