[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmetadata-solace-eventportal-connector"
version = "0.8.0"
description = "OpenMetadata custom Messaging connector + webhook bridge for Solace Event Portal"
readme = "README.md"
# Bumped to py3.10 in Wave 0 (OM 1.11 dropped py3.9). Aligns with the
# upstream openmetadata-ingestion 1.11.x target.
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Solace", email = "noreply@example.org" }
]
dependencies = [
    # The OM ingestion image already pins openmetadata-ingestion; we only
    # add runtime deps that aren't part of the base image. SDK version
    # is enforced via the Docker base image tag (OM_INGESTION_VERSION),
    # currently pinned to ALDI's exact server version 1.11.0.0.
    "requests>=2.31",
    # We only use urllib3.util.retry.Retry (stable API 1.x <-> 2.x). Don't
    # over-constrain: the OM base image transitively requires urllib3 1.x
    # via collate-data-diff + tableauserverclient. Letting pip resolve
    # avoids the "incompatible urllib3" install-time warnings.
    "urllib3>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "responses>=0.24",
    "ruff>=0.1",
]
# Webhook bridge — HTTP receiver + Prometheus metrics (Wave 5 / #10)
bridge = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.20",
]
# Webhook bridge — Solace consumer transport (optional)
bridge-solace = [
    "solace-pubsubplus>=1.5",
]
# OpenTelemetry tracing for the bridge (Wave 5 / #63). Kept OUT of the
# connector core deps so the OM ingestion image stays lean; the bridge
# image installs it explicitly (see Dockerfile.bridge).
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Live sample-data ingest via Solace broker subscribe (optional)
sample-data = [
    "solace-pubsubplus>=1.5",
]

[project.scripts]
om-eventportal-bridge = "bridge.main:main"
om-eventportal-bootstrap = "connector.bootstrap:main"

[tool.setuptools.packages.find]
include = ["connector*", "bridge*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
